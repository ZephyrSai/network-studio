    const out = new Uint8Array(localSize + centralSize + 22);
    const view = new DataView(out.buffer);
    let p = 0;
    const FLAGS = 0x0800; // bit 11: names are UTF-8
    for (const e of entries) {
      view.setUint32(p, 0x04034B50, true);
      view.setUint16(p + 4, 20, true);          // version needed 2.0
      view.setUint16(p + 6, FLAGS, true);
      view.setUint16(p + 8, 0, true);           // STORE
      view.setUint16(p + 10, dt.time, true);
      view.setUint16(p + 12, dt.date, true);
      view.setUint32(p + 14, e.crc, true);
      view.setUint32(p + 18, e.data.length, true);
      view.setUint32(p + 22, e.data.length, true);
      view.setUint16(p + 26, e.nameBytes.length, true);
      view.setUint16(p + 28, 0, true);
      out.set(e.nameBytes, p + 30);
      out.set(e.data, p + 30 + e.nameBytes.length);
      p += 30 + e.nameBytes.length + e.data.length;
    }
    const cdStart = p;
    for (const e of entries) {
      view.setUint32(p, 0x02014B50, true);
      view.setUint16(p + 4, 20, true);          // version made by (MS-DOS, 2.0)
      view.setUint16(p + 6, 20, true);          // version needed
      view.setUint16(p + 8, FLAGS, true);
      view.setUint16(p + 10, 0, true);
      view.setUint16(p + 12, dt.time, true);
      view.setUint16(p + 14, dt.date, true);
      view.setUint32(p + 16, e.crc, true);
      view.setUint32(p + 20, e.data.length, true);
      view.setUint32(p + 24, e.data.length, true);
      view.setUint16(p + 28, e.nameBytes.length, true);
      view.setUint16(p + 30, 0, true);          // extra
      view.setUint16(p + 32, 0, true);          // comment
      view.setUint16(p + 34, 0, true);          // disk
      view.setUint16(p + 36, 0, true);          // internal attrs
      view.setUint32(p + 38, 0, true);          // external attrs
      view.setUint32(p + 42, e.offset, true);
      out.set(e.nameBytes, p + 46);
      p += 46 + e.nameBytes.length;
    }
    view.setUint32(p, 0x06054B50, true);
    view.setUint16(p + 4, 0, true);
    view.setUint16(p + 6, 0, true);
    view.setUint16(p + 8, entries.length, true);
    view.setUint16(p + 10, entries.length, true);
    view.setUint32(p + 12, p - cdStart, true);
    view.setUint32(p + 16, cdStart, true);
    view.setUint16(p + 20, 0, true);
    return out;
  }

  /* ------------------------------------------------------------------ */
  /* ShapeSheet XML helpers                                              */
  /* ------------------------------------------------------------------ */
  /* Numeric cell. */
  function cN(n, v, u, f) {
    return '<Cell N="' + n + '" V="' + fmt(v) + '"' + (u ? ' U="' + u + '"' : '') + (f ? ' F="' + escAttr(f) + '"' : '') + '/>';
  }
  /* String cell (colour, font, text values). */
  function cS(n, v, u, f) {
    return '<Cell N="' + n + '" V="' + escAttr(v) + '"' + (u ? ' U="' + u + '"' : '') + (f ? ' F="' + escAttr(f) + '"' : '') + '/>';
  }
  function bool(b) { return b ? 1 : 0; }

  /* Visio row names must be identifiers: ASCII letters/digits/underscore, not starting with a digit. */
  function rowName(label, used, fallback) {
    let s = clean(label);
    if (s.normalize) s = s.normalize('NFKD');
    s = s.replace(/[^A-Za-z0-9_]+/g, '_').replace(/_+/g, '_').replace(/^_+|_+$/g, '');
    if (!s) s = fallback;
    if (/^[0-9]/.test(s)) s = 'P_' + s;
    if (s.length > 60) s = s.slice(0, 60);
    let name = s, i = 2;
    while (used[name.toLowerCase()]) name = s + '_' + (i++);
    used[name.toLowerCase()] = true;
    return name;
  }

  /* ------------------------------------------------------------------ */
  /* Text                                                                */
  /* ------------------------------------------------------------------ */
  function charEm(ch) {
    const c = ch.charCodeAt(0);
    if (ch === ' ') return 0.29;
    if ('iljI.,:;|!\'`'.indexOf(ch) !== -1) return 0.28;
    if ('ftr()[]{}-/\\"*'.indexOf(ch) !== -1) return 0.39;
    if ('mwMW@%'.indexOf(ch) !== -1) return 0.88;
    if (c >= 65 && c <= 90) return 0.66;
    if (c >= 48 && c <= 57) return 0.58;
    if (c >= 0x2E80) return 1.0;
    return 0.57;
  }
  function measure(ti) {
    let maxEm = 0;
    for (const line of ti.lines) {
      let em = 0;
      for (const ch of line) em += charEm(ch);
      if (em > maxEm) maxEm = em;
    }
    const k = (ti.bold ? 1.07 : 1) * ti.size * PT;
    return { w: maxEm * k, h: ti.lines.length * ti.size * 1.2 * PT };
  }

  const HALIGN = { left: 0, start: 0, center: 1, middle: 1, right: 2, end: 2, justify: 3 };
  const VALIGN = { top: 0, middle: 1, center: 1, bottom: 2 };

  function textInfo(o) {
    if (o.text === null || o.text === undefined) return null;
    const text = clean(String(o.text)).replace(/\r\n?/g, '\n');
    if (!text.length) return null;
    const col = parseColor(o.textColor) || { hex: '#000000', alpha: 1 };
    const a = String(o.align || 'center').toLowerCase();
    const va = String(o.valign || o.verticalAlign || 'middle').toLowerCase();
    return {
      text,
      lines: text.split('\n'),
      size: clamp(toNum(o.textSize, 9), 1, 1600),
      color: col.hex,
      colorTrans: 1 - col.alpha,
      bold: !!o.bold,
      italic: !!o.italic,
      underline: !!o.underline,
      font: clean(o.font || 'Segoe UI') || 'Segoe UI',
      align: HALIGN[a] !== undefined ? HALIGN[a] : 1,
      valign: VALIGN[va] !== undefined ? VALIGN[va] : 1,
      padding: toNum(o.padding, null),
    };
  }

  /*
   * Widen a text box (shape-local, Y down) so Visio does not wrap lines that the
   * editor shows on one line (font metrics differ slightly). mode 'grow' always
   * fits the longest explicit line; 'tolerant' only fixes small overflows so
   * deliberately wrapped text blocks keep wrapping.
   */
  function fitBox(ti, box, mode, padIn) {
    const m = measure(ti);
    let x = box.x, w = box.w;
    const need = m.w * 1.1 + 2 * padIn + 0.04;
    if (need > w && (mode === 'grow' || need <= w * 1.3 + 0.1)) {
      const dw = need - w;
      if (ti.align === 1 || ti.align === 3) x -= dw / 2;
      else if (ti.align === 2) x -= dw;
      w = need;
    }
    return { x, y: box.y, w, h: Math.max(box.h, 1e-4) };
  }

  /* Text transform + text block cells. box is Visio-local (Y up) {cx, cy, w, h}. */
  function textCells(ti, box, padIn, bkgnd, autoSize) {
    const out = [];
    out.push(cN('TxtPinX', box.cx), cN('TxtPinY', box.cy));
    // autoSize: label box follows text edits in Visio (like the Dynamic connector master).
    out.push(cN('TxtWidth', box.w, null, autoSize ? 'TEXTWIDTH(TheText)' : null),
      cN('TxtHeight', box.h, null, autoSize ? 'TEXTHEIGHT(TheText,TxtWidth)' : null));
    out.push(cN('TxtLocPinX', box.w / 2, null, 'TxtWidth*0.5'), cN('TxtLocPinY', box.h / 2, null, 'TxtHeight*0.5'), cN('TxtAngle', 0));
    out.push(cN('LeftMargin', padIn, 'PT'), cN('RightMargin', padIn, 'PT'), cN('TopMargin', padIn, 'PT'), cN('BottomMargin', padIn, 'PT'));
    out.push(cN('VerticalAlign', ti.valign));
    if (bkgnd) out.push(cS('TextBkgnd', bkgnd), cN('TextBkgndTrans', 0));
    else out.push(cN('TextBkgnd', 0));
    return out.join('');
  }
  function textSections(ti) {
    const style = (ti.bold ? 1 : 0) | (ti.italic ? 2 : 0) | (ti.underline ? 4 : 0);
    return '<Section N="Character"><Row IX="0">' +
      cS('Font', ti.font) + cS('Color', ti.color) + cN('Style', style) + cN('Case', 0) + cN('Pos', 0) +
      cN('FontScale', 1) + cN('Size', ti.size * PT, 'PT') + cN('DblUnderline', 0) + cN('Overline', 0) +
      cN('Strikethru', 0) + cN('Letterspace', 0) + cN('ColorTrans', clamp01(ti.colorTrans)) +
      '</Row></Section>' +
      '<Section N="Paragraph"><Row IX="0">' +
      cN('IndFirst', 0) + cN('IndLeft', 0) + cN('IndRight', 0) + cN('SpLine', -1.2, 'PER') + cN('SpBefore', 0) +
      cN('SpAfter', 0) + cN('HorzAlign', ti.align) + cN('Bullet', 0) + cN('Flags', 0) +
      '</Row></Section>';
  }
  function textElement(ti) {
    return '<Text><cp IX="0"/><pp IX="0"/>' + escText(ti.text) + '</Text>';
  }

  /* ------------------------------------------------------------------ */
  /* Shape Data, hyperlinks, layers                                      */
  /* ------------------------------------------------------------------ */
  function propSection(data) {
    if (!Array.isArray(data) || !data.length) return '';
    const used = {};
    const rows = [];
    data.forEach((d, i) => {
      if (!d) return;
      const label = clean(d.label !== undefined ? d.label : (d.name !== undefined ? d.name : ''));
      const value = d.value === null || d.value === undefined ? '' : String(d.value);
      const name = rowName(d.name || label, used, 'Prop' + (i + 1));
      rows.push('<Row N="' + escAttr(name) + '">' + cS('Value', value, 'STR') + cS('Label', label || name) +
        cN('Type', 0) + cN('Invisible', bool(d.invisible)) + cN('Verify', 0) + '</Row>');
    });
    return rows.length ? '<Section N="Property">' + rows.join('') + '</Section>' : '';
  }
  function hyperlinkSection(h) {
    if (!h) return '';
    const list = Array.isArray(h) ? h : [h];
    const rows = [];
    list.forEach((it) => {
      const o = typeof it === 'string' ? { address: it } : (it || {});
      const addr = clean(o.address || o.url || o.href || '');
      const sub = clean(o.subAddress || '');
      if (!addr && !sub) return;
      rows.push('<Row N="Row_' + (rows.length + 1) + '">' + cS('Description', o.description || addr) + cS('Address', addr) +
        (sub ? cS('SubAddress', sub) : '') + cN('NewWindow', bool(o.newWindow)) + cN('Default', rows.length === 0 ? 1 : 0) +
        cN('Invisible', 0) + '</Row>');
    });
    return rows.length ? '<Section N="Hyperlink">' + rows.join('') + '</Section>' : '';
  }
  function layerCell(layers, count) {
    if (!Array.isArray(layers) || !count) return '';
    const seen = {};
    const ix = [];
    for (const l of layers) {
      const n = Math.round(Number(l));
      if (isFinite(n) && n >= 0 && n < count && !seen[n]) { seen[n] = true; ix.push(n); }
    }
    return ix.length ? cS('LayerMember', ix.join(';')) : '';
  }

  /* ------------------------------------------------------------------ */
  /* Geometry & style buckets                                            */
  /* ------------------------------------------------------------------ */
  function prepGeom(g) {
    const pts = normPoints(g && g.points);
    if (pts.length < 2) return null;
    const closed = !!g.closed && pts.length >= 3;
    const fc = closed ? parseColor(g.fill) : null;
    const sc = parseColor(g.stroke);
    const weight = toNum(g.weight, 0.75);
    const fill = fc ? { hex: fc.hex, trans: clamp01(1 - clamp01(toNum(g.fillOpacity, 1)) * fc.alpha) } : null;
    const line = (sc && weight > 0) ? {
      hex: sc.hex,
      trans: clamp01(1 - clamp01(toNum(g.strokeOpacity, 1)) * sc.alpha),
      weight,
      pattern: linePattern(g.dash),
    } : null;
    if (fill && fill.trans >= 0.999) return { pts, closed, fill: null, line, bb: bboxOf(pts, line ? weight * PT / 2 + 0.002 : 0.002) };
    return { pts, closed, fill, line, bb: bboxOf(pts, line ? weight * PT / 2 + 0.002 : 0.002) };
  }
  function fillKey(f) { return f.hex + '|' + fmt(f.trans, 4); }
  function lineKey(l) { return l.hex + '|' + fmt(l.trans, 4) + '|' + fmt(l.weight, 4) + '|' + l.pattern; }
  function compatible(b, g) {
    if (g.fill && b.fill && fillKey(g.fill) !== fillKey(b.fill)) return false;
    if (g.line && b.line && lineKey(g.line) !== lineKey(b.line)) return false;
    return true;
  }
  /*
   * Split a shape's geometries into style buckets (one Visio shape each), keeping
   * the visual stacking order: a geometry may only join an earlier bucket when it
   * does not overlap anything drawn in between, and never in a way that would put
   * an earlier outline above its fill (Visio paints a shape's fills before lines).
   */
  function bucketize(geoms) {
    const buckets = [];
    for (const g of geoms) {
      if (!g || (!g.fill && !g.line)) continue;
      let placed = false;
      for (let k = buckets.length - 1; k >= 0; k--) {
        const b = buckets[k];
        if (compatible(b, g)) {
          const conflict = g.fill && b.geoms.some((h) => h.line && overlaps(h.bb, g.bb));
          if (!conflict) {
            b.geoms.push(g);
            if (!b.fill && g.fill) b.fill = g.fill;
            if (!b.line && g.line) b.line = g.line;
            placed = true;
            break;
          }
        }
        if (b.geoms.some((h) => overlaps(h.bb, g.bb))) break;
      }
      if (!placed) buckets.push({ geoms: [g], fill: g.fill, line: g.line });
    }
    return buckets;
  }

  function lineFillCells(b) {
    const out = [];
    if (b.line) {
      out.push(cN('LineWeight', b.line.weight * PT, 'PT'), cS('LineColor', b.line.hex), cN('LinePattern', b.line.pattern),
        cN('LineColorTrans', b.line.trans), cN('LineCap', 0), cN('Rounding', 0));
    } else {
      out.push(cN('LinePattern', 0));
    }
    if (b.fill) {
      out.push(cS('FillForegnd', b.fill.hex), cN('FillForegndTrans', b.fill.trans), cS('FillBkgnd', b.fill.hex),
        cN('FillBkgndTrans', b.fill.trans), cN('FillPattern', 1));
    } else {
      out.push(cN('FillPattern', 0));
    }
    out.push(cN('ShdwPattern', 0));
    return out.join('');
  }

  /* One Geometry section. pts are shape-local IR coords (Y down); W,H shape size. */
  function geomSection(ix, pts, closed, noFill, noLine, W, H) {
    const p = pts.slice();
    if (closed) {
      const a = p[0], z = p[p.length - 1];
      if (Math.abs(a[0] - z[0]) > EPS || Math.abs(a[1] - z[1]) > EPS) p.push([a[0], a[1]]);
    }
    const rel = W > 1e-6 && H > 1e-6;
    let s = '<Section N="Geometry" IX="' + ix + '">' + cN('NoFill', bool(noFill)) + cN('NoLine', bool(noLine)) +
      cN('NoShow', 0) + cN('NoSnap', 0) + cN('NoQuickDrag', 0);
    for (let i = 0; i < p.length; i++) {
      const lx = p[i][0], ly = H - p[i][1];
      const t = (i === 0 ? 'MoveTo' : 'LineTo');
      s += '<Row T="' + (rel ? 'Rel' + t : t) + '" IX="' + (i + 1) + '">' +
        cN('X', rel ? lx / W : lx) + cN('Y', rel ? ly / H : ly) + '</Row>';
    }
    return s + '</Section>';
  }
  function bucketGeometry(b, W, H) {
    return b.geoms.map((g, i) => geomSection(i, g.pts, g.closed, !(g.fill && g.closed), !g.line, W, H)).join('');
  }

  /* ------------------------------------------------------------------ */
  /* Per-page shape emission                                             */
  /* ------------------------------------------------------------------ */
  function xform2D(x, y, w, h, angleDeg, pageH) {
    let a = -toNum(angleDeg, 0) * Math.PI / 180;
    a = Math.atan2(Math.sin(a), Math.cos(a));
    if (Math.abs(a) < 1e-12) a = 0;
    return cN('PinX', x + w / 2) + cN('PinY', pageH - (y + h / 2)) + cN('Width', w) + cN('Height', h) +
      cN('LocPinX', w / 2, null, 'Width*0.5') + cN('LocPinY', h / 2, null, 'Height*0.5') + cN('Angle', a) +
      cN('FlipX', 0) + cN('FlipY', 0) + cN('ResizeMode', 0);
  }

  function boxOf(s) {
    const x = toNum(s.x, 0), y = toNum(s.y, 0);
    const w = Math.max(0, toNum(s.w !== undefined ? s.w : s.width, 0));
    const h = Math.max(0, toNum(s.h !== undefined ? s.h : s.height, 0));
    return { x, y, w, h };
  }

  function shapeOpen(id, type, name) {
    const nm = name ? escAttr(name) : '';
    return '<Shape ID="' + id + '"' + (nm ? ' NameU="' + nm + '" IsCustomNameU="1" Name="' + nm + '" IsCustomName="1"' : '') +
      ' Type="' + type + '" LineStyle="0" FillStyle="0" TextStyle="0">';
  }

  function inferKind(s) {
    const k = String(s.kind || '').toLowerCase();
    if (k === 'shape' || k === 'connector' || k === 'text' || k === 'image') return k;
    if (k === 'line' || k === 'edge' || k === 'link') return 'connector';
    if (Array.isArray(s.points) && s.w === undefined) return 'connector';
    if (s.data && s.mime) return 'image';
    if (Array.isArray(s.geoms)) return 'shape';
    return 'text';
  }

  function uniqueName(ctx, base, id) {
    const b = clean(base).replace(/\s+/g, ' ').trim();
    if (!b) return '';
    const key = b.toLowerCase();
    if (!ctx.names[key]) { ctx.names[key] = true; return b; }
    let n = b + '.' + id, k = 2;
    while (ctx.names[n.toLowerCase()]) n = b + '.' + id + '_' + (k++);
    ctx.names[n.toLowerCase()] = true;
    return n;
  }

  /* Text box for a 2D element, returned in Visio local coords. */
  function textBoxLocal(ti, tb, H, mode, padIn) {
    const fb = fitBox(ti, tb, mode, padIn);
    return { cx: fb.x + fb.w / 2, cy: H - (fb.y + fb.h / 2), w: fb.w, h: fb.h };
  }

  function emitShape(ctx, item, pageH) {
    const s = item.ir;
    const { x, y, w, h } = item.box;
    const ti = textInfo(s);
    const padIn = ti && ti.padding !== null ? ti.padding * PT : 0;
    const layer = layerCell(s.layers, ctx.layerCount);
    const name = uniqueName(ctx, s.name || '', item.id);
    const buckets = item.buckets;
    const isGroup = buckets.length > 1;
    let out = shapeOpen(item.id, isGroup ? 'Group' : 'Shape', name);
    out += xform2D(x, y, w, h, s.angle, pageH);
    if (layer) out += layer;
    if (isGroup) {
      out += cN('SelectMode', 1) + cN('DisplayMode', 2) + cN('IsTextEditTarget', 1) + cN('LinePattern', 0) + cN('FillPattern', 0);
    } else if (buckets.length === 1) {
      out += lineFillCells(buckets[0]);
    } else {
      out += cN('LinePattern', 0) + cN('FillPattern', 0);
    }
    if (ti) {
      const tb = s.textBox ? boxOf(s.textBox) : { x: 0, y: 0, w, h };
      out += textCells(ti, textBoxLocal(ti, tb, h, 'grow', padIn), padIn, null);
    }
    out += propSection(s.data) + hyperlinkSection(s.hyperlink);
    if (ti) out += textSections(ti);
    if (!isGroup) {
      if (buckets.length === 1) out += bucketGeometry(buckets[0], w, h);
      else out += geomSection(0, [[0, 0], [w, 0], [w, h], [0, h]], true, true, true, w, h); // invisible hit area
    }
    if (ti) out += textElement(ti);
    if (isGroup) {
      out += '<Shapes>';
      buckets.forEach((b, i) => {
        const gid = item.id;
        out += shapeOpen(item.memberIds[i], 'Shape', '');
        out += cN('PinX', w / 2, null, 'Sheet.' + gid + '!Width*0.5') + cN('PinY', h / 2, null, 'Sheet.' + gid + '!Height*0.5') +
          cN('Width', w, null, 'Sheet.' + gid + '!Width') + cN('Height', h, null, 'Sheet.' + gid + '!Height') +
          cN('LocPinX', w / 2, null, 'Width*0.5') + cN('LocPinY', h / 2, null, 'Height*0.5') + cN('Angle', 0) +
          cN('FlipX', 0) + cN('FlipY', 0) + cN('ResizeMode', 0);
        if (layer) out += layer;
        out += lineFillCells(b) + bucketGeometry(b, w, h) + '</Shape>';
      });
      out += '</Shapes>';
    }
    return out + '</Shape>';
  }

  function emitText(ctx, item, pageH) {
    const s = item.ir;
    const { x, y, w, h } = item.box;
    const ti = textInfo(s);
    const fc = parseColor(s.fill);
    const sc = parseColor(s.stroke);
    const weight = toNum(s.weight, 0.75);
    const b = {
      fill: fc ? { hex: fc.hex, trans: clamp01(1 - clamp01(toNum(s.fillOpacity, 1)) * fc.alpha) } : null,
      line: sc && weight > 0 ? { hex: sc.hex, trans: 1 - sc.alpha, weight, pattern: linePattern(s.dash) } : null,
    };
    const padPt = ti && ti.padding !== null ? ti.padding : ((b.fill || b.line) ? 3 : 0);
    const name = uniqueName(ctx, s.name || '', item.id);
    let out = shapeOpen(item.id, 'Shape', name) + xform2D(x, y, w, h, s.angle, pageH);
    const layer = layerCell(s.layers, ctx.layerCount);
    if (layer) out += layer;
    out += lineFillCells(b);
    if (ti) out += textCells(ti, textBoxLocal(ti, { x: 0, y: 0, w, h }, h, 'tolerant', padPt * PT), padPt * PT, null);
    out += propSection(s.data) + hyperlinkSection(s.hyperlink);
    if (ti) out += textSections(ti);
    out += geomSection(0, [[0, 0], [w, 0], [w, h], [0, h]], true, !b.fill, !b.line, w, h);
    if (ti) out += textElement(ti);
    return out + '</Shape>';
  }

  function emitImage(ctx, item, pageH, pageCtx) {
    const s = item.ir;
    const { x, y, w, h } = item.box;
    const name = uniqueName(ctx, s.name || '', item.id);
    const layer = layerCell(s.layers, ctx.layerCount);
    const img = item.image;
    if (!img) {
      // Unsupported/empty image data: keep the footprint as a light placeholder box.
      return emitText(ctx, Object.assign({}, item, {
        ir: Object.assign({}, s, { kind: 'text', text: s.text || '', fill: '#F2F2F2', stroke: '#A6A6A6' }),
      }), pageH);
    }
    const rid = addPageImage(ctx, pageCtx, img);
    let out = shapeOpen(item.id, 'Foreign', name) + xform2D(x, y, w, h, s.angle, pageH);
    if (layer) out += layer;
    out += cN('ImgOffsetX', 0, null, 'ImgWidth*0') + cN('ImgOffsetY', 0, null, 'ImgHeight*0') +
      cN('ImgWidth', w, null, 'Width*1') + cN('ImgHeight', h, null, 'Height*1') + cN('LinePattern', 0) + cN('FillPattern', 0);
    out += propSection(s.data) + hyperlinkSection(s.hyperlink);
    out += geomSection(0, [[0, 0], [w, 0], [w, h], [0, h]], true, true, true, w, h);
    out += '<ForeignData ForeignType="Bitmap" CompressionType="' + img.compression + '"><Rel r:id="' + rid + '"/></ForeignData>';
    return out + '</Shape>';
  }

  function polylineMidpoint(P) {
    let total = 0;
    for (let i = 1; i < P.length; i++) total += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]);
    let half = total / 2;
    for (let i = 1; i < P.length; i++) {
      const L = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]);
      if (L >= half && L > 0) {
        const t = half / L;
        return [P[i - 1][0] + (P[i][0] - P[i - 1][0]) * t, P[i - 1][1] + (P[i][1] - P[i - 1][1]) * t];
      }
      half -= L;
    }
    return P[Math.floor(P.length / 2)];
  }

  function emitConnector(ctx, item, pageH, connects) {
    const s = item.ir;
    // Visio page coordinates (Y up).
    const P = item.points.map((p) => [p[0], pageH - p[1]]);
    const B = P[0], E = P[P.length - 1];
    const W = E[0] - B[0], H = E[1] - B[1];
    const sc = parseColor(s.stroke) || { hex: '#000000', alpha: 1 };
    const weight = toNum(s.weight, 0.75);
    const ortho = P.every((p, i) => i === 0 || Math.abs(p[0] - P[i - 1][0]) < 1e-6 || Math.abs(p[1] - P[i - 1][1]) < 1e-6);
    const fromId = item.fromId, toId = item.toId;
    const ti = textInfo(s);
    const name = uniqueName(ctx, s.name || 'Dynamic connector', item.id);
    let out = shapeOpen(item.id, 'Shape', name);
    // Same cell pattern as Visio's Dynamic connector master: page-aligned local frame
    // (Angle 0), local origin at the begin point, Width/Height may be negative.
    out += cN('PinX', (B[0] + E[0]) / 2, null, 'GUARD((BeginX+EndX)/2)') + cN('PinY', (B[1] + E[1]) / 2, null, 'GUARD((BeginY+EndY)/2)') +
      cN('Width', W, null, 'GUARD(EndX-BeginX)') + cN('Height', H, null, 'GUARD(EndY-BeginY)') +
      cN('LocPinX', W / 2, null, 'GUARD(Width*0.5)') + cN('LocPinY', H / 2, null, 'GUARD(Height*0.5)') +
      cN('Angle', 0, null, 'GUARD(0DA)') + cN('FlipX', 0, null, 'GUARD(FALSE)') + cN('FlipY', 0, null, 'GUARD(FALSE)') +
      cN('ResizeMode', 0);
    out += cN('BeginX', B[0], null, fromId ? '_WALKGLUE(BegTrigger,EndTrigger,WalkPreference)' : null) +
      cN('BeginY', B[1], null, fromId ? '_WALKGLUE(BegTrigger,EndTrigger,WalkPreference)' : null) +
      cN('EndX', E[0], null, toId ? '_WALKGLUE(EndTrigger,BegTrigger,WalkPreference)' : null) +
      cN('EndY', E[1], null, toId ? '_WALKGLUE(EndTrigger,BegTrigger,WalkPreference)' : null);
    if (fromId) out += cN('BegTrigger', 2, null, '_XFTRIGGER(Sheet.' + fromId + '!EventXFMod)');
    if (toId) out += cN('EndTrigger', 2, null, '_XFTRIGGER(Sheet.' + toId + '!EventXFMod)');
    // Routing: keep the stored route (re-route only when Visio decides it must).
    out += cN('ObjType', 2) + cN('ShapeRouteStyle', ortho ? 1 : 2) + cN('ConLineRouteExt', 1) +
      cN('ConFixedCode', 1) + cN('NoAlignBox', 1);
    const layer = layerCell(s.layers, ctx.layerCount);
    if (layer) out += layer;
    out += cN('LineWeight', weight * PT, 'PT') + cS('LineColor', sc.hex) + cN('LinePattern', weight > 0 ? linePattern(s.dash) : 0) +
      cN('LineColorTrans', clamp01(1 - sc.alpha * clamp01(toNum(s.strokeOpacity, 1)))) + cN('LineCap', 0) + cN('Rounding', 0) +
      cN('BeginArrow', arrowIndex(s.beginArrow)) + cN('EndArrow', arrowIndex(s.endArrow)) +
      cN('BeginArrowSize', clamp(Math.round(toNum(s.arrowSize, 2)), 0, 6)) + cN('EndArrowSize', clamp(Math.round(toNum(s.arrowSize, 2)), 0, 6)) +
      cN('FillPattern', 0) + cN('ShdwPattern', 0);
    if (ti) {
      let L;
      if (Array.isArray(s.textPos) && isFinite(s.textPos[0]) && isFinite(s.textPos[1])) L = [Number(s.textPos[0]), pageH - Number(s.textPos[1])];
      else L = polylineMidpoint(P);
      const padIn = (ti.padding !== null ? ti.padding : 1.5) * PT;
      const m = measure(ti);
      const tw = m.w * 1.15 + 2 * padIn + 0.04, th = m.h + 2 * padIn;
      out += textCells(ti, { cx: L[0] - B[0], cy: L[1] - B[1], w: tw, h: th }, padIn, '#FFFFFF', true);
    }
    out += propSection(s.data) + hyperlinkSection(s.hyperlink);
    if (ti) out += textSections(ti);
    let g = '<Section N="Geometry" IX="0">' + cN('NoFill', 1) + cN('NoLine', 0) + cN('NoShow', 0) + cN('NoSnap', 0) + cN('NoQuickDrag', 0);
    P.forEach((p, i) => {
      g += '<Row T="' + (i === 0 ? 'MoveTo' : 'LineTo') + '" IX="' + (i + 1) + '">' + cN('X', p[0] - B[0]) + cN('Y', p[1] - B[1]) + '</Row>';
    });
    out += g + '</Section>';
    if (ti) out += textElement(ti);
    out += '</Shape>';
    if (fromId) connects.push('<Connect FromSheet="' + item.id + '" FromCell="BeginX" FromPart="9" ToSheet="' + fromId + '" ToCell="PinX" ToPart="3"/>');
    if (toId) connects.push('<Connect FromSheet="' + item.id + '" FromCell="EndX" FromPart="12" ToSheet="' + toId + '" ToCell="PinX" ToPart="3"/>');
    return out;
  }

  function addPageImage(ctx, pageCtx, img) {
    let media = ctx.mediaByKey[img.key];
    if (!media) {
      const n = ctx.media.length + 1;
      media = { file: 'image' + n + '.' + img.ext, bytes: img.bytes, ext: img.ext, mime: img.mime };
      ctx.media.push(media);
      ctx.mediaByKey[img.key] = media;
    }
    if (!pageCtx.relByFile[media.file]) {
      const rid = 'rId' + (pageCtx.rels.length + 1);
      pageCtx.rels.push({ id: rid, type: REL.image, target: '../media/' + media.file });
      pageCtx.relByFile[media.file] = rid;
    }
    return pageCtx.relByFile[media.file];
  }

  /* Build PageContents XML for one page. */
  function buildPage(ctx, page, pageCtx) {
    const pageH = page.height;
    const shapesIn = Array.isArray(page.ir.shapes) ? page.ir.shapes : [];
    // Pass 1: classify + assign unique IDs (group members included).
    let nextId = 1;
    const items = [];
    const idMap = {};
    for (const s of shapesIn) {
      if (!s || typeof s !== 'object') continue;
      const kind = inferKind(s);
      const item = { ir: s, kind };
      if (kind === 'connector') {
        item.points = normPoints(s.points);
        if (item.points.length < 2) continue;
      } else {
        item.box = boxOf(s);
        if (kind === 'shape') {
          item.buckets = bucketize((Array.isArray(s.geoms) ? s.geoms : []).map(prepGeom));
        } else if (kind === 'image') {
          const bytes = toBytes(s.data);
          const mime = sniffMime(bytes, s.mime);
          const t = IMAGE_TYPES[mime];
          if (t && bytes.length) item.image = { bytes, mime, ext: t.ext, compression: t.compression, key: mime + ':' + bytes.length + ':' + crc32(bytes) };
        }
      }
      item.id = nextId++;
      if (kind === 'shape' && item.buckets.length > 1) item.memberIds = item.buckets.map(() => nextId++);
      if (kind !== 'connector' && s.id !== undefined && s.id !== null && idMap[String(s.id)] === undefined) idMap[String(s.id)] = item.id;
      items.push(item);
    }
    for (const it of items) {
      if (it.kind !== 'connector') continue;
      const f = it.ir.from, t = it.ir.to;
      it.fromId = (f !== null && f !== undefined) ? (idMap[String(f)] || 0) : 0;
      it.toId = (t !== null && t !== undefined) ? (idMap[String(t)] || 0) : 0;
    }
    // Pass 2: emit.
    const connects = [];
    const body = [];
    ctx.names = {};
    ctx.layerCount = page.layers.length;
    for (const it of items) {
      if (it.kind === 'connector') body.push(emitConnector(ctx, it, pageH, connects));
      else if (it.kind === 'shape') body.push(emitShape(ctx, it, pageH));
      else if (it.kind === 'image') body.push(emitImage(ctx, it, pageH, pageCtx));
      else body.push(emitText(ctx, it, pageH));
    }
    let xml = XML_DECL + '<PageContents xmlns="' + NS + '" xmlns:r="' + NS_R + '" xml:space="preserve">';
    if (body.length) xml += '<Shapes>' + body.join('') + '</Shapes>';
    if (connects.length) xml += '<Connects>' + connects.join('') + '</Connects>';
    xml += '</PageContents>';
    pageCtx.shapeCount = nextId - 1;
    return xml;
  }

  /* ------------------------------------------------------------------ */
  /* Document-level parts                                                */
  /* ------------------------------------------------------------------ */
  const PAPER = [ // [w, h, PaperKind] inches, portrait
    [8.5, 11, 1], [11, 17, 3], [8.5, 14, 5], [11.69, 16.54, 8], [8.27, 11.69, 9], [5.83, 8.27, 11],
  ];
  function paperKind(w, h) {
    const a = Math.min(w, h), b = Math.max(w, h);
    for (const p of PAPER) if (Math.abs(p[0] - a) < 0.06 && Math.abs(p[1] - b) < 0.06) return p[2];
    return 0;
  }

  function pageSheetXml(page) {
    const w = page.width, h = page.height;
    let s = '<PageSheet LineStyle="0" FillStyle="0" TextStyle="0">' +
      cN('PageWidth', w, 'IN') + cN('PageHeight', h, 'IN') + cN('ShdwOffsetX', 0.125) + cN('ShdwOffsetY', -0.125) +
      cN('PageScale', 1, 'IN_F') + cN('DrawingScale', 1, 'IN_F') + cN('DrawingSizeType', 3) + cN('DrawingScaleType', 0) +
      cN('InhibitSnap', 0) + cN('PageLockReplace', 0, 'BOOL') + cN('PageLockDuplicate', 0, 'BOOL') + cN('UIVisibility', 0) +
      cN('ShdwType', 0) + cN('ShdwObliqueAngle', 0) + cN('ShdwScaleFactor', 1) + cN('DrawingResizeType', 1) +
      cN('PageShapeSplit', 1) + cN('PrintPageOrientation', w > h ? 2 : 1);
    const pk = paperKind(w, h);
    if (pk) s += cN('PaperKind', pk);
    if (page.layers.length) {
      s += '<Section N="Layer">';
      page.layers.forEach((l, i) => {
        s += '<Row IX="' + i + '">' + cS('Name', l.name) + cN('Color', 255) + cN('Status', 0) + cN('Visible', bool(l.visible)) +
          cN('Print', bool(l.print)) + cN('Active', 0) + cN('Lock', bool(l.locked)) + cN('Snap', 1) + cN('Glue', 1) +
          cS('NameUniv', l.name) + cN('ColorTrans', 0) + '</Row>';
      });
      s += '</Section>';
    }
    return s + '</PageSheet>';
  }

  function styleSheetsXml() {
    return '<StyleSheets>' +
      '<StyleSheet ID="0" NameU="No Style" IsCustomNameU="1" Name="No Style" IsCustomName="1">' +
      cN('EnableLineProps', 1) + cN('EnableFillProps', 1) + cN('EnableTextProps', 1) + cN('HideForApply', 0) +
      cN('LineWeight', 0.75 * PT, 'PT') + cS('LineColor', '#000000') + cN('LinePattern', 1) + cN('Rounding', 0) +
      cN('EndArrowSize', 2) + cN('BeginArrow', 0) + cN('EndArrow', 0) + cN('LineCap', 0) + cN('BeginArrowSize', 2) +
      cN('LineColorTrans', 0) + cN('CompoundType', 0) +
      cS('FillForegnd', '#FFFFFF') + cS('FillBkgnd', '#000000') + cN('FillPattern', 1) + cS('ShdwForegnd', '#000000') +
      cN('ShdwPattern', 0) + cN('FillForegndTrans', 0) + cN('FillBkgndTrans', 0) + cN('ShdwForegndTrans', 0) +
      cN('ShapeShdwType', 0) + cN('ShapeShdwOffsetX', 0) + cN('ShapeShdwOffsetY', 0) + cN('ShapeShdwObliqueAngle', 0) +
      cN('ShapeShdwScaleFactor', 1) + cN('ShapeShdwBlur', 0) + cN('ShapeShdwShow', 0) +
      cN('LeftMargin', 0, 'PT') + cN('RightMargin', 0, 'PT') + cN('TopMargin', 0, 'PT') + cN('BottomMargin', 0, 'PT') +
      cN('VerticalAlign', 1) + cN('TextBkgnd', 0) + cN('DefaultTabStop', 0.5) + cN('TextDirection', 0) + cN('TextBkgndTrans', 0) +
      '<Section N="Character"><Row IX="0">' + cS('Font', 'Calibri') + cS('Color', '#000000') + cN('Style', 0) + cN('Case', 0) +
      cN('Pos', 0) + cN('FontScale', 1) + cN('Size', 12 * PT, 'PT') + cN('DblUnderline', 0) + cN('Overline', 0) +
      cN('Strikethru', 0) + cN('Letterspace', 0) + cN('ColorTrans', 0) + '</Row></Section>' +
      '<Section N="Paragraph"><Row IX="0">' + cN('IndFirst', 0) + cN('IndLeft', 0) + cN('IndRight', 0) +
      cN('SpLine', -1.2, 'PER') + cN('SpBefore', 0) + cN('SpAfter', 0) + cN('HorzAlign', 1) + cN('Bullet', 0) + cN('Flags', 0) +
      '</Row></Section>' +
      '</StyleSheet></StyleSheets>';
  }

  function documentXml(topPageId) {
    return XML_DECL + '<VisioDocument xmlns="' + NS + '" xmlns:r="' + NS_R + '" xml:space="preserve">' +
      '<DocumentSettings TopPage="' + topPageId + '" DefaultTextStyle="0" DefaultLineStyle="0" DefaultFillStyle="0" DefaultGuideStyle="0">' +
      '<GlueSettings>9</GlueSettings><SnapSettings>65847</SnapSettings><SnapExtensions>34</SnapExtensions><SnapAngles/>' +
      '<DynamicGridEnabled>1</DynamicGridEnabled><ProtectStyles>0</ProtectStyles><ProtectShapes>0</ProtectShapes>' +
      '<ProtectMasters>0</ProtectMasters><ProtectBkgnds>0</ProtectBkgnds></DocumentSettings>' +
      styleSheetsXml() +
      '<DocumentSheet NameU="TheDoc" IsCustomNameU="1" Name="TheDoc" IsCustomName="1" LineStyle="0" FillStyle="0" TextStyle="0">' +
      cN('OutputFormat', 0) + cN('LockPreview', 0) + cN('AddMarkup', 0) + cN('ViewMarkup', 0) + cN('PreviewQuality', 0) +
      cN('PreviewScope', 0) + '</DocumentSheet>' +
      '</VisioDocument>';
  }

  function relsXml(rels) {
    return XML_DECL + '<Relationships xmlns="' + NS_REL + '">' +
      rels.map((r) => '<Relationship Id="' + r.id + '" Type="' + r.type + '" Target="' + escAttr(r.target) + '"/>').join('') +
      '</Relationships>';
  }

  function isoDate(d) {
    const dt = (d instanceof Date) ? d : (d ? new Date(d) : new Date());
    const ok = isNaN(dt) ? new Date() : dt;
    return ok.toISOString().replace(/\.\d{3}Z$/, 'Z');
  }

  function coreXml(ir, created, modified) {
    const t = (tag, v) => (v ? '<' + tag + '>' + escText(v) + '</' + tag + '>' : '');
    return XML_DECL + '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties"' +
      ' xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/"' +
      ' xmlns:dcmitype="http://purl.org/dc/dcmitype/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
      t('dc:title', ir.title) + t('dc:subject', ir.subject) + t('dc:creator', ir.author) + t('cp:keywords', ir.keywords) +
      t('dc:description', ir.description) + t('cp:lastModifiedBy', ir.author) +
      '<dcterms:created xsi:type="dcterms:W3CDTF">' + created + '</dcterms:created>' +
      '<dcterms:modified xsi:type="dcterms:W3CDTF">' + modified + '</dcterms:modified>' +
      '</cp:coreProperties>';
  }

  function appXml(ir, pageNames) {
    const n = pageNames.length;
    return XML_DECL + '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"' +
      ' xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">' +
      '<Application>' + escText(ir.application || 'Port Network Studio') + '</Application>' +
      '<ScaleCrop>false</ScaleCrop>' +
      '<HeadingPairs><vt:vector size="2" baseType="variant"><vt:variant><vt:lpstr>Pages</vt:lpstr></vt:variant>' +
      '<vt:variant><vt:i4>' + n + '</vt:i4></vt:variant></vt:vector></HeadingPairs>' +
      '<TitlesOfParts><vt:vector size="' + n + '" baseType="lpstr">' +
      pageNames.map((p) => '<vt:lpstr>' + escText(p) + '</vt:lpstr>').join('') + '</vt:vector></TitlesOfParts>' +
      (ir.company ? '<Company>' + escText(ir.company) + '</Company>' : '') +
      '<LinksUpToDate>false</LinksUpToDate><SharedDoc>false</SharedDoc><HyperlinksChanged>false</HyperlinksChanged>' +
      '</Properties>';
  }

  function windowsXml(topPage) {
    return XML_DECL + '<Windows ClientWidth="1600" ClientHeight="900" xmlns="' + NS + '" xmlns:r="' + NS_R + '" xml:space="preserve">' +
      '<Window ID="0" WindowType="Drawing" WindowState="1073741824" WindowLeft="-8" WindowTop="-31" WindowWidth="1616" WindowHeight="939"' +
      ' ContainerType="Page" Page="' + topPage.id + '" ViewScale="-1" ViewCenterX="' + fmt(topPage.width / 2) +
      '" ViewCenterY="' + fmt(topPage.height / 2) + '">' +
      '<ShowRulers>1</ShowRulers><ShowGrid>1</ShowGrid><ShowPageBreaks>0</ShowPageBreaks><ShowGuides>1</ShowGuides>' +
      '<ShowConnectionPoints>1</ShowConnectionPoints><GlueSettings>9</GlueSettings><SnapSettings>65847</SnapSettings>' +
      '<SnapExtensions>34</SnapExtensions><SnapAngles/><DynamicGridEnabled>1</DynamicGridEnabled><TabSplitterPos>0.5</TabSplitterPos>' +
      '</Window></Windows>';
  }

  /* Normalise IR pages: names, sizes, layers, background relationships, order. */
  function normalisePages(ir) {
    const src = Array.isArray(ir.pages) && ir.pages.length ? ir.pages : [{ name: 'Page-1', shapes: [] }];
    const usedNames = {};
    const pages = src.map((p, i) => {
      p = p || {};
      let base = clean(p.name || '').replace(/\s+/g, ' ').trim() || ('Page-' + (i + 1));
      let name = base, k = 2;
      while (usedNames[name.toLowerCase()]) name = base + ' (' + (k++) + ')';
      usedNames[name.toLowerCase()] = true;
      const layersIn = Array.isArray(p.layers) ? p.layers : [];
      const lnames = {};
      const layers = layersIn.map((l, j) => {
        l = l || {};
        let ln = clean(l.name || '').trim() || ('Layer ' + (j + 1));
        let lb = ln, q = 2;
        while (lnames[ln.toLowerCase()]) ln = lb + ' ' + (q++);
        lnames[ln.toLowerCase()] = true;
        return { name: ln, visible: l.visible !== false, print: l.print !== false, locked: !!l.locked };
      });
      return {
        ir: p, index: i, id: i, name,
        width: Math.max(0.01, toNum(p.width, 11)), height: Math.max(0.01, toNum(p.height, 8.5)),
        layers, background: p.background === true || p.background === 1 || p.isBackground === true, backPage: null,
      };
    });
    // Resolve background references (target page becomes a background page).
    pages.forEach((p) => {
      const b = p.ir.backPage;
      if (b === null || b === undefined || b === '' || b === false) return;
      const bi = Math.round(Number(b));
      if (isFinite(bi) && bi >= 0 && bi < pages.length && bi !== p.index) {
        p.backPage = bi;
        pages[bi].background = true;
      }
    });
    // Drop cycles in background chains.
    pages.forEach((p) => {
      const seen = {};
      let cur = p;
      seen[cur.index] = true;
      while (cur.backPage !== null) {
        if (seen[cur.backPage]) { cur.backPage = null; break; }
        seen[cur.backPage] = true;
        cur = pages[cur.backPage];
      }
    });
    let fg = pages.filter((p) => !p.background);
    const bg = pages.filter((p) => p.background);
    if (!fg.length) {
      const first = bg[0];
      const blank = {
        ir: { shapes: [] }, index: pages.length, id: pages.length, name: usedNames['page-1'] ? 'Page-' + (pages.length + 1) : 'Page-1',
        width: first.width, height: first.height, layers: [], background: false, backPage: first.index,
      };
      pages.push(blank);
      fg = [blank];
    }
    // Visio lists foreground pages first, then background pages.
    return fg.concat(bg);
  }

  /* ------------------------------------------------------------------ */
  /* build                                                               */
  /* ------------------------------------------------------------------ */
  function build(ir) {
    ir = ir || {};
    const created = isoDate(ir.created);
    const modified = isoDate(ir.modified || ir.created);
    const pages = normalisePages(ir);
    const ctx = { media: [], mediaByKey: {}, names: {}, layerCount: 0 };
    const files = [];
    const pageParts = [];
    pages.forEach((page, i) => {
      const pageCtx = { rels: [], relByFile: {} };
      const xml = buildPage(ctx, page, pageCtx);
      pageParts.push({ page, file: 'page' + (i + 1) + '.xml', xml, rels: pageCtx.rels });
    });

    const top = pages[0];
    const ct = ['<Default Extension="rels" ContentType="' + CT.rels + '"/>', '<Default Extension="xml" ContentType="' + CT.xml + '"/>'];
    const exts = {};
    ctx.media.forEach((m) => { if (!exts[m.ext]) { exts[m.ext] = true; ct.push('<Default Extension="' + m.ext + '" ContentType="' + m.mime + '"/>'); } });
    ct.push('<Override PartName="/docProps/core.xml" ContentType="' + CT.core + '"/>');
    ct.push('<Override PartName="/docProps/app.xml" ContentType="' + CT.app + '"/>');
    ct.push('<Override PartName="/visio/document.xml" ContentType="' + CT.document + '"/>');
    ct.push('<Override PartName="/visio/pages/pages.xml" ContentType="' + CT.pages + '"/>');
    pageParts.forEach((pp) => ct.push('<Override PartName="/visio/pages/' + pp.file + '" ContentType="' + CT.page + '"/>'));
    ct.push('<Override PartName="/visio/windows.xml" ContentType="' + CT.windows + '"/>');
    files.push({ name: '[Content_Types].xml', data: XML_DECL + '<Types xmlns="' + NS_CT + '">' + ct.join('') + '</Types>' });

    files.push({ name: '_rels/.rels', data: relsXml([
      { id: 'rId1', type: REL.document, target: 'visio/document.xml' },
      { id: 'rId2', type: REL.core, target: 'docProps/core.xml' },
      { id: 'rId3', type: REL.app, target: 'docProps/app.xml' },
    ]) });
    files.push({ name: 'docProps/core.xml', data: coreXml(ir, created, modified) });
    files.push({ name: 'docProps/app.xml', data: appXml(ir, pages.map((p) => p.name)) });
    files.push({ name: 'visio/document.xml', data: documentXml(top.id) });
    files.push({ name: 'visio/_rels/document.xml.rels', data: relsXml([
      { id: 'rId1', type: REL.pages, target: 'pages/pages.xml' },
      { id: 'rId2', type: REL.windows, target: 'windows.xml' },
    ]) });

    let pagesXml = XML_DECL + '<Pages xmlns="' + NS + '" xmlns:r="' + NS_R + '" xml:space="preserve">';
    pageParts.forEach((pp, i) => {
      const p = pp.page;
      const nm = escAttr(p.name);

      if(major){const label=String(Math.round(mm));if(axis==='x')g.fillText(label,pos+3,9);else{g.save();g.translate(9,pos+3);g.rotate(-Math.PI/2);g.textAlign='right';g.fillText(label,0,0);g.restore()}}}
    g.stroke();if(S.cursor){const pos=((axis==='x'?S.cursor[0]:S.cursor[1])-origin)*z;g.strokeStyle='#e0559b';g.beginPath();if(axis==='x'){g.moveTo(pos,0);g.lineTo(pos,h)}else{g.moveTo(0,pos);g.lineTo(w,pos)}g.stroke()}}}

// ---------- minimap ----------
let miniTimer=null;
function scheduleMinimap(){clearTimeout(miniTimer);miniTimer=setTimeout(drawMinimap,180)}
function drawMinimap(){const m=$('minimap');if(!m||!S.prefs.minimap){if(m)m.hidden=true;return}m.hidden=false;const svg=$('miniSvg'),b=Core.pageSize(pg()),all=items(),ext=all.length?Core.bounds(all):{x:0,y:0,w:b.w,h:b.h},x0=Math.min(0,ext.x)-40,y0=Math.min(0,ext.y)-40,x1=Math.max(b.w,ext.x+ext.w)+40,y1=Math.max(b.h,ext.y+ext.h)+40;
  svg.setAttribute('viewBox',`${x0} ${y0} ${x1-x0} ${y1-y0}`);svg.dataset.vb=JSON.stringify([x0,y0,x1-x0,y1-y0]);const g=$('miniScene');g.replaceChildren();el('rect',{x:0,y:0,width:b.w,height:b.h,fill:pg().bg||'#fff',stroke:'#94a3b8','stroke-width':4},g);
  for(const n of all){if(!itemVisible(n,{doc:S.doc}))continue;if(n.kind==='zone')el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,fill:n.fill||'#eef4fb',stroke:n.stroke,'stroke-width':3},g);else if(n.kind==='edge')el('polyline',{points:n.points.map(p=>p.join(',')).join(' '),fill:'none',stroke:n.stroke,'stroke-width':4},g);else if(n.kind==='node')el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:6,fill:n.display==='tile'||n.display==='circle'?n.stroke:'#fff',stroke:n.stroke,'stroke-width':4},g);else el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,fill:'#94a3b833'},g)}updateMinimapView()}
function updateMinimapView(){const r=$('miniView'),svg=$('canvas');if(!r||!S.prefs.minimap)return;const z=S.view.zoom;r.setAttribute('x',S.view.x);r.setAttribute('y',S.view.y);r.setAttribute('width',svg.clientWidth/z);r.setAttribute('height',svg.clientHeight/z);r.setAttribute('stroke-width',Math.max(3,(svg.clientWidth/z)/90))}

// ---------- thumbnails ----------
function thumbnail(doc,page,w=260,h=170){const svg=sceneSvg(page,{doc,print:true,pad:20});svg.setAttribute('width',w);svg.setAttribute('height',h);svg.setAttribute('preserveAspectRatio','xMidYMid meet');return svg}

</script>
<script>
// Network analysis on the drawn topology: resilience (SPOF), path trace, stream traffic & link utilisation,
// PoE budgets, CCTV storage, rack capacity, IP plan, design-rule checks and reports (inventory, cables, BOM).
const Analysis=(()=>{
const C=Core;
const nameOf=n=>{if(!n)return'';const l=n.labels?.[0];const t=l?resolveLabel(n,l,makeCtx(pageOfItem(n)||pg())):'';return(t||n.data?.hostname||Shapes.nameOf(n.type)).replace(/\n/g,' ')};
const pageOfItem=n=>S.doc.pages.find(p=>p.items.includes(n));
const tier=n=>Stencils?.shapes?.[n.type]?.tier??(Shapes.rackItems[n.type]?3:5);
const DEFAULT_POE={camera:6.5,domecamera:7,ptzcamera:25,anpr:12,thermal:12,wap:15,ipphone:5,accesscontrol:8,intercom:10,sensor:3,iotgateway:8,display:25,thinclient:12};
const RECORDER=new Set(['nvr','rk-nvr','storage','rk-storage','nas']);

function graph(page){
  const nodes=page.items.filter(n=>n.kind==='node'&&(Shapes.isDevice(n)||Shapes.kindOf(n.type)==='basic')),ids=new Set(nodes.map(n=>n.id)),adj=new Map(nodes.map(n=>[n.id,[]])),edges=[];
  for(const e of page.items)if(e.kind==='edge'&&e.from&&e.to&&ids.has(e.from.node)&&ids.has(e.to.node)&&e.from.node!==e.to.node&&!(e.linkType==='power'||e.linkType==='logical')){edges.push(e);adj.get(e.from.node).push({to:e.to.node,edge:e});adj.get(e.to.node).push({to:e.from.node,edge:e})}
  return{nodes,byId:new Map(nodes.map(n=>[n.id,n])),adj,edges}}
function zoneOf(n,page){const c=C.center(n);let best=null;for(const z of page.items)if(z.kind==='zone'&&z!==n&&C.inside({x:c[0],y:c[1],w:0,h:0},C.box(z))&&(!best||z.w*z.h<best.w*best.h))best=z;return best}
const zoneName=z=>z?(resolveLabel(z,z.labels?.[0]||{text:''})||'Zone').replace(/\n/g,' '):'';

// ---------- resilience: articulation points & bridges (Tarjan) ----------
function spof(page){
  const G=graph(page),disc=new Map(),low=new Map(),aps=new Map(),bridges=[];let time=0;const size=new Map();
  function dfs(u,parentEdge){disc.set(u,++time);low.set(u,time);let children=0;size.set(u,1);
    for(const{to:v,edge}of G.adj.get(u)){if(edge===parentEdge)continue;if(!disc.has(v)){children++;dfs(v,edge);size.set(u,size.get(u)+size.get(v));low.set(u,Math.min(low.get(u),low.get(v)));if(low.get(v)>disc.get(u))bridges.push({edge,below:size.get(v)});if(parentEdge!==null&&low.get(v)>=disc.get(u))aps.set(u,(aps.get(u)||0)+size.get(v))}else low.set(u,Math.min(low.get(u),disc.get(v)))}
    if(parentEdge===null&&children>1)aps.set(u,size.get(u)-1)}
  for(const n of G.nodes)if(!disc.has(n.id))dfs(n.id,null);
  const nodes=[...aps].filter(([id])=>tier(G.byId.get(id))<=4).map(([id,cut])=>({id,cut}));
  const crit=bridges.filter(b=>{const a=G.byId.get(b.edge.from.node),c=G.byId.get(b.edge.to.node);return Math.min(G.adj.get(a.id).length,G.adj.get(c.id).length)>1&&tier(a)<=4&&tier(c)<=4});
  return{nodes,bridges:crit,graph:G}}

// ---------- path trace ----------
function path(page,a,b){const G=graph(page),prev=new Map([[a,null]]),q=[a];while(q.length){const u=q.shift();if(u===b)break;for(const{to,edge}of G.adj.get(u)||[])if(!prev.has(to)){prev.set(to,{u,edge});q.push(to)}}if(!prev.has(b))return null;const nodes=[b],edges=[];let cur=b;while(prev.get(cur)){const{u,edge}=prev.get(cur);edges.push(edge.id);nodes.push(u);cur=u}return{nodes:nodes.reverse(),edges:edges.reverse()}}
function allPaths(G,a,b,limit=3){const res=[];const visit=(u,seenN,seenE,pathE)=>{if(res.length>=limit*4)return;if(u===b){res.push([...pathE]);return}for(const{to,edge}of G.adj.get(u)||[]){if(seenN.has(to)||seenE.has(edge.id))continue;if(pathE.length>12)continue;seenN.add(to);seenE.add(edge.id);pathE.push(edge.id);visit(to,seenN,seenE,pathE);pathE.pop();seenN.delete(to);seenE.delete(edge.id)}};visit(a,new Set([a]),new Set(),[]);return res.sort((x,y)=>x.length-y.length).slice(0,limit)}

// ---------- traffic: camera / stream flows to recorders ----------
function capacity(e){return Shapes.speedMbps(e.data?.speed)||Shapes.speedMbps(Shapes.linkTypes[e.linkType]?.speed)||null}
function traffic(page){
  const G=graph(page),loads=new Map(),flows=[],recorders=G.nodes.filter(n=>RECORDER.has(n.type)||/vms|nvr|record/i.test(n.data?.role||''));
  const findDest=src=>{const want=src.data?.streamTo;if(want){const t=G.nodes.find(n=>[n.data?.hostname,nameOf(n)].some(v=>v&&v.toLowerCase()===String(want).toLowerCase()));if(t)return t}
    const prev=new Map([[src.id,null]]),q=[src.id];while(q.length){const u=q.shift();const un=G.byId.get(u);if(u!==src.id&&recorders.includes(un))return un;for(const{to,edge}of G.adj.get(u))if(!prev.has(to)){prev.set(to,edge);q.push(to)}}return null};
  for(const src of G.nodes){const mbps=+src.data?.bitrate||(C.CAMERAS.includes(src.type)?+(S.doc.display?.defaultBitrate||4):0);if(!mbps)continue;const dst=findDest(src);if(!dst)continue;const p=path(page,src.id,dst.id);if(!p)continue;flows.push({src,dst,mbps,edges:p.edges});for(const id of p.edges)loads.set(id,(loads.get(id)||0)+mbps)}
  const out=new Map();for(const[id,mbps]of loads){const e=G.edges.find(x=>x.id===id),cap=capacity(e),pct=cap?mbps/cap*100:null;out.set(id,{mbps,cap,pct,color:pct==null?'#2563eb':pct>=80?'#dc2626':pct>=50?'#d97706':'#16a34a',text:(mbps>=1000?(mbps/1000).toFixed(2)+' Gb/s':Math.round(mbps)+' Mb/s')+(pct!=null?` · ${Math.round(pct)}%`:'')})}
  const perRec=new Map();for(const f of flows){const r=perRec.get(f.dst.id)||{rec:f.dst,cams:0,mbps:0};r.cams++;r.mbps+=f.mbps;perRec.set(f.dst.id,r)}
  return{loads:out,flows,recorders:[...perRec.values()]}}
function storageTB(mbps,days){return mbps*86400*days/8/1e6}

// ---------- PoE budget ----------
function poe(page){const G=graph(page),rows=[];for(const sw of G.nodes){if(!C.SWITCHES.includes(sw.type)&&!(+sw.data?.poeBudget))continue;let draw=0,count=0;const loads=[];for(const{to}of G.adj.get(sw.id)){const n=G.byId.get(to);if(!(C.POE_LOADS.includes(n.type)||+n.data?.poeDraw))continue;if(tier(n)<tier(sw))continue;const w=+n.data?.poeDraw||DEFAULT_POE[n.type]||0;draw+=w;count++;loads.push(n)}if(!count&&!(+sw.data?.poeBudget))continue;const budget=+sw.data?.poeBudget||null;rows.push({sw,count,draw,budget,pct:budget?draw/budget*100:null,loads})}return rows}

// ---------- racks ----------
function racks(page){return page.items.filter(n=>n.type==='rack').map(r=>{const inner=Shapes.rackInner(r),eq=page.items.filter(n=>n.kind==='node'&&Shapes.rackItems[n.type]&&C.inside(C.box(n),{x:inner.x-1,y:inner.y-1,w:inner.w+2,h:inner.h+2})),used=eq.reduce((s,n)=>s+Math.round(n.h/Shapes.RU),0),power=eq.reduce((s,n)=>s+(+n.data?.power||0),0);
  const overlaps=[];for(let i=0;i<eq.length;i++)for(let j=i+1;j<eq.length;j++){const a=C.box(eq[i]),b=C.box(eq[j]);if(a.y<b.y+b.h-1&&a.y+a.h>b.y+1)overlaps.push([eq[i],eq[j]])}
  return{rack:r,units:r.units||42,used,free:(r.units||42)-used,power,eq:eq.sort((a,b)=>Shapes.rackU(r,b)-Shapes.rackU(r,a)),overlaps}})}

// ---------- IP plan ----------
function ipPlan(doc){const rows=[];for(const p of doc.pages)for(const z of p.items.filter(n=>n.kind==='zone'&&C.cidr(n.data?.subnet))){const c=C.cidr(z.data.subnet),devices=p.items.filter(n=>n.kind==='node'&&Shapes.isDevice(n)&&zoneOf(n,p)===z),used=new Set();for(const n of devices)for(const ip of C.ipsIn(n.data?.ip).concat(C.ipsIn(n.data?.mgmtIp))){const v=C.ip2int(ip);if(C.inCidr(v,c))used.add(v)}const gw=C.ip2int(z.data.gateway);if(gw!=null)used.add(gw);let next=null;for(let v=c.first;v<=c.last&&v<c.first+65536;v++)if(!used.has(v)){next=C.int2ip(v);break}rows.push({page:p,zone:z,cidr:c,devices,used:used.size,next,vlan:z.data.vlan||''})}return rows}
function nextFreeIp(n,page){const z=zoneOf(n,page),c=z&&C.cidr(z.data?.subnet);if(!c)return null;const plan=ipPlan(S.doc).find(r=>r.zone===z);return plan?.next||null}

// ---------- design-rule check ----------
function check(doc){
  const issues=[],add=(severity,page,ids,message,rule)=>issues.push({severity,page:doc.pages.indexOf(page),ids:[].concat(ids).filter(Boolean),message,rule});
  const hostnames=new Map(),ips=new Map(),seenSubnets=[];
  for(const page of doc.pages){if(page.isBackground)continue;const byId=new Map(page.items.map(n=>[n.id,n])),ps=C.pageSize(page),G=graph(page);
    for(const n of page.items){
      if(n.kind==='edge'){for(const k of['from','to']){if(!n[k])add('warning',page,n.id,`Connector end is not attached (${k==='from'?'start':'end'}).`,'loose');else if(!Conn.resolveEnd(n,k,byId))add('error',page,n.id,'Connector is attached to a device or port that no longer exists.','broken')}if(n.from&&n.to&&n.from.node===n.to.node)add('warning',page,n.id,'Connector loops back to the same device.','loop')}
      const b=C.bounds([n],true);if(b.x<0||b.y<0||b.x+b.w>ps.w||b.y+b.h>ps.h)add('warning',page,n.id,`“${nameOf(n)||n.kind}” is outside the printable page.`,'offpage');
      if(n.kind!=='node'||!Shapes.isDevice(n))continue;
      const nm=nameOf(n),h=(n.data?.hostname||'').trim();
      if(h){const k=h.toLowerCase();if(hostnames.has(k))add('error',page,[n.id,hostnames.get(k).id],`Duplicate hostname “${h}”.`,'duphost');else hostnames.set(k,n);if(/\s/.test(h))add('info',page,n.id,`Hostname “${h}” contains spaces.`,'hostfmt')}
      for(const field of['ip','mgmtIp']){const raw=n.data?.[field];if(!raw)continue;const found=C.ipsIn(raw);if(!found.length)add('error',page,n.id,`“${nm}”: “${raw}” is not a valid IPv4 address.`,'ipfmt');for(const ip of found){if(ips.has(ip))add('error',page,[n.id,ips.get(ip).id],`Duplicate IP address ${ip} (${nm} and ${nameOf(ips.get(ip))}).`,'dupip');else ips.set(ip,n);
        const z=zoneOf(n,page),c=z&&C.cidr(z.data?.subnet);if(c&&field==='ip'){const v=C.ip2int(ip);if(!C.inCidr(v,c))add('warning',page,n.id,`${nm}: ${ip} is outside zone “${zoneName(z)}” subnet ${c.text}.`,'subnet');else if(c.bits<31&&(v===c.net||v===c.broadcast))add('error',page,n.id,`${nm}: ${ip} is the ${v===c.net?'network':'broadcast'} address of ${c.text}.`,'netaddr');const gw=C.ip2int(z.data?.gateway);if(gw!=null&&gw===v&&!['router','firewall','l3switch','rk-router','rk-firewall'].includes(n.type))add('warning',page,n.id,`${nm} uses the zone gateway address ${ip}.`,'gw')}}}
      if(!G.adj.get(n.id)?.length&&!Shapes.rackItems[n.type])add('info',page,n.id,`“${nm}” has no connections.`,'isolated');
    }
    // overlapping devices
    const devs=page.items.filter(n=>n.kind==='node'&&Shapes.isDevice(n)&&!Shapes.rackItems[n.type]);for(let i=0;i<devs.length;i++)for(let j=i+1;j<devs.length;j++){const a=C.box(devs[i]),c=C.box(devs[j]);const ox=Math.min(a.x+a.w,c.x+c.w)-Math.max(a.x,c.x),oy=Math.min(a.y+a.h,c.y+c.h)-Math.max(a.y,c.y);if(ox>a.w*.3&&oy>a.h*.3)add('warning',page,[devs[i].id,devs[j].id],`“${nameOf(devs[i])}” overlaps “${nameOf(devs[j])}”.`,'overlap')}
    // zones: subnet sanity
    for(const z of page.items.filter(n=>n.kind==='zone')){const s=z.data?.subnet;if(!s)continue;const c=C.cidr(s);if(!c){add('error',page,z.id,`Zone “${zoneName(z)}”: “${s}” is not a valid CIDR subnet.`,'cidr');continue}if(c.ip!==c.net)add('info',page,z.id,`Zone “${zoneName(z)}”: ${s} is not the network address (did you mean ${c.text}?).`,'cidrnet');const gw=C.ip2int(z.data?.gateway);if(z.data?.gateway&&(gw==null||!C.inCidr(gw,c)))add('error',page,z.id,`Zone “${zoneName(z)}”: gateway ${z.data.gateway} is not inside ${c.text}.`,'gwout');for(const o of seenSubnets)if(o.z!==z&&((c.net&o.c.mask)>>>0)===o.c.net||((o.c.net&c.mask)>>>0)===c.net&&o.z!==z)add('warning',page,[z.id,o.z.id],`Subnets overlap: ${c.text} (${zoneName(z)}) and ${o.c.text} (${zoneName(o.z)}).`,'overlapnet');seenSubnets.push({z,c})}
    for(const r of poe(page))if(r.budget&&r.draw>r.budget)add('error',page,r.sw.id,`PoE budget exceeded on ${nameOf(r.sw)}: ${r.draw.toFixed(1)} W of ${r.budget} W (${r.count} powered devices).`,'poe');else if(r.budget&&r.pct>85)add('warning',page,r.sw.id,`${nameOf(r.sw)} PoE budget at ${Math.round(r.pct)}% (${r.draw.toFixed(1)} / ${r.budget} W).`,'poe');
    for(const r of racks(page)){for(const[a,c]of r.overlaps)add('error',page,[a.id,c.id],`Rack “${nameOf(r.rack)}”: ${nameOf(a)} and ${nameOf(c)} occupy the same U.`,'rack');if(r.used>r.units)add('error',page,r.rack.id,`Rack “${nameOf(r.rack)}” is over capacity (${r.used}/${r.units} U).`,'rack')}
    if(page.items.some(n=>C.CAMERAS.includes(n.type))){const t=traffic(page);for(const[id,L]of t.loads)if(L.pct!=null&&L.pct>=80)add('warning',page,id,`Link carries ${L.text} of camera streams (${L.cap>=1000?L.cap/1000+'G':L.cap+'M'} link).`,'util')}
    const sp=spof(page);for(const a of sp.nodes)add('info',page,a.id,`Single point of failure: losing “${nameOf(sp.graph.byId.get(a.id))}” isolates ${a.cut} device(s).`,'spof');for(const b of sp.bridges)add('info',page,b.edge.id,`Non-redundant link between ${nameOf(sp.graph.byId.get(b.edge.from.node))} and ${nameOf(sp.graph.byId.get(b.edge.to.node))}.`,'bridge');
  }
  const vids=new Map();for(const v of doc.vlans||[]){if(vids.has(String(v.id)))issues.push({severity:'error',page:-1,ids:[],message:`VLAN ${v.id} is defined twice (${vids.get(String(v.id))} / ${v.name}).`,rule:'vlan'});vids.set(String(v.id),v.name);if(!(+v.id>=1&&+v.id<=4094))issues.push({severity:'error',page:-1,ids:[],message:`VLAN ID ${v.id} is outside 1–4094.`,rule:'vlan'})}
  const order={error:0,warning:1,info:2};return issues.sort((a,b)=>order[a.severity]-order[b.severity])}

// ---------- reports ----------
function allDevices(doc,{currentOnly=false}={}){const out=[];for(const p of currentOnly?[pg()]:doc.pages)for(const n of p.items)if(n.kind==='node'&&Shapes.isDevice(n))out.push({p,n});return out}
function inventory(doc,opt){const fields=doc.fields,cols=['Page','Name','Type','Zone',...fields.filter(f=>f.key!=='notes').map(f=>f.label),'Rack / U','Links'];
  const rows=allDevices(doc,opt).map(({p,n})=>{const G=graph(p),r=rackOf(n,p);return[p.name,nameOf(n),Shapes.nameOf(n.type),zoneName(zoneOf(n,p)),...fields.filter(f=>f.key!=='notes').map(f=>n.data?.[f.key]??''),r?nameOf(r)+' / U'+Shapes.rackU(r,n):'',G.adj.get(n.id)?.length||0]});return{title:'Device inventory',columns:cols,rows}}
function cables(doc,opt){const cols=['Cable ID','Page','From device','From port','To device','To port','Link type','Speed','Media','VLANs','Label'],rows=[];let k=1;
  for(const p of opt?.currentOnly?[pg()]:doc.pages){const byId=new Map(p.items.map(n=>[n.id,n]));for(const e of p.items){if(e.kind!=='edge')continue;const end=key=>{const r=e[key],n=r&&byId.get(r.node);if(!n)return['(unconnected)',''];const port=r.port&&n.ports?.find(q=>q.id===r.port);return[nameOf(n),(key==='from'?e.fromIf:e.toIf)||(port&&!/^(top|right|bottom|left|edge \d+)$/i.test(port.name)?port.name:'')]};const[a,ap]=end('from'),[b,bp]=end('to');rows.push([e.data?.cableId||'C-'+String(k).padStart(3,'0'),p.name,a,ap,b,bp,Shapes.linkTypes[e.linkType]?.name||'Custom',e.data?.speed||'',e.data?.media||'',e.data?.vlans||'',(e.labels||[]).map(l=>resolveLabel(e,l)).join(' ')]);k++}}return{title:'Cable schedule',columns:cols,rows}}
function bom(doc,opt){const map=new Map();for(const{n}of allDevices(doc,opt)){const key=[Shapes.nameOf(n.type),n.data?.vendor||'',n.data?.model||''].join('|');const r=map.get(key)||{type:Shapes.nameOf(n.type),vendor:n.data?.vendor||'',model:n.data?.model||'',qty:0,price:+n.data?.unitPrice||0};r.qty++;if(+n.data?.unitPrice)r.price=+n.data.unitPrice;map.set(key,r)}
  const rows=[...map.values()].sort((a,b)=>a.type.localeCompare(b.type)).map(r=>[r.type,r.vendor,r.model,r.qty,r.price?r.price.toFixed(2):'',r.price?(r.price*r.qty).toFixed(2):'']);const total=[...map.values()].reduce((s,r)=>s+r.price*r.qty,0);if(total)rows.push(['Total','','',[...map.values()].reduce((s,r)=>s+r.qty,0),'',total.toFixed(2)]);return{title:'Bill of materials',columns:['Item','Vendor','Model','Qty','Unit price','Extended'],rows}}

<script>
// Editor state, history, pointer/keyboard interaction and the action registry.
const $=id=>document.getElementById(id);
const DEFAULT_PREFS={grid:true,snap:true,guides:true,rulers:true,showPorts:false,minimap:true,autoConnect:true,wheelZoom:false,gridStep:10,theme:'auto',paletteDisplay:'symbol',newDisplay:'symbol',leftOpen:true,rightOpen:true,jumpStyle:'arc'};
const S={doc:null,pageIndex:0,selected:new Set(),activeLabel:null,segment:null,bend:null,mode:'select',view:{x:-40,y:-40,zoom:.8},drag:null,trace:null,hover:null,hoverId:null,snapPort:null,dropTarget:null,history:[],future:[],clipboard:[],space:false,dirty:false,guideLines:[],spacing:null,library:[],copiedStyle:null,highlights:new Set(),analysis:null,filterFn:null,filter:null,cursor:null,fileHandle:null,activeLayer:null,linkType:'eth',routeStyle:'auto',painter:false,lastClick:null,prefs:{...DEFAULT_PREFS}};
const pg=()=>S.doc.pages[S.pageIndex],items=()=>pg().items,find=id=>items().find(n=>n.id===id),picked=()=>items().filter(n=>S.selected.has(n.id));
const isLocked=n=>!!n.locked||!!layerOf(n)?.locked,editable=()=>picked().filter(n=>!isLocked(n));
const html=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C=Core;

// ---------- history ----------
let autosaveTimer=null;
function snapshot(){return JSON.stringify({doc:S.doc,pageIndex:S.pageIndex})}
function remember(){S.history.push(snapshot());if(S.history.length>150)S.history.shift();S.future=[]}
function changed(){S.dirty=true;S.doc.meta.modified=new Date().toISOString();setSaveState('Unsaved changes');clearTimeout(autosaveTimer);autosaveTimer=setTimeout(autosave,700)}
function mutate(fn){remember();const r=fn();changed();render();return r}
function clearTransient(){S.selected.clear();S.activeLabel=null;S.segment=null;S.bend=null;S.trace=null;S.drag=null;S.snapPort=null;S.highlights.clear()}
function restore(s){const r=JSON.parse(s);S.doc=r.doc;S.pageIndex=Math.min(r.pageIndex,S.doc.pages.length-1);const keep=new Set([...S.selected].filter(id=>items().some(n=>n.id===id)));clearTransient();S.selected=keep;changed();render()}
function undo(){if(!S.history.length)return notify('Nothing to undo.');S.future.push(snapshot());restore(S.history.pop())}
function redo(){if(!S.future.length)return;S.history.push(snapshot());restore(S.future.pop())}
function setSaveState(t){const e=$('saveState');if(e)e.textContent=t}
function autosave(){try{Packs.embedUsed(S.doc);localStorage.setItem('port-v3-recovery',JSON.stringify(S.doc));setSaveState(S.fileHandle?'Unsaved · recovery copy kept':'Recovery copy saved in this browser')}catch{setSaveState('Quick recovery copy too large — kept in browser storage only')}Workspace.saveCurrent()}
function savePrefs(){try{localStorage.setItem('port-v3-prefs',JSON.stringify(S.prefs))}catch{}}

let toastTimer=null;
function notify(text,ms=3800){const t=$('toast');t.textContent=text;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,ms)}

// ---------- modes ----------
const HINTS={select:'Drag to move · Shift-click adds · Alt-drag duplicates · Drag a port or the blue arrows to connect · Double-click to edit text',connect:'Drag from a device to another to connect · or click a point, then click bends, Enter to finish (manual styles) · Alt = free point',zone:'Drag a rectangle to create a network zone (container). Members move with the zone.',text:'Click to add text, or drag to set the text box width.',port:'Click a device edge to add a connection point · drag existing points to move them.',pan:'Drag to pan · wheel / pinch to zoom.'};
function setMode(m){S.mode=m;S.trace=null;S.hover=null;S.snapPort=null;S.dropTarget=null;S.painter=false;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('canvas').style.cursor=m==='pan'?'grab':m==='select'?'default':'crosshair';$('hint').textContent=HINTS[m]||'';render('overlay');render('panel')}

// ---------- coordinates & snapping ----------
function point(e){const r=$('canvas').getBoundingClientRect();return[S.view.x+(e.clientX-r.left)/S.view.zoom,S.view.y+(e.clientY-r.top)/S.view.zoom]}
function grid(v,e){return S.prefs.snap&&!(e&&(e.ctrlKey||e.metaKey))?Math.round(v/gridStep())*gridStep():v}
function routeTo(a,b){if(!a)return[b];const st=S.routeStyle;if(!['hv','vh'].includes(st)||Math.abs(a[0]-b[0])<.01||Math.abs(a[1]-b[1])<.01)return[b];return[st==='hv'?[b[0],a[1]]:[a[0],b[1]],b]}
const genericPort=name=>!name||/^(top|right|bottom|left|edge \d+|port \d+)$/i.test(name);
function endpointName(r){const n=find(r?.node);if(!n)return'Missing device';const p=r.port&&n.ports?.find(q=>q.id===r.port);return(resolveLabel(n,n.labels?.[0]||{text:''},makeCtx(pg()))||Shapes.nameOf(n.type))+(r.port?' / '+(p?.name||'Missing port'):' (auto)')}
function hoverPortLabel(t){return t.candidate?'Click to connect here':t.glue?'Connect to '+(resolveLabel(find(t.ref.node),find(t.ref.node)?.labels?.[0]||{text:''})||'device'):'Snap · '+endpointName(t.ref)}
function edgeCandidate(n,p){const[u,v]=C.localPoint(n,p);let x=Math.max(0,Math.min(1,u)),y=Math.max(0,Math.min(1,v));const d=[Math.abs(u),Math.abs(1-u),Math.abs(v),Math.abs(1-v)],side=d.indexOf(Math.min(...d));if(side===0)x=0;if(side===1)x=1;if(side===2)y=0;if(side===3)y=1;x=Math.round(x*40)/40;y=Math.round(y*40)/40;const q=C.portPoint(n,{x,y});return{p:q,ref:null,candidate:{node:n.id,x,y},distance:Math.hypot(q[0]-p[0],q[1]-p[1])}}
function nodesAt(p,pad=0){return[...items()].reverse().filter(n=>n.kind==='node'&&n.type!=='rack'&&itemVisible(n,{doc:S.doc})&&!isLocked(n)).filter(n=>{const b=C.box(n);return p[0]>=b.x-pad&&p[0]<=b.x+b.w+pad&&p[1]>=b.y-pad&&p[1]<=b.y+b.h+pad})}
function snapTarget(p,e,{exclude=null,glue=true}={}){
  S.snapPort=null;S.dropTarget=null;if(e?.altKey)return{p,ref:null};const z=S.view.zoom;
  const t=e?.target?.closest?.('[data-role="port"]');if(t&&t.dataset.id!==exclude){const n=find(t.dataset.id),port=n?.ports.find(q=>q.id===t.dataset.port);if(port){S.snapPort={p:C.portPoint(n,port),ref:{node:n.id,port:port.id}};return S.snapPort}}
  let best=14/z,res=null;for(const n of items())if(n.kind==='node'&&n.id!==exclude&&!isLocked(n)&&itemVisible(n,{doc:S.doc}))for(const port of n.ports||[]){const q=C.portPoint(n,port),d=Math.hypot(q[0]-p[0],q[1]-p[1]);if(d<best){best=d;res={p:q,ref:{node:n.id,port:port.id}}}}
  if(res){S.snapPort=res;return res}
  for(const n of nodesAt(p,12/z)){if(n.id===exclude)continue;const c=edgeCandidate(n,p);if(c.distance<=11/z&&!(glue&&insideBox(n,p,12/z))){S.snapPort=c;return c}if(glue&&insideBox(n,p,0)){S.dropTarget=n.id;return{p:C.center(n),ref:{node:n.id,port:null},glue:true}}if(c.distance<=11/z){S.snapPort=c;return c}}
  return{p:[grid(p[0],e),grid(p[1],e)],ref:null}}
function insideBox(n,p,inset){const b=C.box(n);return p[0]>b.x+inset&&p[0]<b.x+b.w-inset&&p[1]>b.y+inset&&p[1]<b.y+b.h-inset}
function commitPort(t){if(!t?.candidate)return t;const c=t.candidate,n=find(c.node);if(!n)return t;let ex=n.ports.find(q=>Math.hypot(q.x-c.x,q.y-c.y)<.002);if(!ex){ex={id:C.uid(),name:'Edge '+(n.ports.length+1),x:c.x,y:c.y};n.ports.push(ex)}return{p:C.portPoint(n,ex),ref:{node:n.id,port:ex.id}}}

// ---------- selection ----------
function selection(id,add=false,individual=false){const n=find(id);if(!n)return;const ids=n.group&&!individual?items().filter(x=>x.group===n.group).map(x=>x.id):[id];if(!add)S.selected.clear();const remove=add&&ids.every(i=>S.selected.has(i));ids.forEach(i=>remove?S.selected.delete(i):S.selected.add(i));S.activeLabel=null;S.segment=null;S.bend=null}
function select(ids){S.selected=new Set(ids);S.activeLabel=null;S.segment=null;S.bend=null;render('overlay');render('panel')}
function ensureEditable(){if(!S.selected.size){notify('Select an element first.');return false}if(picked().some(isLocked)){notify('Unlock the selection (or its layer) before editing.');return false}return true}
// Everything that moves with the selection: container members, internal links.
function moveSet(ids){
  const all=items(),set=new Set(ids);let grew=true;
  while(grew){grew=false;for(const z of all.filter(n=>set.has(n.id)&&(n.kind==='zone'&&n.contain!==false||n.type==='rack'))){const zb=C.box(z);for(const n of all)if(!set.has(n.id)&&!isLocked(n)&&n.kind!=='edge'&&C.inside(C.box(n),zb,1)&&!(n.kind==='zone'&&n.w*n.h>=z.w*z.h)){set.add(n.id);grew=true}}}
  const nodes=new Set(all.filter(n=>set.has(n.id)&&n.kind!=='edge').map(n=>n.id)),zones=all.filter(n=>set.has(n.id)&&(n.kind==='zone'||n.type==='rack')).map(C.box);
  for(const e of all.filter(n=>n.kind==='edge')){const endOk=k=>e[k]?nodes.has(e[k].node):zones.some(b=>C.inside({x:(k==='from'?e.points[0]:e.points.at(-1))[0],y:(k==='from'?e.points[0]:e.points.at(-1))[1],w:0,h:0},b));const inner=endOk('from')&&endOk('to');if(set.has(e.id)&&!inner&&(e.from&&!nodes.has(e.from.node)||e.to&&!nodes.has(e.to.node)))set.delete(e.id);else if(!set.has(e.id)&&inner&&(e.from||e.to||zones.length))set.add(e.id)}
  return all.filter(n=>set.has(n.id)&&!isLocked(n))}

// ---------- pointer ----------
function beginPointer(e){
  if(e.button===2)return;if(!$('inlineText').hidden){$('inlineText').blur();return}
  hideMenus();const p=point(e),t=e.target.closest('[data-role]'),role=t?.dataset.role,id=t?.dataset.id,n=id&&find(id),now=Date.now(),key=role+':'+id+':'+(t?.dataset.label||t?.dataset.index||'');
  if(S.lastClick&&now-S.lastClick.time<380&&S.lastClick.key===key&&Math.hypot(e.clientX-S.lastClick.x,e.clientY-S.lastClick.y)<6&&S.mode==='select'){S.lastClick=null;onDoubleClick(e,p,t,n);return}
  S.lastClick={time:now,key,x:e.clientX,y:e.clientY};
  if(S.pickHandler){const h=S.pickHandler;S.pickHandler=null;if(n?.kind==='node'){h(n.id);return}notify('Path trace cancelled.',1500)}
  const capture=()=>$('canvas').setPointerCapture(e.pointerId);
  if(role==='guide'&&S.mode==='select'){remember();S.drag={kind:'guide',guide:t.dataset.guide};capture();return}
  if(S.space||S.mode==='pan'||e.button===1){e.preventDefault();S.drag={kind:'pan',start:[e.clientX,e.clientY],view:{...S.view}};$('canvas').style.cursor='grabbing';capture();return}
  if(S.painter){if(n){applyPainter(n);if(!S.painterSticky){S.painter=false;$('canvas').style.cursor='default'}}else{S.painter=false;$('canvas').style.cursor='default'}render();return}
  if(role==='autoconnect'){S.drag={kind:'autoconn',id,dir:t.dataset.dir,start:p,startClient:[e.clientX,e.clientY]};capture();return}
  if(role==='rotate'&&editable().length===1){remember();const m=picked()[0];S.drag={kind:'rotate',id:m.id,center:C.center(m),original:C.copy(m)};capture();return}
  if(role==='port'&&(S.mode==='select'||S.mode==='connect')&&n&&!isLocked(n)){const port=n.ports.find(q=>q.id===t.dataset.port);startConnect({p:C.portPoint(n,port),ref:{node:n.id,port:port.id}},p,e);capture();return}
  if(S.mode==='connect'){
    if(S.trace){let c=snapTarget(p,e);if(c.candidate){remember();c=commitPort(c);changed()}if(c.glue)c={p:c.p,ref:c.ref};S.trace.steps.push(S.trace.points.length);S.trace.points.push(...routeTo(S.trace.points.at(-1),c.p));S.trace.to=c.ref;if(c.ref){finishTrace();return}S.hover=null;render('overlay');return}
    const c=snapTarget(p,e);startConnect(c,p,e);capture();return}
  if(S.mode==='zone'){S.drag={kind:'zone',start:[grid(p[0]),grid(p[1])]};S.drag.current=S.drag.start;capture();return}
  if(S.mode==='text'){S.drag={kind:'textbox',start:p,current:p};capture();return}
  if(S.mode==='port'&&n?.kind==='node'&&!isLocked(n)){if(role==='port'){remember();S.drag={kind:'port',id:n.id,port:t.dataset.port};capture()}else{const c=edgeCandidate(n,p);mutate(()=>n.ports.push({id:C.uid(),name:'Port '+(n.ports.length+1),x:c.candidate.x,y:c.candidate.y}))}return}
  if(role==='resize'){if(!editable().length)return;remember();S.drag={kind:'resize',start:p,original:C.copy(editable()),box:C.bounds(picked()),hx:+t.dataset.hx,hy:+t.dataset.hy};capture();return}
  if(n){
    if(n.kind==='node'&&n.url&&(e.ctrlKey||e.metaKey)){followLink(n.url);return}
    if(e.shiftKey){selection(id,true,e.ctrlKey||e.metaKey);render('overlay');render('panel');return}
    if(!S.selected.has(id)||e.ctrlKey||e.metaKey)selection(id,false,e.ctrlKey||e.metaKey);
    if(isLocked(n)){render('overlay');render('panel');return}
    const kind=role==='label'?'label':role==='segment'?'segment':role==='bend'?'bend':'move';
    S.activeLabel=kind==='label'?{owner:id,id:t.dataset.label}:null;S.segment=kind==='segment'?{id,index:+t.dataset.index}:null;S.bend=kind==='bend'?{id,index:+t.dataset.index}:null;
    remember();
    let set=kind==='move'?moveSet([...S.selected].filter(i=>!isLocked(find(i)))):editable();
    if(kind==='move'&&e.altKey){const dup=C.duplicate(set,0,0);items().push(...dup);set=dup;S.selected=new Set(dup.map(x=>x.id));S.duplicated=true}
    S.drag={kind,start:p,id:kind==='move'&&e.altKey?set.find(x=>x.kind!=='edge')?.id:id,label:t.dataset.label,index:+t.dataset.index,original:C.copy(set),box:C.bounds(set.filter(x=>x.kind!=='edge').length?set.filter(x=>x.kind!=='edge'):set)};
  }else{if(!e.shiftKey)S.selected.clear();S.activeLabel=null;S.segment=null;S.bend=null;S.drag={kind:'box',start:p,current:p,add:e.shiftKey}}
  capture();render('overlay');render('panel')}

function startConnect(c,p,e){
  if(c.candidate){remember();c=commitPort(c);changed()}else remember();
  const lt=Shapes.linkTypes[S.linkType]||{};
  S.drag={kind:'connect',from:c.ref,fromP:c.p,start:p,startClient:[e.clientX,e.clientY],preview:[c.p,c.p],stroke:lt.stroke,width:lt.width,dash:lt.dash}}

function pointerMove(e){
  const p=point(e);S.cursor=p;updateCursorReadout(p);const d=S.drag;
  if(!d){
    if(S.mode==='connect'){if(S.trace){const t=snapTarget(p,e);S.hover=t.p}else snapTarget(p,e);S.hoverId=nodesAt(p)[0]?.id||null;render('overlay')}
    else if(S.mode==='select'||S.mode==='port'){const tgt=e.target.closest('[data-id]'),id=tgt?.dataset.id,n=id&&find(id);let h=n?.kind==='node'?n.id:null;if(!h&&S.hoverId){const o=find(S.hoverId);if(o){const b=C.box(o),pad=46/S.view.zoom;if(p[0]>b.x-pad&&p[0]<b.x+b.w+pad&&p[1]>b.y-pad&&p[1]<b.y+b.h+pad+30/S.view.zoom)h=o.id}}if(h!==S.hoverId){S.hoverId=h;render('overlay')}}
    else render('overlay');
    if(S.prefs.rulers)renderRulers();return}
  if(d.kind==='guide'){const g=pg().guideLines.find(x=>x.id===d.guide);g.pos=grid(p[g.axis==='x'?0:1]);d.moved=true;render('scene');return}
  if(d.kind==='pan'){S.view.x=d.view.x-(e.clientX-d.start[0])/S.view.zoom;S.view.y=d.view.y-(e.clientY-d.start[1])/S.view.zoom;render('overlay');return}

function titleBlock(){return mutate(()=>{const b=C.pageSize(pg()),m=pg().margin*C.PX,t={id:C.uid(),kind:'table',cols:[110,300],rowH:22,size:11,header:false,boldFirstCol:true,rows:[['Project','{{doc.name}}'],['Drawing','{{page.name}}'],['Company','{{doc.company}}'],['Prepared by','{{doc.author}}'],['Revision','{{doc.revision}}'],['Date','{{date}}'],['Sheet','{{page.number}} of {{page.count}}']],labels:[],stroke:'#64748b',headerFill:'#eef2f7',layer:S.activeLayer};tableLayout(t);t.x=b.w-m-t.w-10;t.y=b.h-m-t.h-10;items().push(t);select([t.id]);return t})}

function onKey(e){

  if((k==='enter'||k==='f2')&&S.selected.size===1){e.preventDefault();const n=picked()[0];if(n.kind==='edge')editEdgeLabel(n);else if(n.kind==='table')editCell(n,0,0);else onDoubleClick(e,C.center(n),null,n);return}

<script>

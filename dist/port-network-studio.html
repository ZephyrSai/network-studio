function common(n){return section('Arrange',`${field('Layer',sel('layer',layerOptions(),n.layer||S.doc.layers[0].id))}${row(btn('front','To front'),btn('back','To back'))}${row(btn(n.locked?'unlock':'lock',n.locked?'Unlock':'Lock'),btn('duplicate','Duplicate'))}${row(btn('copyFormat','Copy format'),btn('painter','Format painter'))}`,'arrange')}
function geometry(n,rot=true){return section('Position & size',`${row(field('X',inp('x',num(n.x),'number')),field('Y',inp('y',num(n.y),'number')))}${row(field('Width',inp('w',num(n.w),'number','min="4"')),field('Height',inp('h',num(n.h),'number','min="4"')))}${rot?row(field('Rotation °',inp('rotation',n.rotation||0,'number')),`<div class="fld"><span>Flip</span><div class="seg">${btn('flipX','⇋ H')}${btn('flipY','⇵ V')}</div></div>`):''}`,'geom')}
function labelsList(n){return section('Text',`${n.labels?.[0]?field(n.kind==='zone'?'Heading':'Name / text',area('labels.0.text',n.labels[0].text,Math.min(4,(n.labels[0].text.match(/\n/g)||[]).length+1),'data-live="1"')):''}${n.labels?.[0]?row(field('Size',inp('labels.0.size',n.labels[0].size,'number','min="5" max="144"')),field('Colour',color('labels.0.color',n.labels[0].color))):''}
  ${n.labels?.[0]?`<div class="seg">${btn('bold','<b>B</b>','title="Bold (Ctrl+B)" class="'+(n.labels[0].bold?'active':'')+'"')}${btn('italic','<i>I</i>','title="Italic" class="'+(n.labels[0].italic?'active':'')+'"')}${btn('labelBg','▭ Halo','title="White background behind text" class="'+(n.labels[0].background?'active':'')+'"')}${btn('alignL','⯇','title="Align left"')}${btn('alignC','≡','title="Centre"')}${btn('alignR','⯈','title="Align right"')}</div>`:''}
  <div class="chips">${(n.labels||[]).slice(1).map(l=>`<button data-label-select="${l.id}" title="Edit label">${h(l.text.slice(0,28)||'Empty label')}</button>`).join('')}${btn('addLabel','＋ Label')}</div><p class="muted">Use {{hostname}}, {{ip}} or any data field in text to show live values.</p>`,'text')}
function nodePanel(n){
  const kind=Shapes.kindOf(n.type),dev=kind==='device'||n.image;let out='';
  out+=`<div class="typeHead">${n.image?'':Shapes.iconSvg(n.type,{size:34,display:n.display==='card'?'symbol':n.display,accent:n.stroke})}<div>${field('Shape type',sel('type',typeOptions(),n.type,n.image?'disabled':''))}</div></div>`;
  out+=labelsList(n);
  if(kind==='rack'){const r=Analysis.racks(pg()).find(x=>x.rack===n);out+=section('Rack',`${row(field('Height (U)',sel('units',[[12,'12U'],[18,'18U'],[24,'24U'],[42,'42U'],[45,'45U'],[47,'47U'],[48,'48U']],n.units||42)),field('Frame colour',color('stroke',n.stroke)))}<p class="muted">${r?`${r.used} of ${r.units} U used · ${r.free} U free${r.power?' · '+r.power+' W':''}`:''}</p>${r?.eq.length?`<div class="list">${r.eq.map(e=>`<button data-select="${e.id}"><b>U${Shapes.rackU(n,e)}</b> ${h(Analysis.nameOf(e))}</button>`).join('')}</div>`:'<p class="muted">Drag rack equipment from the Racks stencil into the rack — it snaps to U slots.</p>'}`,'rack')}
  else if(kind==='rackitem'){const r=rackOf(n,pg());out+=section('Rack equipment',`${row(field('Height (U)',inp('ru',Math.round(n.h/Shapes.RU),'number','min="1" max="20"')),r?field('Position (U, bottom)',inp('rackPos',Shapes.rackU(r,n),'number','min="1"')):'<div class="fld"><span>Rack</span><em class="muted">not in a rack</em></div>')}${row(field('Face colour',color('fill',n.fill)),field('Detail colour',color('stroke',n.stroke)))}`,'rackitem')}
  else{
    if(dev)out+=section('Appearance',`${n.image?'':seg('display',[['symbol','Symbol'],['card','Card'],['tile','Tile'],['circle','Circle']],n.display||'symbol')}${row(field('Accent',color('stroke',n.stroke)),field('Fill',color('fill',n.fill)))}${row(field('Line weight',inp('strokeWidth',n.strokeWidth??2,'number','min="0.5" max="6" step="0.25"')),field('Opacity',inp('opacity',n.opacity??1,'number','min="0.1" max="1" step="0.05"')))}`,'appearance');
    else out+=section('Appearance',`${row(field('Line',color('stroke',n.stroke)),field('Fill',color('fill',n.fill==='none'?'':n.fill)))}${row(field('Line weight',inp('strokeWidth',n.strokeWidth??1.75,'number','min="0" max="12" step="0.25"')),field('Line style',sel('dash',DASH,n.dash||'')))}${chk('fillNone',n.fill==='none','No fill')}`,'appearance')}
  if(kind!=='rack'&&kind!=='rackitem')out+=geometry(n);else out+=geometry(n,false);
  if(n.ports&&kind!=='rack')out+=section('Connection points',`<div class="portList">${n.ports.map(p=>`<div class="portrow"><input data-port-name="${p.id}" value="${h(p.name)}" aria-label="Port name"><span class="muted">${portUse(n,p)}</span><button data-port-delete="${p.id}" title="Delete point">×</button></div>`).join('')}</div>
    <details class="sub"><summary>Generate interface points…</summary>${row(field('Side',sel('_genSide',[['bottom','Bottom'],['top','Top'],['left','Left'],['right','Right']],'bottom','data-nobind="1" id="genSide"')),field('Count',`<input id="genCount" type="number" value="8" min="1" max="96">`))}${row(field('Name prefix',`<input id="genPrefix" value="Gi1/0/">`),field('Start no.',`<input id="genStart" type="number" value="1">`))}${chk('_genReplace',false,'Replace existing points').replace('data-bind="_genReplace"','id="genReplace"')}${btn('genPorts','Create points','class="primary wide"')}</details>${chk('_showPorts',S.prefs.showPorts,'Show points & names on selection').replace('data-bind="_showPorts"','data-pref="showPorts"')}`,'ports');
  out+=section('Hyperlink',`${field('URL or page',`<input data-bind="url" value="${h(n.url||'')}" placeholder="https://… (Ctrl+click to open)" list="pageLinks">`)}<datalist id="pageLinks">${S.doc.pages.map(p=>`<option value="#page:${p.id}">Page: ${h(p.name)}</option>`).join('')}</datalist>`,'link');
  return out+common(n)}
function portUse(n,p){const c=items().filter(e=>e.kind==='edge'&&(e.from?.port===p.id&&e.from.node===n.id||e.to?.port===p.id&&e.to.node===n.id)).length;return c?'● '+c:'○'}
function edgePanel(e){
  const lt=Object.entries(Shapes.linkTypes).map(([k,v])=>[k,v.name]);lt.push(['custom','Custom']);
  return section('Link',`${field('Link type',sel('linkType',lt,e.linkType||'custom'))}${field('Routing',sel('routing',ROUTES,e.curve==='smooth'?'free':e.routing))}${row(field('From interface',inp('fromIf',e.fromIf||'','text','placeholder="e.g. Gi1/0/1"')),field('To interface',inp('toIf',e.toIf||'','text','placeholder="e.g. Te1/1/1"')))}${field('Label',`<input data-bind="labels.0.text" value="${h(e.labels?.[0]?.text||'')}" placeholder="e.g. 10G · VLAN 10-20">`)}<p class="muted">${e.from?'Start: '+h(endpointName(e.from)):'Start: free'}<br>${e.to?'End: '+h(endpointName(e.to)):'End: free'}</p>${row(btn('reverse','⇄ Reverse'),btn('reroute','↻ Re-route'))}`,'link')
  +section('Line style',`${row(field('Colour',color('stroke',e.stroke)),field('Weight',inp('strokeWidth',e.strokeWidth||2,'number','min="0.5" max="12" step="0.25"')))}${row(field('Pattern',sel('dash',DASH,e.dash||'')),field('Shape',sel('curve',[['straight','Angled'],['smooth','Curved']],e.curve||'straight')))}${row(field('Start',sel('startMarker',MARK,e.startMarker||'none')),field('End',sel('endMarker',MARK,e.endMarker||'none')))}${chk('double',e.double,'Double line (tunnel / bundle)')}${chk('jumps',e.jumps!==false,'Line jumps at crossings')}${chk('follow',e.follow!==false,'Stay attached when devices move')}`,'style')
  +(e.routing!=='auto'&&e.routing!=='straight'?section('Path editing',`<p class="muted">Drag sections sideways or bends freely. Double-click inserts a bend. Select a section or bend and press Delete.</p>${row(btn('deleteSegment','Delete section'),btn('deleteBend','Delete bend'))}${row(btn('extendStart','Extend start'),btn('extendEnd','Extend end'))}${row(btn('parallel','Parallel copy'),btn('detach','Detach ends'))}${btn('toAuto','Switch to auto-routing','class="wide"')}`,'path'):'')
  +common(e)}
function zonePanel(z){const c=C.cidr(z.data?.subnet);return labelsList(z)+section('Zone style',`${seg('style',[['plain','Plain'],['header','Header'],['tab','Tab'],['outline','Outline']],z.style||'plain')}${row(field('Fill',color('fill',z.fill)),field('Border',color('stroke',z.stroke)))}${row(field('Border style',sel('dash',DASH,z.dash||'')),field('Weight',inp('strokeWidth',z.strokeWidth??1.5,'number','min="0" max="8" step="0.25"')))}${z.style==='header'||z.style==='tab'?field('Header colour',color('headerFill',z.headerFill||'')):''}${chk('contain',z.contain!==false,'Move contents with the zone (container)')}${chk('showMeta',z.showMeta!==false,'Show VLAN / subnet in the corner')}${row(btn('fitZone','Fit to contents'),btn('selectMembers','Select members'))}`,'zstyle')+(c?section('Subnet',subnetInfo(z,c),'subnet'):'')+geometry(z,false)+common(z)}
function subnetInfo(z,c){const plan=Analysis.ipPlan(S.doc).find(r=>r.zone===z);return`<table class="kv"><tr><td>Network</td><td>${c.text}</td></tr><tr><td>Mask</td><td>${c.maskText}</td></tr><tr><td>Usable</td><td>${C.int2ip(c.first)} – ${C.int2ip(c.last)}</td></tr><tr><td>Broadcast</td><td>${C.int2ip(c.broadcast)}</td></tr><tr><td>Hosts</td><td>${c.hosts.toLocaleString()}</td></tr>${plan?`<tr><td>In use</td><td>${plan.used} (${(plan.used/Math.max(1,c.hosts)*100).toFixed(1)}%)</td></tr><tr><td>Next free</td><td>${plan.next||'—'}</td></tr>`:''}</table>`}
function textPanel(t){const devs=items().filter(n=>n.kind==='node'&&Shapes.isDevice(n));return labelsList(t)+section('Box',`${row(field('Fill',color('fill',t.fill||'')),field('Border',color('stroke',t.stroke||'')))}${row(field('Wrap width',inp('labels.0.wrapWidth',t.labels?.[0]?.wrapWidth||0,'number','min="0"')),field('Corner',inp('rx',t.rx??6,'number','min="0"')))}${field('Callout points to',sel('target',[['','(nothing)'],...devs.map(d=>[d.id,Analysis.nameOf(d)])],t.target||''))}`,'box')+geometry(t,false)+common(t)}
function tablePanel(t){return section('Table',`${row(field('Rows',inp('_rows',t.rows.length,'number','min="1" max="500"')),field('Columns',inp('_cols',t.cols.length,'number','min="1" max="30"')))}${row(field('Text size',inp('size',t.size||11,'number','min="6" max="40"')),field('Row height',inp('rowH',t.rowH,'number','min="12" max="120"')))}${field('Column widths',inp('_widths',t.cols.map(Math.round).join(', ')))}${chk('header',t.header!==false,'Header row')}${chk('boldFirstCol',!!t.boldFirstCol,'Bold first column')}${row(field('Lines',color('stroke',t.stroke)),field('Header',color('headerFill',t.headerFill)))}${field('Contents (CSV — edit and click Apply)',`<textarea id="tableCsv" rows="6" spellcheck="false">${h(t.rows.map(r=>r.map(v=>/[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':v).join(',')).join('\n'))}</textarea>`)}${row(btn('tableApplyCsv','Apply CSV'),btn('tableCopy','Copy for Excel'))}<p class="muted">Double-click a cell to edit; Tab moves to the next cell. {{doc.name}}, {{page.number}}, {{date}} fields work in cells.</p>`,'table')+common(t)}
function legendPanel(l){return section('Legend',`${field('Title',inp('title',l.title||'LEGEND'))}${chk('devices',l.devices!==false,'Device types')}${chk('links',l.links!==false,'Link types')}${chk('colors',l.colors!==false,'Colour-by values')}${chk('counts',l.counts!==false,'Show counts')}${row(field('Background',color('fill',l.fill||'#ffffff')),field('Border',color('stroke',l.stroke||'#a2b2c6')))}<p class="muted">The legend updates automatically from what is on this page.</p>`,'legend')+common(l)}
function propsFor(n){return n.kind==='node'?nodePanel(n):n.kind==='edge'?edgePanel(n):n.kind==='zone'?zonePanel(n):n.kind==='text'?textPanel(n):n.kind==='table'?tablePanel(n):n.kind==='legend'?legendPanel(n):common(n)}

function labelPanel(owner,l){return section('Label',`${field('Text',area('L.text',l.text,4,'data-live="1"'))}${row(field('Size',inp('L.size',l.size,'number','min="5" max="144"')),field('Rotation °',inp('L.rotation',l.rotation||0,'number')))}${row(field('Colour',color('L.color',l.color)),field('Align',sel('L.align',[['start','Left'],['middle','Centre'],['end','Right']],l.align||'middle')))}${row(field('Font',sel('L.font',[['','Sans (default)'],[C.MONO,'Monospace'],['Georgia, serif','Serif']],l.font||'')),field('Wrap width',inp('L.wrapWidth',l.wrapWidth||0,'number','min="0"')))}${chk('L.bold',l.bold,'Bold')}${chk('L.italic',l.italic,'Italic')}${chk('L.underline',l.underline,'Underline')}${chk('L.background',l.background,'Background halo')}${l.anchor?field('Position along connector',`<input type="range" min="0" max="1" step="0.01" data-bind="L.anchor.t" value="${l.anchor.t}">`):''}${row(btn('editLabel','Edit on canvas'),btn('deleteLabel','Delete label'))}`,'label')}

// ---------- data tab ----------
function dataPanel(n){
  if(n.kind==='edge')return section('Link data',S.doc.linkFields.map(f=>dataField(f,n)).join('')+customFields(n,S.doc.linkFields),'ldata');
  if(n.kind==='zone'){const vl=S.doc.vlans||[];return section('Network',`${field('Subnet (CIDR)',inp('data.subnet',n.data?.subnet||'','text','placeholder="10.10.20.0/24" spellcheck="false"'))}${row(field('VLAN',`<input data-bind="data.vlan" value="${h(n.data?.vlan||'')}" list="vlanList">`),field('Gateway',inp('data.gateway',n.data?.gateway||'','text','placeholder="10.10.20.1"')))}<datalist id="vlanList">${vl.map(v=>`<option value="${h(v.id)}">${h(v.name||'')}</option>`).join('')}</datalist>${field('Security level / trust',sel('data.security',[['',''],['Untrusted','Untrusted'],['DMZ','DMZ'],['Restricted','Restricted'],['Trusted','Trusted'],['Management','Management'],['OT / Level 0-2','OT / Level 0–2'],['OT / Level 3','OT / Level 3']],n.data?.security||''))}${field('Notes',area('data.notes',n.data?.notes||'',3))}${C.cidr(n.data?.subnet)?subnetInfo(n,C.cidr(n.data.subnet)):''}${row(btn('assignIps','Assign free IPs to members'),btn('vlanFromZone','Add to VLAN registry'))}`,'zdata')+customFields(n,C.ZONE_FIELDS)}
  if(n.kind!=='node')return'<p class="muted pad">This object has no shape data.</p>';
  const nf=Analysis.nextFreeIp(n,pg());
  return section('Shape data',fieldsFor(n).map(f=>dataField(f,n,f.key==='ip'&&nf?`<button class="mini" data-action="fillIp" title="Use the next free address in this zone">${nf}</button>`:'')).join(''),'sdata')+section('Custom fields',customFields(n,S.doc.fields)+`<div class="row"><input id="newKey" placeholder="Field name"><input id="newVal" placeholder="Value"></div>${btn('addField','＋ Add field','class="wide"')}`,'cdata')+connectionsPanel(n)}
function dataField(f,n,extra=''){const v=n.data?.[f.key]??'';if(f.options)return field(f.label,sel('data.'+f.key,[['',''],...f.options.map(o=>[o,o])],v));if(f.multiline)return field(f.label,area('data.'+f.key,v,2));return field(f.label,`<span class="withBtn">${inp('data.'+f.key,v,f.type==='number'?'number':'text','spellcheck="false"')}${extra}</span>`)}
function customFields(n,known){const keys=Object.keys(n.data||{}).filter(k=>!known.some(f=>f.key===k)&&!S.doc.fields.some(f=>f.key===k));return keys.map(k=>`<div class="portrow"><span class="key">${h(k.replace(/^x_/,''))}</span><input data-bind="data.${h(k)}" value="${h(n.data[k])}"><button data-del-field="${h(k)}" title="Remove">×</button></div>`).join('')}
function connectionsPanel(n){const es=items().filter(e=>e.kind==='edge'&&(e.from?.node===n.id||e.to?.node===n.id));if(!es.length)return section('Connections','<p class="muted">No links yet.</p>','conn');return section(`Connections (${es.length})`,`<div class="list">${es.map(e=>{const out=e.from?.node===n.id,other=out?e.to:e.from,mine=out?e.fromIf:e.toIf,theirs=out?e.toIf:e.fromIf;return`<button data-select="${e.id}"><span class="sw" style="background:${e.stroke}"></span><b>${h(mine||'—')}</b> → ${h(other?Analysis.nameOf(find(other.node)):'(open end)')}${theirs?' <em>'+h(theirs)+'</em>':''}</button>`}).join('')}</div>${btn('traceFrom','Trace path from here…','class="wide"')}`,'conn')}

function multiPanel(a){const kinds={};a.forEach(n=>kinds[n.kind]=(kinds[n.kind]||0)+1);const nodes=a.filter(n=>n.kind==='node'),edges=a.filter(n=>n.kind==='edge'),f=a.find(n=>n.kind!=='edge')||a[0];
  return`<p class="muted pad">${Object.entries(kinds).map(([k,v])=>v+' '+({node:'shape',edge:'connector',zone:'zone',text:'text',table:'table',legend:'legend'}[k]||k)+(v>1?'s':'')).join(' · ')}</p>`
  +section('Align & distribute',`${field('Relative to',sel('_alignRef',[['first','First selected'],['selection','Selection bounds'],['page','Printable page']],S.alignRef||'first','id="alignRef"'))}<div class="iconGrid">${[['align0','⇤','Align left'],['align1','⇹','Centre horizontally'],['align2','⇥','Align right'],['align3','⤒','Align top'],['align4','⇳','Centre vertically'],['align5','⤓','Align bottom']].map(([a2,i,t])=>btn(a2,i,`title="${t}"`)).join('')}</div>${row(btn('distributeX','↔ Equal gaps'),btn('distributeY','↕ Equal gaps'))}${row(btn('sameWidth','Same width'),btn('sameHeight','Same height'))}`,'align')
  +section('Appearance',`${row(field('Line / accent',color('stroke',f.stroke||'')),field('Fill',color('fill',f.fill||'')))}${nodes.length?seg('display',[['symbol','Symbol'],['card','Card'],['tile','Tile'],['circle','Circle']],nodes[0].display):''}${edges.length?field('Link type',sel('linkType',[['','—'],...Object.entries(Shapes.linkTypes).map(([k,v])=>[k,v.name])],'')):''}${edges.length?field('Routing',sel('routing',[['','—'],...ROUTES],'')):''}${field('Label size',inp('labels.*.size','','number','placeholder="mixed" min="5"'))}`,'mappearance')
  +section('Organise',`${row(btn('group','Group'),btn('ungroup','Ungroup'))}${row(btn('wrapZone','Wrap in zone'),btn('layoutSel','Auto-layout these'))}${field('Layer',sel('layer',[['','—'],...layerOptions()],''))}${row(btn('lock','Lock'),btn('unlock','Unlock'))}`,'organise')
  +(nodes.length>1?section('Auto-number',`${field('Pattern',`<input id="numPattern" value="${h(S.numPattern||'SW-{n:02}')}">`)}${row(field('Start',`<input id="numStart" type="number" value="1">`),field('Order',`<select id="numOrder"><option value="rows">Rows (left→right)</option><option value="cols">Columns (top→bottom)</option><option value="selection">Selection order</option></select>`))}${chk('_numHost',true,'Also set hostname').replace('data-bind="_numHost"','id="numHost"')}${btn('autoNumber','Number selected devices','class="wide"')}<p class="muted">{n} = number, {n:03} = zero-padded, {type}, {zone}.</p>`,'numbering'):'')}
function multiData(a){const nodes=a.filter(n=>n.kind==='node');if(!nodes.length)return'<p class="muted pad">Select devices to edit their data together.</p>';const keys=['status','vlan','location','owner','vendor','model','os'];return section(`Bulk edit · ${nodes.length} devices`,keys.map(k=>{const f=S.doc.fields.find(x=>x.key===k);if(!f)return'';const vals=new Set(nodes.map(n=>n.data?.[k]??''));const v=vals.size===1?[...vals][0]:'';return f.options?field(f.label,sel('data.'+k,[['',vals.size>1?'(mixed)':''],...f.options.map(o=>[o,o])],v)):field(f.label,inp('data.'+k,v,'text',vals.size>1?'placeholder="(mixed)"':''))}).join('')+'<p class="muted">Changes apply to every selected device.</p>','bulk')}

function pagePanel(){const p=pg(),papers=[...Object.keys(C.PAPERS),'Custom'].map(k=>[k,k]);const bgs=S.doc.pages.filter(x=>x.isBackground&&x!==p);
  return section('Page setup',`${field('Page name',`<input data-page="name" value="${h(p.name)}">`)}${row(field('Paper',`<select data-page="paper">${papers.map(([v,t])=>`<option ${p.paper===v?'selected':''}>${t}</option>`).join('')}</select>`),field('Orientation',`<select data-page="orientation"><option value="landscape" ${p.orientation==='landscape'?'selected':''}>Landscape</option><option value="portrait" ${p.orientation==='portrait'?'selected':''}>Portrait</option></select>`))}${p.paper==='Custom'?row(field('Width mm',`<input data-page="customW" type="number" value="${p.customW}" min="50">`),field('Height mm',`<input data-page="customH" type="number" value="${p.customH}" min="50">`)):''}${row(field('Margin mm',`<input data-page="margin" type="number" value="${p.margin}" min="0" max="60">`),field('Page colour',`<input type="color" data-page="bg" value="${p.bg||'#ffffff'}">`))}${btn('fitPageToDrawing','Fit page to drawing','class="wide"')}`,'psetup')

function docPanel(){const d=S.doc,fieldOpts=[['','None'],['status','Status'],['vlan','VLAN'],['_category','Device category'],...d.fields.filter(f=>!['status','vlan','notes'].includes(f.key)).map(f=>[f.key,f.label])];

// ---------- change handling ----------
function setPath(obj,path,v){const ks=path.split('.');let o=obj;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};o=o[ks[i]]}o[ks.at(-1)]=v}
function getPath(obj,path){return path.split('.').reduce((o,k)=>o?.[k],obj)}
function convert(e){const t=e.target;if(t.type==='checkbox')return t.checked;if(t.type==='number'||t.type==='range'){const v=+t.value;return Number.isFinite(v)?v:null}return t.value}
function apply(bind,v){
  const targets=editable();if(!targets.length&&!S.activeLabel)return;
  if(bind.startsWith('L.')){const n=find(S.activeLabel.owner),l=n?.labels.find(x=>x.id===S.activeLabel.id);if(!l||isLocked(n))return;mutate(()=>setPath(l,bind.slice(2),v));return}
  if(v===null)return;
  mutate(()=>{for(const n of targets){
    if(bind==='type'){const old=n.type;n.type=v;const st=Stencils.shapes[v];if(st&&Shapes.kindOf(old)==='device'){const b=C.box(n),cx=b.x+b.w/2,by=b.y+b.h;const k=Math.sqrt((n.w*n.h)/(st.w*st.h));n.w=Math.round(st.w*k);n.h=Math.round(st.h*k);n.x=cx-n.w/2;const dy=by-(n.y+n.h);n.y+=dy}if(n.labels?.[0]&&n.labels[0].text===Shapes.nameOf(old))n.labels[0].text=Shapes.nameOf(v);continue}
    if(bind==='linkType'){if(n.kind==='edge'&&v)Shapes.applyLinkType(n,v);continue}
    if(bind==='routing'){if(n.kind!=='edge'||!v)continue;n.routing=v;n.curve=v==='free'&&n.curve==='smooth'?'smooth':'straight';if(['hv','vh'].includes(v))Conn.orthogonalize(n);Conn.markDirty(n.id);continue}
    if(bind==='curve'){if(n.kind!=='edge')continue;n.curve=v;if(v==='smooth'){if(n.routing==='auto'||n.routing==='straight'||n.routing==='hv'||n.routing==='vh')n.routing='free';if(n.points.length===2){const[a,b]=n.points,dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;n.points.splice(1,0,[(a[0]+b[0])/2-dy/l*35,(a[1]+b[1])/2+dx/l*35])}}else Conn.orthogonalize(n);continue}
    if(bind==='units'){const s=Shapes.rackSize(+v),dy=n.h-s.h;n.units=+v;n.h=s.h;continue}
    if(bind==='ru'){const r=rackOf(n,pg()),bottom=n.y+n.h;n.h=Math.max(1,Math.round(v))*Shapes.RU;if(r)n.y=bottom-n.h;n.labels.forEach(l=>{l.y=n.y+n.h/2+l.size*.36});continue}
    if(bind==='rackPos'){const r=rackOf(n,pg());if(!r)continue;const i=Shapes.rackInner(r),y=i.y+i.h-(Math.round(v)-1)*Shapes.RU-n.h;C.move(n,0,Math.max(i.y,Math.min(i.y+i.h-n.h,y))-n.y);continue}
    if(['x','y','w','h'].includes(bind)&&n.kind!=='edge'){if(bind==='x'||bind==='y'){C.move(n,bind==='x'?v-n.x:0,bind==='y'?v-n.y:0)}else if(v>=4){const b=C.box(n),sx=bind==='w'?v/n.w:1,sy=bind==='h'?v/n.h:1;n.w*=sx;n.h*=sy;for(const l of n.labels||[]){if(n.kind==='node'){l.x=b.x+(l.x-b.x)*sx;if(l.y>b.y+b.h)l.y+=n.h-b.h}}}continue}
    if(bind==='fillNone'){n.fill=v?'none':'#ffffff';continue}
    if(bind==='display'&&n.kind!=='node')continue;
    if(bind==='target'){if(v)n.target=v;else delete n.target;continue}
    if(bind.startsWith('labels.*.')){for(const l of n.labels||[])setPath(l,bind.slice(9),v);continue}
    if(bind.startsWith('labels.0.')&&!n.labels?.length){if(bind==='labels.0.text'&&v==='')continue;if(n.kind==='edge'){const q=Conn.pointAt(n,.5),l=C.label('',q[0],q[1]-8,11);l.anchor={t:.5,dx:0,dy:-8};l.background=true;n.labels=[l]}else{const b=C.box(n);n.labels=[C.label('',b.x+b.w/2,b.y+b.h+16)]}}
    if(bind==='_rows'||bind==='_cols'||bind==='_widths'){if(n.kind!=='table')continue;if(bind==='_rows'){const r=Math.max(1,Math.round(v));while(n.rows.length<r)n.rows.push(n.cols.map(()=>''));n.rows.length=r}if(bind==='_cols'){const c=Math.max(1,Math.round(v));while(n.cols.length<c){n.cols.push(100);n.rows.forEach(r=>r.push(''))}n.cols.length=c;n.rows.forEach(r=>r.length=c)}if(bind==='_widths'){const w=String(v).split(/[,\s]+/).map(Number).filter(x=>x>8);w.forEach((x,i)=>{if(i<n.cols.length)n.cols[i]=x})}tableLayout(n);continue}
    if(bind==='url'){if(v)n.url=v;else delete n.url;continue}
    if(bind==='layer'){if(v)n.layer=v;continue}
    if(bind.startsWith('data.')&&v===''&&S.selected.size>1&&document.activeElement?.placeholder==='(mixed)')continue;
    if(bind==='stroke'&&n.kind==='edge')n.linkType=n.linkType&&Shapes.linkTypes[n.linkType]?.stroke===v?n.linkType:n.linkType;
    if(['dash','strokeWidth','stroke','double'].includes(bind)&&n.kind==='edge'&&n.linkType&&n.linkType!=='custom'){const t=Shapes.linkTypes[n.linkType];const nv={...n,[bind]:v};if(t&&(nv.stroke!==t.stroke||nv.dash!==t.dash||nv.strokeWidth!==t.width||!!nv.double!==!!t.double))n.linkType='custom'}
    setPath(n,bind,v);
    if(['fromIf','toIf'].includes(bind)&&n.kind==='edge'){}
  }})}
function onInput(e){const t=e.target;if(t.dataset.live&&t.dataset.bind==='labels.0.text'||t.dataset.live&&t.dataset.bind==='L.text'){const n=t.dataset.bind==='L.text'?find(S.activeLabel?.owner):picked()[0];const l=t.dataset.bind==='L.text'?n?.labels.find(x=>x.id===S.activeLabel.id):n?.labels?.[0];if(l&&!isLocked(n)){if(!t._remembered){remember();t._remembered=true}l.text=t.value;S.dirty=true;render('scene');render('overlay')}}

function onChange(e){

  if(t.dataset.page){const k=t.dataset.page;let val=t.type==='checkbox'?t.checked:t.type==='number'?+t.value:t.value;if(k==='margin'&&(val<0||val>60))return notify('Margin must be 0–60 mm.');if((k==='customW'||k==='customH')&&(val<50||val>5000))return notify('Custom sizes must be 50–5000 mm.');if(k==='background'&&!val)val=null;mutate(()=>{pg()[k]=val;if(k==='isBackground'&&val)for(const p of S.doc.pages)if(p.background===pg().id&&p===pg())p.background=null});if(['paper','orientation','customW','customH'].includes(k))fit();return}
  if(t.dataset.doc){const k=t.dataset.doc,val=t.type==='checkbox'?t.checked:t.type==='number'?+t.value:t.value;mutate(()=>{if(k==='name')S.doc.name=val||'Untitled network';else setPath(S.doc,k,val)});return}

  if(t.dataset.portName){const n=picked()[0];if(n&&ensureEditable())mutate(()=>{const p=n.ports.find(q=>q.id===t.dataset.portName);p.name=t.value;for(const e2 of items())if(e2.kind==='edge'){if(e2.from?.node===n.id&&e2.from.port===p.id)e2.fromIf=genericPort(t.value)?e2.fromIf:t.value;if(e2.to?.node===n.id&&e2.to.port===p.id)e2.toIf=genericPort(t.value)?e2.toIf:t.value}});return}
  if(t.dataset.pref){S.prefs[t.dataset.pref]=t.checked;savePrefs();render();return}
  if(t.id==='alignRef'){S.alignRef=t.value;return}}
function onClick(e){
  const tab=e.target.closest('[data-tab]');if(tab){S.tab=tab.dataset.tab;lastKey='';update();return}
  const sg=e.target.closest('[data-seg]');if(sg){apply(sg.dataset.seg,sg.dataset.value);return}
  const th=e.target.closest('[data-theme-apply]');if(th){mutate(()=>Shapes.applyTheme(S.doc,th.dataset.themeApply));notify('Theme applied to every page — Undo restores the previous look.');return}

function renderPalette(){
  const q=($('search')?.value||'').toLowerCase().trim(),display=S.prefs.paletteDisplay||'symbol',DEFAULT_OPEN=new Set(['_recent','_lib','network','security','compute','cloud','endpoints','surveillance','sites','rack']),isOpen=id=>S.prefs.catOpen?.[id]??(DEFAULT_OPEN.has(id)||id.startsWith('pack:')&&!id.startsWith('pack:online')),total=Object.keys(Stencils.shapes).length+Object.keys(Shapes.basic).length+Object.keys(Shapes.rackItems).length+3;$('search').placeholder=`Search ${total} shapes — fw, nvr, ap…`;
  const match=i=>!q||(i.name+' '+i.type+' '+i.tags).toLowerCase().includes(q);
  const cell=i=>`<button class="stencil" draggable="true" data-symbol="${i.type}" title="${html(i.name)} — click or drag onto the page">${Shapes.iconSvg(i.type,{display:Shapes.kindOf(i.type)==='device'?display:'symbol',size:40})}<span>${html(i.name)}</span></button>`;
  let out='';const cats=Shapes.catalog();

  if(recent.length&&!q)out+=`<details class="cat" ${isOpen('_recent')?'open':''} data-cat="_recent"><summary>Recently used</summary><div class="palette">${recent.map(cell).join('')}</div></details>`;
  for(const c of cats){const list=c.items.filter(match).slice(0,q?400:2000);if(!list.length)continue;const open=q||isOpen(c.id);out+=`<details class="cat${c.pack?' packCat':''}" data-cat="${c.id}" ${open?'open':''}><summary>${html(c.name)} <em>${list.length}</em></summary><div class="palette">${open?list.map(cell).join(''):''}</div></details>`}
  const lib=S.library.filter(e=>!q||e.name.toLowerCase().includes(q));
  out+=`<details class="cat" data-cat="_lib" open><summary>My library <em>${S.library.length}</em></summary>${lib.map(e=>`<div class="portrow"><button class="libItem" draggable="true" data-library="${e.id}">${html(e.name)}</button><button data-library-delete="${e.id}" title="Remove">×</button></div>`).join('')||'<p class="muted">Select shapes and use Insert ▸ Save to library. Imported images and custom groups can be reused here.</p>'}<div class="row">${'<button data-action="importLibrary">Import…</button><button data-action="exportLibrary">Export</button>'}</div></details>`;

  const m=$('contextMenu');m.innerHTML=h;showMenu(m,e.clientX,e.clientY);
  m.onclick=ev=>{const c=ev.target.closest('[data-ctx]')?.dataset.ctx;if(!c)return;hideMenus();const p=S.menuPoint;
    if(c==='edit'){const o=picked()[0];if(o.kind==='edge')editEdgeLabel(o);else onDoubleClick(ev,C.center(o),null,o)}
    else if(c==='zoneHere')insertAnnotation('zone',...p);else if(c==='textHere')insertAnnotation('text',...p);else if(c==='rackHere')addNode('rack',...p);
    else if(c.startsWith('lt:')){if(ensureEditable())mutate(()=>editable().filter(x=>x.kind==='edge').forEach(x=>Shapes.applyLinkType(x,c.slice(3))))}
    else if(c.startsWith('rt:')){if(ensureEditable())mutate(()=>editable().filter(x=>x.kind==='edge').forEach(x=>{x.routing=c.slice(3);x.curve='straight';Conn.orthogonalize(x);Conn.markDirty(x.id)}))}
    else if(c.startsWith('disp:')){if(ensureEditable())mutate(()=>editable().filter(x=>x.kind==='node'&&Shapes.isDevice(x)).forEach(x=>x.display=c.slice(5)))}
    else if(c.startsWith('st:')){if(ensureEditable())mutate(()=>editable().filter(x=>x.kind==='node').forEach(x=>{x.data??={};if(c.slice(3))x.data.status=c.slice(3);else delete x.data.status}))}
    else if(c.startsWith('ly:'))setLayer(c.slice(3));
    else if(c==='connected'){const o=picked()[0],ids=new Set([o.id]);for(const e2 of items())if(e2.kind==='edge'&&(e2.from?.node===o.id||e2.to?.node===o.id)){ids.add(e2.id);if(e2.from)ids.add(e2.from.node);if(e2.to)ids.add(e2.to.node)}select([...ids])}
    else if(c==='callout')actions.callout();else if(c==='link')followLink(picked()[0].url)}}
function tabMenu(e,i){e.preventDefault();gotoPage(i);const p=pg(),m=$('contextMenu');m.innerHTML=`<button data-tm="rename">Rename…</button><button data-action="duplicatePage">Duplicate</button><button data-action="deletePage">Delete</button><hr><button data-action="pageLeft">Move left</button><button data-action="pageRight">Move right</button><hr><button data-tm="bg">${p.isBackground?'Make foreground page':'Make background page'}</button>${!p.isBackground&&S.doc.pages.some(x=>x.isBackground)?`<div class="sub"><button>Background ▸</button><div class="submenu"><button data-tm="bg:">(none)</button>${S.doc.pages.filter(x=>x.isBackground).map(b=>`<button data-tm="bg:${b.id}">${html(b.name)}</button>`).join('')}</div></div>`:''}`;showMenu(m,e.clientX,e.clientY-120);
  m.onclick=ev=>{const t=ev.target.closest('[data-tm]')?.dataset.tm;if(!t)return;hideMenus();if(t==='rename')renamePage();else if(t==='bg')mutate(()=>{p.isBackground=!p.isBackground;if(p.isBackground){p.background=null;for(const q of S.doc.pages)if(q.background===p.id&&q===p)q.background=null}else for(const q of S.doc.pages)if(q.background===p.id)q.background=null});else if(t.startsWith('bg:'))mutate(()=>p.background=t.slice(3)||null)}}
function renamePage(){const v=prompt('Page name',pg().name);if(v?.trim())mutate(()=>pg().name=v.trim())}

// ---------- theme & layout prefs ----------
function applyUiTheme(){const t=S.prefs.theme,dark=t==='dark'||t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=dark?'dark':'light';render()}
function applyLayoutPrefs(){document.body.classList.toggle('noLeft',!S.prefs.leftOpen);document.body.classList.toggle('noRight',!S.prefs.rightOpen);setTimeout(()=>render(),20)}
function presentStep(dir){const fg=S.doc.pages.map((p,i)=>[p,i]).filter(([p])=>!p.isBackground).map(x=>x[1]),k=fg.indexOf(S.pageIndex),next=fg[Math.max(0,Math.min(fg.length-1,k+dir))];if(next!==undefined&&next!==S.pageIndex)gotoPage(next)}

<script>
// Browser workspace (drawings kept in IndexedDB), shape-pack manager, shape import and the online Icons tab.
const Workspace=(()=>{
  let lastThumb=0,saving=null;
  const enabled=()=>Store.ok&&S.prefs.workspace!==false;
  function newId(){return C.uid()}
  // Called from the autosave timer: keeps the current drawing in IndexedDB as well as the quick localStorage copy.
  async function saveCurrent(force=false){if(!enabled()||!S.doc)return;S.docId??=newId();const doc=Packs.embedUsed(S.doc),docId=S.docId;
    const now=Date.now();let thumb=null;if(force||now-lastThumb>15000){try{const p=doc.pages.find(x=>!x.isBackground)||doc.pages[0];thumb=new XMLSerializer().serializeToString(thumbnail(doc,p,320,200));lastThumb=now}catch{}}
    const json=JSON.parse(JSON.stringify(doc)),prev=thumb?null:await Store.get('drawings',docId).catch(()=>null);
    const rec={id:docId,name:json.name,modified:new Date().toISOString(),pages:json.pages.filter(p=>!p.isBackground).length,objects:json.pages.reduce((s,p)=>s+p.items.length,0),doc:json,thumb:thumb||prev?.thumb||null};
    saving=Store.put('drawings',rec).then(()=>docId===S.docId&&Store.kvSet('lastDoc',docId)).then(()=>setSaveState(S.fileHandle?'Saved in this browser · file not yet updated':'Saved in this browser')).catch(err=>setSaveState('Browser storage full or blocked — save a file ('+err.message+')'));return saving}
  async function restoreLast(){if(!enabled())return null;try{const id=await Store.kvGet('lastDoc');if(!id)return null;const rec=await Store.get('drawings',id);if(!rec)return null;return{id,doc:C.migrate(rec.doc)}}catch(err){console.warn('workspace restore failed',err);return null}}
  async function open(id){const rec=await Store.get('drawings',id);if(!rec)return notify('That drawing is no longer in this browser.');await flush();loadDocument(C.migrate(rec.doc),{name:rec.name,id});notify('Opened “'+rec.name+'” from this browser.',2200)}
  async function flush(){clearTimeout(autosaveTimer);if(S.dirty||!S.docId)await saveCurrent(true);else await saving}
  const fmtDate=s=>{const d=new Date(s);return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})};
  const kb=n=>n>1e6?(n/1e6).toFixed(1)+' MB':Math.round(n/1e3)+' KB';
  async function openDrawings(){
    if(!Store.ok)return notify('This browser has no IndexedDB storage. Use File ▸ Save to keep drawings.');
    await saveCurrent(true);const recs=(await Store.all('drawings')).sort((a,b)=>b.modified.localeCompare(a.modified)),est=await Store.estimate(),pers=await Store.persisted();
    const d=openDialog('My drawings in this browser',`<p class="muted">Drawings auto-save here as you work — on GitHub Pages too. They stay in <b>this browser</b> on this device only; use File ▸ Save or “Back up all” to keep a portable copy.</p>
      <div class="wsBar"><label class="check"><input type="checkbox" id="wsAuto" ${enabled()?'checked':''}>Auto-save drawings in this browser</label><span class="muted">${est?`${kb(est.usage||0)} used of ${kb(est.quota||0)}`:''}</span><span class="spacer"></span><button id="wsPersist" ${pers?'disabled':''} title="Ask the browser not to evict this site's storage when space runs low">${pers?'✓ Storage is persistent':'Make storage persistent'}</button></div>
      <div class="tplGrid wsGrid">${recs.map(r=>`<div class="tpl ws ${r.id===S.docId?'current':''}" data-ws="${r.id}"><div class="thumb">${r.thumb&&Packs.isSafeMarkup(r.thumb)?`<img alt="" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(r.thumb)}">`:''}</div><b>${html(r.name)}</b><span>${fmtDate(r.modified)} · ${r.pages} page${r.pages===1?'':'s'} · ${r.objects} objects${r.id===S.docId?' · <em>open now</em>':''}</span><div class="row r3"><button data-ws-open="${r.id}">Open</button><button data-ws-dup="${r.id}">Duplicate</button><button data-ws-dl="${r.id}">Download</button></div><button class="wsDel" data-ws-del="${r.id}" title="Delete from this browser">×</button></div>`).join('')||'<p class="muted pad">Nothing stored yet.</p>'}</div>
      <footer><button data-ws-import>Restore backup…</button><button data-ws-backup>Back up all (${recs.length})</button><span class="spacer"></span><button data-ws-new>New blank drawing</button><button class="primary" data-ws-tpl>New from template…</button></footer>`,{wide:true});
    d.onchange=e=>{if(e.target.id==='wsAuto'){S.prefs.workspace=e.target.checked;savePrefs();notify(e.target.checked?'Drawings will auto-save in this browser.':'Browser auto-save is off — only the quick recovery copy is kept.')}};
    d.onclick=async e=>{const t=e.target;if(t.closest('[data-close]'))return closeDialog();
      if(t.id==='wsPersist'){const ok=await Store.persist();notify(ok?'Storage is now persistent for this site.':'The browser declined (it may grant this after you use the site more, or if you bookmark/install it).');closeDialog();openDrawings();return}
      const o=t.closest('[data-ws-open]');if(o){closeDialog();open(o.dataset.wsOpen);return}
      const dup=t.closest('[data-ws-dup]');if(dup){const r=await Store.get('drawings',dup.dataset.wsDup);r.id=newId();r.name=r.doc.name=r.name+' (copy)';r.modified=new Date().toISOString();await Store.put('drawings',r);closeDialog();openDrawings();return}
      const dl=t.closest('[data-ws-dl]');if(dl){const r=await Store.get('drawings',dl.dataset.wsDl);download(safeName(r.name)+'.json',JSON.stringify(r.doc,null,1),'application/json');return}
      const del=t.closest('[data-ws-del]');if(del){const r=await Store.get('drawings',del.dataset.wsDel);if(!confirm(`Delete “${r?.name}” from this browser? This cannot be undone (download it first if you need it).`))return;await Store.del('drawings',del.dataset.wsDel);if(del.dataset.wsDel===S.docId)S.docId=newId();closeDialog();openDrawings();return}
      if(t.closest('[data-ws-backup]')){const all=await Store.all('drawings');download('port-drawings-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({portBackup:1,drawings:all.map(r=>({name:r.name,modified:r.modified,doc:r.doc})),packs:(await Store.all('packs'))}),'application/json');return}
      if(t.closest('[data-ws-import]')){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async()=>{try{const b=JSON.parse(await inp.files[0].text());if(!b.portBackup)throw Error('Not a Port backup file.');let n=0;for(const r of b.drawings||[]){const doc=C.migrate(r.doc);await Store.put('drawings',{id:newId(),name:r.name||doc.name,modified:r.modified||new Date().toISOString(),pages:doc.pages.length,objects:doc.pages.reduce((s,p)=>s+p.items.length,0),doc,thumb:null});n++}for(const p of b.packs||[])if(Object.values(p.shapes||{}).every(s=>Packs.isSafeMarkup(s.svg)))await Packs.save(p);notify(`Restored ${n} drawing(s) and ${(b.packs||[]).length} shape pack(s).`);closeDialog();openDrawings();renderPalette()}catch(err){notify(err.message)}};inp.click();return}
      if(t.closest('[data-ws-new]')){closeDialog();await flush();loadDocument(C.newDoc());return}
      if(t.closest('[data-ws-tpl]')){closeDialog();openTemplates()}}}

  // ---------- shape packs ----------
  async function importShapes(files,packName){
    if(!files?.length)return;const guess=packName||(files.length===1?files[0].name.replace(/\.[^.]+$/,''):(files[0].webkitRelativePath?.split('/')[0]||'My shapes'));
    const name=prompt('Name for this shape pack',guess);if(name===null)return;notify('Importing shapes…',2000);
    try{const{pack,skipped}=await Packs.importAny(files,name.trim()||guess);const n=Object.keys(pack.shapes).length;if(!n)throw Error('No usable shapes found'+(skipped?` (${skipped} skipped)`:'')+'.');pack.name=name.trim()||guess;await Packs.save(pack);
      S.prefs.catOpen??={};for(const c of pack.categories)S.prefs.catOpen[c.id]=true;savePrefs();S.ltab='shapes';renderLeft();notify(`Imported ${n} shape(s) into “${pack.name}”${skipped?` · ${skipped} skipped`:''}. They are saved in this browser and travel inside drawings that use them.`,6000)}
    catch(err){notify('Import failed: '+err.message,6000)}}
  function openPacks(){const list=Packs.list();const d=openDialog('Shape packs',`<p class="muted">Packs add shapes to the Shapes panel. Imported packs are stored in this browser; drawings carry copies of the pack shapes they use, so colleagues see them even without the pack.</p>
    <div class="list">${list.map(p=>`<div class="packRow"><div><b>${html(p.name)}</b><span class="muted">${Object.keys(p.shapes||{}).length} shapes · ${p.builtIn?'bundled':p.source==='iconify'?'online picks':'imported'}${p.licenses?' · '+Object.values(p.licenses).map(l=>html(l.name+' ('+l.spdx+')')).join(', '):''}</span></div><span class="spacer"></span>${p.builtIn?'':`<button data-pk-rename="${p.id}">Rename</button><button data-pk-export="${p.id}">Export</button><button data-pk-del="${p.id}">Remove</button>`}</div>`).join('')||'<p class="muted">No packs yet.</p>'}</div>
    <h3 class="h3">Import</h3><p class="muted">Bring your own icon sets — e.g. vendor network/cloud icon ZIPs (Cisco, AWS, Azure, GCP, Fortinet, Hikvision…), SVG folders, draw.io libraries (.xml), PNG/JPG images or exported .portpack.json files. SVGs are cleaned of scripts and external references; single-colour icons become recolourable.</p>
    <footer><button data-pk-folder>Import folder…</button><button data-pk-files class="primary">Import files / ZIP…</button></footer>`,{wide:false});
    d.onclick=async e=>{const t=e.target;if(t.closest('[data-close]'))return closeDialog();
      if(t.closest('[data-pk-files]')){closeDialog();$('shapeInput').click();return}if(t.closest('[data-pk-folder]')){closeDialog();$('folderInput').click();return}
      const ex=t.closest('[data-pk-export]');if(ex){Packs.exportPack(ex.dataset.pkExport);return}
      const rn=t.closest('[data-pk-rename]');if(rn){const p=Packs.get(rn.dataset.pkRename),v=prompt('Pack name',p.name);if(!v?.trim())return;p.name=v.trim();if(p.categories?.length===1)p.categories[0].name=p.name;await Packs.save(p);closeDialog();openPacks();renderPalette();return}
      const del=t.closest('[data-pk-del]');if(del){const p=Packs.get(del.dataset.pkDel);if(!confirm(`Remove “${p.name}” from this browser? Shapes already placed in drawings stay.`))return;await Packs.remove(p.id);closeDialog();openPacks();renderPalette()}}}

  // ---------- online icons ----------
  let lastQuery='';
  async function searchIcons(){const q=$('iconSearch').value.trim(),set=$('iconSet').value,box=$('iconResults');if(!q){box.innerHTML=iconsIntro();return}lastQuery=q+'|'+set;box.innerHTML='<p class="muted pad">Searching…</p>';
    try{const r=await Packs.search(q,set,120);if(lastQuery!==q+'|'+set)return;const cols=r.collections||{};
      box.innerHTML=r.icons?.length?`<p class="muted">${r.total>r.icons.length?`${r.icons.length} of ${r.total}`:r.icons.length} results · click or drag onto the page</p><div class="palette iconGridOnline">${r.icons.map(full=>{const p=full.split(':')[0],c=cols[p];return`<button class="stencil online" draggable="true" data-iconify="${html(full)}" title="${html(full)} — ${html(c?.name||p)} (${html(c?.license?.spdx||'')})"><img loading="lazy" alt="" src="${Packs.thumbUrl(full,document.documentElement.dataset.theme==='dark'?'#8fb3ff':'#2f5ea8')}"><span>${html(full.split(':')[1].replace(/-/g,' '))}</span></button>`}).join('')}</div>`:'<p class="muted pad">No icons found. Try a simpler word, or “All sets”.</p>'}
    catch(err){box.innerHTML=`<p class="muted pad">Online search is unavailable (${html(err.message)}). You are probably offline — bundled and imported shapes still work.</p>`}}
  const iconsIntro=()=>`<div class="muted pad"><p><b>200,000+ open-source icons</b> from ${['Carbon','Material Design','Tabler','Fluent','Phosphor','Lucide','SVG Logos','Simple Icons'].join(', ')} and more, via the Iconify project.</p><p>Search, then click or drag an icon onto the page. Picked icons are saved to the “Online picks” pack in this browser and embedded in drawings that use them, so they keep working offline.</p><p>Try: <a href="#" data-try="router">router</a>, <a href="#" data-try="cctv">cctv</a>, <a href="#" data-try="firewall">firewall</a>, <a href="#" data-try="kubernetes">kubernetes</a>, <a href="#" data-try="aws">aws</a>, <a href="#" data-try="fortinet">fortinet</a>, <a href="#" data-try="solar">solar</a>.</p><p class="tiny">Search terms are sent to api.iconify.design. Logos are trademarks of their owners.</p></div>`;
  async function pickOnline(full,at){try{notify('Adding icon…',1200);const id=await Packs.addOnline(full);addNode(id,...(at||centerOfView()),{split:!!at});bumpRecent(id)}catch(err){notify('Could not add icon: '+err.message)}}
  function wireIcons(){const inp=$('iconSearch');let t=null;inp.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(searchIcons,350)});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(t);searchIcons()}});$('iconSet').addEventListener('change',searchIcons);
    const box=$('iconResults');box.innerHTML=iconsIntro();box.addEventListener('click',e=>{const a=e.target.closest('[data-try]');if(a){e.preventDefault();inp.value=a.dataset.try;searchIcons();return}const b=e.target.closest('[data-iconify]');if(b)pickOnline(b.dataset.iconify)});
    box.addEventListener('dragstart',e=>{const b=e.target.closest('[data-iconify]');if(b)e.dataTransfer.setData('application/x-port-iconify',b.dataset.iconify)})}
  return{saveCurrent,restoreLast,open,flush,openDrawings,openPacks,importShapes,searchIcons,pickOnline,wireIcons,newId};
})();

</script>
<script>
// Event wiring and start-up.
function insertLibrary(id,x,y){const entry=S.library.find(e=>e.id===id);if(!entry)return;mutate(()=>{const a=C.duplicate(entry.items,0,0),b=C.bounds(a);a.forEach(n=>{n.locked=false;n.layer=S.activeLayer;C.move(n,grid(x-b.w/2)-b.x,grid(y-b.h/2)-b.y)});items().push(...a);a.forEach(e=>e.kind==='edge'&&Conn.markDirty(e.id));select(a.map(n=>n.id))})}
function wire(){
  document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon,17));
  const cv=$('canvas');
  cv.addEventListener('pointerdown',beginPointer);cv.addEventListener('pointermove',pointerMove);cv.addEventListener('pointerup',pointerUp);cv.addEventListener('pointercancel',()=>{S.drag=null;S.guideLines=[];render()});
  cv.addEventListener('pointerleave',()=>{if(!S.drag&&S.hoverId){S.hoverId=null;render('overlay')}S.cursor=null;renderRulers()});
  cv.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey||S.prefs.wheelZoom&&!e.shiftKey){const f=Math.exp(-e.deltaY*(e.ctrlKey&&!e.metaKey&&Math.abs(e.deltaY)<40?.012:.0022));zoomAt(f,point(e))}else{const dx=e.shiftKey&&!e.deltaX?e.deltaY:e.deltaX,dy=e.shiftKey&&!e.deltaX?0:e.deltaY;S.view.x+=dx/S.view.zoom;S.view.y+=dy/S.view.zoom;render('overlay')}},{passive:false});
  cv.addEventListener('contextmenu',canvasMenu);
  // global clicks: actions, modes, palette, tabs
  document.addEventListener('click',e=>{
    const t=e.target;
    const a=t.closest('[data-action]');if(a&&!a.disabled){hideMenus();actions[a.dataset.action]?.();return}
    const m=t.closest('[data-mode]');if(m){setMode(m.dataset.mode);return}
    if(t.closest('[data-file-menu]')){const fm=$('fileMenu');if(!fm.hidden){hideMenus();return}openFileMenu(t.closest('[data-file-menu]'));return}
    const rt=t.closest('[data-rtab]');if(rt){S.ribbonTab=rt.dataset.rtab;renderRibbon();return}
    const lt=t.closest('[data-ltab]');if(lt){S.ltab=lt.dataset.ltab;renderLeft();return}
    const sym=t.closest('[data-symbol]');if(sym&&!S.justDragged){const c=centerOfView();addNode(sym.dataset.symbol,c[0]+(Math.random()-.5)*40,c[1]+(Math.random()-.5)*40);bumpRecent(sym.dataset.symbol);return}
    const lib=t.closest('[data-library]');if(lib){insertLibrary(lib.dataset.library,...centerOfView());return}
    const ld=t.closest('[data-library-delete]');if(ld){if(confirm('Remove this item from your library?')){S.library=S.library.filter(x=>x.id!==ld.dataset.libraryDelete);saveLibrary()}return}
    const pt=t.closest('[data-page]');if(pt){const i=+pt.dataset.page;if(i!==S.pageIndex)gotoPage(i);return}
    const ex=t.closest('[data-explore]');if(ex){const[pi,id]=ex.dataset.explore.split(':');if(+pi!==S.pageIndex){S.pageIndex=+pi;clearTransient();fit()}select([id]);const n=find(id);if(n)Ins.ensureVisible(n);return}
    const th=t.closest('[data-theme-apply]');if(th&&!t.closest('#inspector')){mutate(()=>Shapes.applyTheme(S.doc,th.dataset.themeApply));renderRibbon();notify('Theme applied — Undo restores the previous look.');return}
    if(!t.closest('.menu'))hideMenus()});
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('.menu')&&!e.target.closest('[data-file-menu]'))hideMenus()});
  // inspector
  const ins=$('inspector');ins.addEventListener('change',Ins.onChange);ins.addEventListener('input',Ins.onInput);ins.addEventListener('click',Ins.onClick);$('inspectorTabs').addEventListener('click',Ins.onClick);
  ins.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.target.blur();e.target.focus()}});
  // ribbon controls
  $('ribbon').addEventListener('change',e=>{const t=e.target,id=t.id,sel=editable();
    if(id==='linkTypeSel'){S.linkType=t.value;const es=sel.filter(n=>n.kind==='edge');if(es.length)mutate(()=>es.forEach(x=>Shapes.applyLinkType(x,t.value)));renderRibbon();return}
    if(id==='routeSel'){S.routeStyle=t.value;const es=sel.filter(n=>n.kind==='edge');if(es.length&&t.value!=='curved')mutate(()=>es.forEach(x=>{x.routing=t.value;x.curve='straight';Conn.orthogonalize(x);Conn.markDirty(x.id)}));return}
    if(id==='fontSizeSel'&&t.value){const ls=S.activeLabel?[find(S.activeLabel.owner)?.labels.find(l=>l.id===S.activeLabel.id)]:sel.flatMap(n=>n.labels||[]);if(ls.length)mutate(()=>ls.forEach(l=>l&&(l.size=+t.value)));t.value='';return}
    if(id==='fontColor'){const ls=S.activeLabel?[find(S.activeLabel.owner)?.labels.find(l=>l.id===S.activeLabel.id)]:sel.flatMap(n=>n.labels||[]);if(ls.length)mutate(()=>ls.forEach(l=>l&&(l.color=t.value)));return}
    if(id==='displaySel'&&t.value){S.prefs.newDisplay=t.value;savePrefs();const ns=sel.filter(n=>n.kind==='node'&&Shapes.kindOf(n.type)==='device');if(ns.length)mutate(()=>ns.forEach(n=>n.display=t.value));else notify('New devices will use the '+t.value+' style.');t.value='';return}

  $('docName').addEventListener('change',e=>{const v=e.target.value.trim()||'Untitled network';mutate(()=>S.doc.name=v);document.title=v+' · Port Network Studio'});
  $('docName').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur()});
  // left panel
  $('search').addEventListener('input',renderPalette);$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){const first=$('palette').querySelector('[data-symbol]');if(first)first.click()}if(e.key==='Escape'){e.target.value='';renderPalette()}});

  $('explorerSearch').addEventListener('input',renderExplorer);
  $('palette').addEventListener('dragstart',e=>{const s=e.target.closest('[data-symbol]'),l=e.target.closest('[data-library]');if(s){e.dataTransfer.setData('application/x-port-symbol',s.dataset.symbol);e.dataTransfer.effectAllowed='copy'}if(l)e.dataTransfer.setData('application/x-port-library',l.dataset.library)});
  cv.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy'});
  cv.addEventListener('drop',e=>{e.preventDefault();const p=point(e),type=e.dataTransfer.getData('application/x-port-symbol'),lib=e.dataTransfer.getData('application/x-port-library'),ico=e.dataTransfer.getData('application/x-port-iconify');if(ico){Workspace.pickOnline(ico,p);return}if(type){addNode(type,p[0],p[1],{split:true});bumpRecent(type);S.justDragged=true;setTimeout(()=>S.justDragged=false,50);return}if(lib){insertLibrary(lib,...p);return}const f=e.dataTransfer.files?.[0];if(f)handleFile(f,null,p)});
  // layers pane
  const lp=$('layersPane');
  lp.addEventListener('click',e=>{const t=e.target;const act=t.closest('[data-layer-active]');if(act){S.activeLayer=act.dataset.layerActive;renderLayers();renderChrome();return}
    const tg=t.closest('[data-layer-toggle]');if(tg){const L=S.doc.layers.find(l=>l.id===tg.dataset.id),k=tg.dataset.layerToggle;mutate(()=>L[k]=k==='locked'?!L[k]:L[k]===false);renderLayers();return}
    const sl=t.closest('[data-layer-select]');if(sl){select(items().filter(n=>layerOf(n)?.id===sl.dataset.layerSelect).map(n=>n.id));return}
    const dl=t.closest('[data-layer-delete]');if(dl){if(S.doc.layers.length===1)return notify('Keep at least one layer.');const id=dl.dataset.layerDelete,n=S.doc.pages.flatMap(p=>p.items).filter(i=>i.layer===id).length;if(n&&!confirm(`Delete this layer? Its ${n} shape(s) move to “${S.doc.layers.find(l=>l.id!==id).name}”.`))return;mutate(()=>{S.doc.layers=S.doc.layers.filter(l=>l.id!==id);for(const p of S.doc.pages)for(const i of p.items)if(i.layer===id)i.layer=S.doc.layers[0].id;if(S.activeLayer===id)S.activeLayer=S.doc.layers[0].id});renderLayers();return}
    if(t.closest('[data-action-layer-add]')){const name=$('newLayer').value.trim()||'Layer '+(S.doc.layers.length+1);mutate(()=>{const l={id:C.uid(),name,visible:true,locked:false,print:true};S.doc.layers.push(l);S.activeLayer=l.id});renderLayers();return}
    if(t.closest('[data-layer-assign]')){setLayer(S.activeLayer);renderLayers();return}
    if(t.closest('[data-layer-preset]')){mutate(()=>{for(const name of['Physical','Logical (L3)','Management','Power','Security systems','Annotations'])if(!S.doc.layers.some(l=>l.name===name))S.doc.layers.push({id:C.uid(),name,visible:true,locked:false,print:true})});renderLayers();return}
    if(t.closest('[data-layer-solo]')){mutate(()=>S.doc.layers.forEach(l=>l.visible=true));renderLayers()}});
  lp.addEventListener('change',e=>{const id=e.target.dataset.layerName;if(id){const L=S.doc.layers.find(l=>l.id===id);mutate(()=>L.name=e.target.value||L.name);renderLayers()}});
  // page tabs
  const tabs=$('pageTabs');
  tabs.addEventListener('dblclick',e=>{if(e.target.closest('[data-page]'))renamePage()});
  tabs.addEventListener('contextmenu',e=>{const b=e.target.closest('[data-page]');if(b)tabMenu(e,+b.dataset.page)});
  tabs.addEventListener('dragstart',e=>{const b=e.target.closest('[data-page]');if(b)e.dataTransfer.setData('application/x-port-page',b.dataset.page)});
  tabs.addEventListener('dragover',e=>{const b=e.target.closest('[data-page]');if(b&&e.dataTransfer.types.includes('application/x-port-page')){e.preventDefault();tabs.querySelectorAll('.dragOver').forEach(x=>x.classList.remove('dragOver'));b.classList.add('dragOver')}});
  tabs.addEventListener('drop',e=>{const b=e.target.closest('[data-page]');const from=+e.dataTransfer.getData('application/x-port-page');if(!b||Number.isNaN(from))return;e.preventDefault();const to=+b.dataset.page;if(from===to)return;mutate(()=>{const[p]=S.doc.pages.splice(from,1);S.doc.pages.splice(to,0,p);S.pageIndex=to})});
  // status bar
  $('zoomRange').addEventListener('input',e=>setZoom(2**(+e.target.value/100)));
  $('layerSel').addEventListener('change',e=>{S.activeLayer=e.target.value;if(S.ltab==='layers')renderLayers();notify('New shapes go on layer “'+S.doc.layers.find(l=>l.id===S.activeLayer)?.name+'”.',1800)});
  // minimap
  const mm=$('minimap');let mmDrag=false;const mmMove=e=>{const svg=$('miniSvg'),vb=JSON.parse(svg.dataset.vb||'[0,0,1,1]'),r=svg.getBoundingClientRect(),k=Math.max(vb[2]/r.width,vb[3]/r.height),ox=(r.width-vb[2]/k)/2,oy=(r.height-vb[3]/k)/2,x=vb[0]+(e.clientX-r.left-ox)*k,y=vb[1]+(e.clientY-r.top-oy)*k,c=$('canvas');S.view.x=x-c.clientWidth/2/S.view.zoom;S.view.y=y-c.clientHeight/2/S.view.zoom;render('overlay')};
  mm.addEventListener('pointerdown',e=>{mmDrag=true;mm.setPointerCapture(e.pointerId);mmMove(e)});mm.addEventListener('pointermove',e=>{if(mmDrag)mmMove(e)});mm.addEventListener('pointerup',()=>mmDrag=false);
  // keyboard & clipboard
  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('dialog[open]')&&!document.querySelector('dialog[open]').matches(':modal')){closeDialog();S.highlights.clear();render('overlay');return}onKey(e)});
  window.addEventListener('keyup',e=>{if(e.code==='Space'){S.space=false;$('canvas').style.cursor=S.mode==='pan'?'grab':S.mode==='select'?'default':'crosshair'}});
  window.addEventListener('blur',()=>S.space=false);
  const editingText=()=>['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable;
  document.addEventListener('copy',e=>{if(editingText())return;const j=copySelection();if(j){e.clipboardData.setData('text/plain',j);e.preventDefault();notify('Copied '+S.clipboard.length+' item(s).',1200)}});
  document.addEventListener('cut',e=>{if(editingText())return;const j=copySelection();if(j){e.clipboardData.setData('text/plain',j);e.preventDefault();erase()}});
  document.addEventListener('paste',e=>{if(editingText())return;const dt=e.clipboardData;if(!dt)return;const img=[...dt.items].find(i=>i.type.startsWith('image/'));if(img){e.preventDefault();importImage(img.getAsFile(),S.cursor);return}const txt=dt.getData('text/plain');if(txt){try{const d=JSON.parse(txt);if(d.portClipboard){e.preventDefault();pasteItems(d.items);return}if(d.version&&d.pages){e.preventDefault();loadDocument(C.migrate(d));return}}catch{}if(/^(name|hostname|device)[,;\t]/i.test(txt.trim())){e.preventDefault();openImportDialog({devices:txt});return}if(/Device[ -]ID|System Name:/i.test(txt)){e.preventDefault();openImportDialog({tab:'cdp'});setTimeout(()=>{$('cdpText').value=txt},50);return}e.preventDefault();const at=S.cursor||centerOfView();const t=mutate(()=>{const n=C.text(txt.slice(0,2000),grid(at[0]),grid(at[1]),300,60,13);n.labels[0].wrapWidth=280;n.layer=S.activeLayer;items().push(n);select([n.id]);return n});return}if(S.clipboard.length){e.preventDefault();pasteItems(S.clipboard)}});
  // files
  $('fileInput').addEventListener('change',async e=>{const f=e.target.files[0];if(f)await handleFile(f);e.target.value=''});
  $('imageInput').addEventListener('change',e=>{const f=e.target.files[0];if(f)importImage(f);e.target.value=''});
  $('shapeInput').addEventListener('change',async e=>{const f=[...e.target.files];e.target.value='';await Workspace.importShapes(f)});
  $('folderInput').addEventListener('change',async e=>{const f=[...e.target.files];e.target.value='';await Workspace.importShapes(f)});
  Workspace.wireIcons();
  $('libraryInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{importLibraryData(JSON.parse(await f.text()))}catch(err){notify(err.message)}e.target.value=''});
  document.body.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('Files'))e.preventDefault()});
  document.body.addEventListener('drop',e=>{if(e.target.closest('#canvas'))return;const f=e.dataTransfer.files?.[0];if(f){e.preventDefault();handleFile(f)}});
  // window
  new ResizeObserver(()=>render()).observe($('workarea'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.prefs.theme==='auto')applyUiTheme()});
  window.addEventListener('beforeunload',e=>{clearTimeout(autosaveTimer);if(S.dirty)autosave()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.dirty)Workspace.saveCurrent(true)});
  document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('presenting')){document.body.classList.remove('presenting');setTimeout(fit,60)}});
}
async function boot(){
  try{Object.assign(S.prefs,JSON.parse(localStorage.getItem('port-v3-prefs')||'{}'))}catch{}
  try{const lib=JSON.parse(localStorage.getItem('port-v3-library')||'[]');if(Array.isArray(lib))S.library=lib}catch{}
  $('paletteDisplay').value=S.prefs.paletteDisplay||'symbol';
  applyUiTheme();applyLayoutPrefs();wire();
  await Packs.loadAll();
  try{const lib=await Store.kvGet('library');if(Array.isArray(lib)&&!S.library.length)S.library=lib}catch{}
  let doc=null,recovered=false;const ws=await Workspace.restoreLast();
  if(ws){doc=ws.doc;S.docId=ws.id;recovered=true}
  else try{const saved=localStorage.getItem('port-v3-recovery')||localStorage.getItem('port-v2-recovery');if(saved){doc=C.migrate(JSON.parse(saved));recovered=true}}catch(err){console.warn('recovery skipped',err)}
  if(!doc)doc=Templates.build('campus');S.docId??=Workspace.newId();Packs.installDoc(doc);
  S.doc=doc;S.pageIndex=Math.max(0,doc.pages.findIndex(p=>!p.isBackground));S.activeLayer=doc.layers[0].id;
  renderRibbon();renderLeft();setMode('select');document.title=S.doc.name+' · Port Network Studio';
  requestAnimationFrame(()=>{fit();if(recovered)setSaveState('Restored from this browser · File ▸ My drawings');else{setSaveState('Example drawing — File ▸ New for templates');S.dirty=false}});
  if(location.hash.startsWith('#doc='))await loadFromHash();
  else if(!recovered)setTimeout(()=>notify('Welcome! This is an example campus network. Try dragging devices, Analyze ▸ Check diagram, or File ▸ New from template.',7000),600);
  // make the router/layout modules optional: degrade gracefully when missing
  if(typeof Router==='undefined')console.warn('Router module missing — falling back to simple elbows.');
}
boot();

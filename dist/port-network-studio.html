<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Port Network Studio (offline)</title>
<meta name="description" content="Browser-based, offline network diagram studio: Visio-style editing, network stencils, shape data, auto-routing, IP/VLAN planning, CCTV & PoE analysis, Visio and draw.io export.">
<meta name="theme-color" content="#376be5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23376be5'/%3E%3Cpath d='M9 10h6v5H9zM17 17h6v5h-6zM12 15v4.5h5' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Port Network Studio — app chrome. Light + dark via [data-theme] on <html>. */
:root{--blue:#376be5;--blue-soft:#ebf1ff;--blue-line:#9ab8f1;--bg:#e9edf3;--panel:#ffffff;--panel2:#f6f8fb;--border:#dfe6ef;--text:#33445b;--strong:#1f2f47;--muted:#7c8da4;--hover:#f0f5ff;--input:#ffffff;--ruler:#f6f8fb;--ruler-tick:#9aabc1;--pasteboard:#e3e8ef;--shadow:0 6px 28px #10203a26;--danger:#dc2626;--warn:#d97706;--ok:#16a34a;--font:'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif;color-scheme:light}
:root[data-theme=dark]{--blue:#5b8cff;--blue-soft:#1b2a4a;--blue-line:#3b5b9a;--bg:#0d121b;--panel:#141b27;--panel2:#18202e;--border:#253043;--text:#ccd6e4;--strong:#eef3fa;--muted:#8392a8;--hover:#1c2738;--input:#0f1520;--ruler:#121925;--ruler-tick:#4c5b72;--pasteboard:#0a0f17;--shadow:0 8px 30px #0008;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;font:13px/1.35 var(--font);color:var(--text);background:var(--bg);display:grid;grid-template-rows:52px 32px 78px 1fr 30px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--border);border-radius:6px;background:var(--panel);padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--hover);border-color:var(--blue-line)}
button.active{color:var(--blue);background:var(--blue-soft);border-color:var(--blue-line)}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{border:1px solid var(--border);border-radius:5px;padding:6px 7px;background:var(--input);min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-soft);border-color:var(--blue-line)}
input[type=color]{padding:2px;height:30px;width:36px;flex:none;cursor:pointer}
input[type=checkbox]{width:auto;margin:0}
input[type=range]{padding:0;border:0;background:none}
textarea{resize:vertical}
.mono,textarea.mono{font-family:'Cascadia Mono',Consolas,SFMono-Regular,Menlo,monospace;font-size:12px}
.muted{font-size:11.5px;line-height:1.55;color:var(--muted)}
.pad{padding:12px}
.spacer{flex:1}
kbd{font:11px var(--font);background:var(--panel2);border:1px solid var(--border);padding:1px 5px;border-radius:4px;color:var(--muted)}
code{font-size:11.5px;background:var(--panel2);padding:1px 4px;border-radius:3px}
[hidden]{display:none!important}
.ico{flex:none;display:block}

/* header */
header.top{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border)}
.brand{font-size:22px;font-weight:750;letter-spacing:-1px;color:var(--strong);display:flex;align-items:baseline;gap:2px;padding-right:12px}
.brand b{color:var(--blue)}.brand span{font-size:11px;letter-spacing:.4px;font-weight:600;color:var(--muted);margin-left:6px;text-transform:uppercase}
.doc{border-left:1px solid var(--border);padding-left:14px;min-width:160px}
.doc input{font-weight:650;border:0;padding:0;background:transparent;width:340px;color:var(--strong);font-size:14px}
.doc input:focus{outline:none;border-bottom:1px solid var(--blue)}
.doc .sub{font-size:11px;color:var(--muted);margin-top:1px}
.tbtn{display:flex;align-items:center;gap:6px;padding:6px 9px;border-color:transparent;background:transparent}
.tbtn:hover{border-color:var(--border)}
.tbtn.primary{background:var(--blue);color:#fff}
.tbtn .i{display:flex}

/* ribbon */
.ribbonTabs{display:flex;align-items:flex-end;gap:2px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--border)}
.ribbonTabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 12px 6px;font-weight:550;color:var(--muted)}
.ribbonTabs button.active{color:var(--blue);border-bottom-color:var(--blue);background:none}
.ribbonTabs .fileBtn{background:var(--blue);color:#fff;border-radius:6px 6px 0 0;margin-right:6px;border-bottom:0}
.ribbon{display:flex;align-items:stretch;gap:0;padding:4px 6px;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.rgroup{display:flex;flex-direction:column;padding:0 8px;border-right:1px solid var(--border);flex:none}
.rgroup:last-child{border-right:0}
.ritems{display:flex;align-items:center;gap:2px;flex:1;flex-wrap:wrap;max-height:56px;align-content:flex-start;max-width:520px}
.rname{font-size:10px;color:var(--muted);text-align:center;letter-spacing:.3px;padding-top:1px}
.rbtn{display:flex;align-items:center;gap:5px;border-color:transparent;background:transparent;padding:3px 6px;font-size:12px;height:26px}
.rbtn.big{flex-direction:column;justify-content:center;height:54px;padding:3px 7px;gap:3px;font-size:11.5px}
.rbtn:hover{border-color:var(--border)}
.rsel{display:flex;align-items:center;gap:5px;margin:0 2px}
.rsel select{width:auto;max-width:190px;padding:3px 5px;font-size:12px;height:26px}
.rsel .sw{width:16px;height:4px;border-radius:2px;flex:none}
.rcolor{position:relative;display:flex;align-items:center;justify-content:center;width:30px;height:26px;border:1px solid var(--border);border-radius:5px;cursor:pointer;margin:0 1px}
.rcolor input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.rcolor span{font-weight:700;pointer-events:none}
.themeRow{display:flex;gap:4px}
.themeSw{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px;border-color:transparent;background:none;font-size:10px}
.themeSw span{display:flex;gap:3px;align-items:center;justify-content:center;width:46px;height:30px;border:1px solid var(--border);border-radius:5px}
.themeSw i{width:12px;height:12px;border-radius:3px;display:block}
.themeSw em{font-style:normal;color:var(--muted);max-width:60px;overflow:hidden;text-overflow:ellipsis}

/* layout */
.layout{display:grid;grid-template-columns:250px minmax(200px,1fr) 300px;min-height:0}
body.noLeft .layout{grid-template-columns:0 minmax(200px,1fr) 300px}
body.noRight .layout{grid-template-columns:250px minmax(200px,1fr) 0}
body.noLeft.noRight .layout{grid-template-columns:0 1fr 0}
body.noLeft aside.left,body.noRight aside.right{display:none}
aside{background:var(--panel);overflow:auto;min-height:0;scrollbar-width:thin}
aside.left{border-right:1px solid var(--border);display:flex;flex-direction:column;grid-column:1}
aside.right{border-left:1px solid var(--border);grid-column:3}
.ltabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:2}
.ltabs button{flex:1;border:0;border-radius:0;background:none;border-bottom:2px solid transparent;padding:8px 4px;font-weight:550;color:var(--muted)}
.ltabs button.active{color:var(--blue);border-bottom-color:var(--blue)}
.pane{padding:8px 10px 20px;overflow:auto;flex:1}
.searchRow{display:flex;gap:5px;position:sticky;top:0;background:var(--panel);padding:2px 0 8px;z-index:1}
.searchRow select{width:78px;flex:none;font-size:12px}
details.cat{border-bottom:1px solid var(--border);padding:4px 0}
details.cat>summary{cursor:pointer;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:6px 2px;list-style:none;display:flex;align-items:center;gap:6px;user-select:none}
details.cat>summary::before{content:'▸';font-size:9px;transition:transform .15s}
details.cat[open]>summary::before{transform:rotate(90deg)}
details.cat>summary em{font-style:normal;font-weight:500;letter-spacing:0;margin-left:auto;opacity:.7}
.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:2px 0 6px}
.stencil{height:72px;font-size:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;background:var(--panel2);border-color:transparent;padding:4px 2px;line-height:1.15;white-space:normal;text-align:center;overflow:hidden}
.stencil svg{flex:none;overflow:visible}
.stencil span{max-height:24px;overflow:hidden}
.stencil:hover{border-color:var(--blue-line);background:var(--hover)}
.libItem{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis}
.workarea{position:relative;overflow:hidden;background:var(--pasteboard);min-width:0;grid-column:2;grid-row:1}
#canvas{position:absolute;left:20px;top:20px;width:calc(100% - 20px);height:calc(100% - 20px);display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ruler{position:absolute;z-index:3;background:var(--ruler)}
.ruler.x{left:20px;top:0;height:20px;width:calc(100% - 20px);border-bottom:1px solid var(--border)}
.ruler.y{left:0;top:20px;width:20px;height:calc(100% - 20px);border-right:1px solid var(--border)}
.rulerCorner{position:absolute;left:0;top:0;width:20px;height:20px;background:var(--ruler);border-right:1px solid var(--border);border-bottom:1px solid var(--border);z-index:4;cursor:pointer}
.workarea:has(.ruler[hidden]) #canvas{left:0;top:0;width:100%;height:100%}
.workarea:has(.ruler[hidden]) .rulerCorner{display:none}
#hint{position:absolute;top:28px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);pointer-events:none;background:color-mix(in srgb,var(--panel) 88%,transparent);padding:4px 12px;border-radius:20px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;z-index:2}
#toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);max-width:min(640px,88%);background:#1f3352;color:#fff;padding:11px 16px;border-radius:8px;z-index:20;font-size:12.5px;box-shadow:var(--shadow);line-height:1.5}
#inlineText{position:absolute;min-height:64px;z-index:25;box-shadow:var(--shadow);border:2px solid var(--blue);padding:8px;font-size:13px;background:var(--input)}
#minimap{position:absolute;right:12px;bottom:12px;width:190px;height:130px;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;z-index:5;cursor:crosshair}
#minimap svg{width:100%;height:100%;display:block}
.presentBar{display:none}

/* status bar & page tabs */
footer.status{display:flex;align-items:center;gap:12px;padding:0 10px 0 6px;background:var(--panel);border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);min-width:0}
footer.status>span{white-space:nowrap}
.pageTabs{display:flex;gap:2px;overflow-x:auto;max-width:55%;scrollbar-width:none;height:100%;align-items:stretch}
.pageTabs button{border:0;border-radius:0;border-top:2px solid transparent;background:none;font-size:12px;padding:3px 12px;color:var(--muted)}
.pageTabs button.active{background:var(--bg);color:var(--strong);border-top-color:var(--blue);font-weight:600}
.pageTabs .bgTab{font-style:italic}
.pageTabs .addTab{font-weight:700}
.pageTabs .dragOver{box-shadow:inset 2px 0 0 var(--blue)}
.layerPick{display:flex;align-items:center;gap:5px}
.layerPick select,.status select{padding:1px 4px;font-size:11.5px;width:auto;height:22px}
.zoom{display:flex;align-items:center;gap:2px}
.zoom button{border:0;padding:2px 6px;background:none;font-size:12px}
.zoom input{width:90px}
#zoomValue{min-width:46px;font-variant-numeric:tabular-nums}

/* inspector */
.inspHead{position:sticky;top:0;background:var(--panel);z-index:2;padding:12px 12px 0;border-bottom:1px solid var(--border)}
.inspHead h2{font-size:15px;margin:0 0 8px;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itabs{display:flex;gap:2px}
.itabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:5px 10px;color:var(--muted);font-weight:550}
.itabs button.active{color:var(--blue);border-bottom-color:var(--blue)}
#inspector{padding:2px 12px 30px}
details.sec{border-bottom:1px solid var(--border);padding:2px 0}
details.sec>summary{cursor:pointer;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:10px 0 8px;list-style:none;user-select:none}
details.sec>summary::after{content:'−';float:right;font-weight:400}
details.sec:not([open])>summary::after{content:'+'}
.secBody{padding-bottom:10px}
details.sub{margin:6px 0;border:1px dashed var(--border);border-radius:6px;padding:4px 8px}
details.sub summary{cursor:pointer;font-size:12px;color:var(--blue);padding:3px 0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);margin:0 0 8px;min-width:0}
.fld>span{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fld input,.fld select,.fld textarea{color:var(--text);font-size:12.5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 6px}
.row.r3{grid-template-columns:1fr 1fr 1fr}
.row>button{font-size:12px;padding:6px 4px}
.wide{width:100%;margin:4px 0}
label.check{display:flex;align-items:center;gap:7px;margin:7px 0;font-size:12px;cursor:pointer}
.seg{display:flex;gap:0;margin:0 0 8px;flex-wrap:wrap}
.seg button{flex:1;border-radius:0;margin-left:-1px;font-size:12px;padding:5px 4px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
.colorField{display:flex;gap:4px;align-items:center}
.colorField .hex{font-family:'Cascadia Mono',Consolas,Menlo,monospace;font-size:11.5px}
.withBtn{display:flex;gap:4px}
button.mini{font-size:10.5px;padding:2px 6px;border-radius:4px}
.portList{max-height:220px;overflow:auto}
.portrow{display:flex;gap:5px;margin-bottom:5px;align-items:center}
.portrow input{flex:1}
.portrow .key{font-size:11px;color:var(--muted);min-width:70px;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.portrow button{padding:4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.chips button{font-size:11px;padding:3px 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.typeHead{display:flex;gap:10px;align-items:center;padding:10px 0 4px}
.typeHead>div{flex:1;min-width:0}
.typeHead svg{flex:none}
.list{display:flex;flex-direction:column;gap:3px;margin:4px 0 8px}
.list button{text-align:left;font-size:12px;padding:5px 8px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.list em{color:var(--muted);font-style:normal}
.sw{display:inline-block;width:14px;height:4px;border-radius:2px;flex:none}
.iconGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-bottom:6px}
.iconGrid button{padding:5px 0;font-size:15px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.checks label.check{margin:3px 0;font-size:11.5px}
table.kv{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0 8px}
table.kv td{padding:3px 4px;border-bottom:1px solid var(--border)}
table.kv td:first-child{color:var(--muted);width:40%}
table.keys td:first-child{width:52%}
.themeGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.themeGrid button{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px;text-align:left}
.themeGrid span{display:flex;gap:3px;align-items:center;justify-content:center;width:38px;height:26px;border:1px solid;border-radius:4px;flex:none}
.themeGrid i{width:10px;height:10px;border-radius:2px;display:block}

/* layers & explorer */
.layerList{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.layer{display:flex;align-items:center;gap:3px;padding:3px;border:1px solid var(--border);border-radius:6px}
.layer.active{border-color:var(--blue-line);background:var(--blue-soft)}
.layer input{flex:1;border:0;background:transparent;padding:3px;font-size:12px}
.layer button{border:0;background:none;padding:3px 4px;font-size:12px;opacity:.35}
.layer button.on,.layer button:hover,.layer button[data-layer-active]{opacity:1}
.layer .muted{font-size:10.5px;min-width:18px;text-align:right}
#explorerSearch{margin-bottom:6px}
.exGroup{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:8px 0 3px}
.exItem{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;padding:3px 4px;font-size:12px;overflow:hidden}
.exItem span{flex:1;overflow:hidden;text-overflow:ellipsis}
.exItem em{font-style:normal;color:var(--muted);font-size:10.5px}
.exItem.active{background:var(--blue-soft);color:var(--blue)}

/* menus */
.menu{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);padding:5px;display:flex;flex-direction:column;min-width:200px;max-height:90vh;overflow:visible}
.menu button{text-align:left;border:0;font-size:12.5px;padding:6px 10px;display:flex;align-items:center;gap:8px;background:none;border-radius:5px}
.menu button:hover{background:var(--hover)}
.menu button kbd{margin-left:auto}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 2px}
.menu .sub{position:relative}
.menu .sub>button{width:100%}
.menu .submenu{display:none;position:absolute;left:100%;top:-5px;background:var(--panel);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);padding:5px;min-width:200px;max-height:70vh;overflow:auto}
.menu .sub:hover>.submenu{display:flex;flex-direction:column}
.menuTitle{font-size:11px;font-weight:700;color:var(--muted);padding:4px 8px 6px;text-transform:uppercase;letter-spacing:.8px}
.quickGrid{display:grid;grid-template-columns:repeat(4,72px);gap:3px;padding:2px}
.quickGrid button{flex-direction:column;align-items:center;font-size:10px;padding:5px 2px;white-space:normal;text-align:center}

/* dialogs */
dialog{border:1px solid var(--border);border-radius:14px;max-width:min(560px,94vw);width:560px;padding:0;box-shadow:var(--shadow);background:var(--panel);color:var(--text)}
dialog.wide{width:min(1020px,96vw);max-width:96vw}
dialog::backdrop{background:#0c1a2e66}
dialog.floating{position:fixed;inset:auto 316px auto auto;top:150px;margin:0;width:400px;max-height:calc(100vh - 220px);display:flex;flex-direction:column;z-index:50}
dialog.floating .dlgBody{overflow:auto}
dialog header{display:flex;align-items:center;padding:14px 18px 8px}
dialog header h2{font-size:16px;margin:0;color:var(--strong);flex:1}
dialog .x{border:0;background:none;font-size:20px;padding:0 6px;line-height:1}
.dlgBody{padding:4px 18px 18px;max-height:calc(90vh - 60px);overflow:auto}
.dlgBody footer{display:flex;justify-content:flex-end;gap:8px;padding-top:14px;position:sticky;bottom:-18px;background:var(--panel);padding-bottom:4px}
.dlgBody p,.dlgBody li{line-height:1.6}
ul.help{padding-left:18px}ul.help li{margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;border-top:1px solid var(--border);padding-top:10px;margin-top:6px}
.opts .fld{width:180px;margin:0}
.dtabs{display:flex;gap:4px;margin-bottom:10px}
.tplGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tpl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:8px;text-align:left;white-space:normal}
.tpl .thumb{width:100%;height:150px;border:1px solid var(--border);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:4px}
.tpl .thumb svg{width:100%;height:100%}
.tpl .thumb.blank{font-size:34px;color:var(--muted)}
.tpl span{font-size:11.5px;color:var(--muted);line-height:1.4}
.tableWrap{overflow:auto;max-height:56vh;border:1px solid var(--border);border-radius:8px}
table.report{border-collapse:collapse;font-size:12px;width:100%}
table.report th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:650;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
table.report td{padding:4px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
table.report.edit td{padding:3px}
table.report.edit input{padding:4px 5px;font-size:12px}
.chipsRow{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.chipsRow button{font-size:11.5px;padding:4px 9px;border-radius:20px}
.issues{display:flex;flex-direction:column;gap:3px}

/* print preview */
#printPreview{position:fixed;inset:0;background:#d5dce6;z-index:100;overflow:auto}
.previewbar{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);box-shadow:0 1px 8px #1232;z-index:1}

body.presenting header.top,body.presenting .ribbonTabs,body.presenting .ribbon,body.presenting footer.status,body.presenting aside,body.presenting .ruler,body.presenting .rulerCorner,body.presenting #hint,body.presenting #minimap{display:none!important}

body.presenting #canvas{left:0;top:0;width:100%;height:100%}

@media (max-width:860px){body{grid-template-rows:48px 32px 70px 1fr 30px}.layout{grid-template-columns:0 1fr 0}.workarea{grid-column:1/-1}aside.left,aside.right{position:fixed;top:182px;bottom:30px;width:280px;z-index:40;box-shadow:var(--shadow);display:none}aside.left{left:0}aside.right{right:0}body.showLeft aside.left,body.showRight aside.right{display:flex;flex-direction:column}.brand span,.doc .sub,#cursorPos,#pageInfo,.layerPick{display:none}.doc input{width:130px}#minimap{display:none}.two{grid-template-columns:1fr}}
@media print{body{overflow:visible;background:#fff;display:block}body>*{display:none!important}body>#printPreview{display:block!important;position:static;background:#fff;overflow:visible}#printPreview>.previewbar{display:none!important}#printPages{display:block;padding:0}.print-sheet{box-shadow:none;margin:0;break-after:page;page-break-after:always}.print-sheet:last-child{break-after:auto;page-break-after:auto}}

/* packs, workspace, online icons */
.packBar{margin:0 0 6px}
.packBar button{font-size:11.5px;padding:5px 6px}
details.packCat>summary{color:var(--blue)}
.iconGridOnline .stencil img{width:34px;height:34px;object-fit:contain}

.packRow button{font-size:12px;padding:4px 8px}
.h3{font-size:13px;margin:16px 0 4px;color:var(--strong)}

<script>
// Port Network Studio v3 — document model and geometry.
// Evolved from the Port v2 "Network Architecture Studio" model: a drawing is a list of pages,
// each page a flat list of items (node | edge | zone | text | table | legend) with absolute labels.
const Core=(()=>{
const copy=x=>x===undefined?undefined:JSON.parse(JSON.stringify(x));
const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const PX=96/25.4; // px per mm at 96 dpi
const FONT="Segoe UI, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif";
const MONO="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace";
const PAPERS={A4:[210,297],A3:[297,420],A2:[420,594],A1:[594,841],A0:[841,1189],Letter:[215.9,279.4],Legal:[215.9,355.6],Tabloid:[279.4,431.8]};
const KINDS=['node','edge','zone','text','table','legend'];

// ---------- text measurement ----------
let ctx2d=null;const widths=new Map();
function textWidth(s,size=13,bold=false,font=FONT,italic=false){
  s=String(s??'');const key=s+'\u0001'+size+(bold?'b':'')+(italic?'i':'')+font;let w=widths.get(key);if(w!==undefined)return w;
  if(typeof document!=='undefined'){ctx2d??=document.createElement('canvas').getContext('2d');ctx2d.font=`${italic?'italic ':''}${bold?'650 ':''}${size}px ${font||FONT}`;w=ctx2d.measureText(s).width}else w=s.length*size*.55;
  if(widths.size>20000)widths.clear();widths.set(key,w);return w}
function textLines(l,text=l.text){const max=l.wrapWidth||0;return String(text??'').split('\n').flatMap(line=>{if(!max||textWidth(line,l.size,l.bold,l.font,l.italic)<=max)return[line];const out=[];let cur='';for(const word of line.split(/\s+/)){const next=cur?cur+' '+word:word;if(cur&&textWidth(next,l.size,l.bold,l.font,l.italic)>max){out.push(cur);cur=word}else cur=next}out.push(cur);return out})}
// Box of a label relative to its anchor (x,y = baseline of first line), before rotation.
function labelMetrics(l,text){const lines=textLines(l,text),w=Math.max(1,...lines.map(t=>textWidth(t,l.size,l.bold,l.font,l.italic))),lh=l.size*1.25,h=(lines.length-1)*lh+l.size*1.2,left=l.align==='start'?0:l.align==='end'?-w:-w/2;return{lines,w,h,lh,left,top:-l.size*.95}}
let resolveText=(owner,l)=>l.text; // replaced by the app to substitute {{fields}}
function setResolver(fn){resolveText=fn}

// ---------- boxes and bounds ----------
function corners(n){const r=n.rotation||0;if(!r)return[[n.x,n.y],[n.x+n.w,n.y],[n.x+n.w,n.y+n.h],[n.x,n.y+n.h]];const a=r*Math.PI/180,cx=n.x+n.w/2,cy=n.y+n.h/2;return[[-n.w/2,-n.h/2],[n.w/2,-n.h/2],[n.w/2,n.h/2],[-n.w/2,n.h/2]].map(([x,y])=>[cx+x*Math.cos(a)-y*Math.sin(a),cy+x*Math.sin(a)+y*Math.cos(a)])}
function labelCorners(owner,l){const m=labelMetrics(l,resolveText(owner,l)),a=(l.rotation||0)*Math.PI/180,pad=4;return[[m.left-pad,m.top-pad],[m.left+m.w+pad,m.top-pad],[m.left+m.w+pad,m.top+m.h+pad],[m.left-pad,m.top+m.h+pad]].map(([x,y])=>[l.x+x*Math.cos(a)-y*Math.sin(a),l.y+x*Math.sin(a)+y*Math.cos(a)])}
let samplePoints=e=>e.points; // replaced by connectors.js for curves
function setSampler(fn){samplePoints=fn}
function points(n,labels=false){const pts=n.kind==='edge'?samplePoints(n):corners(n);if(labels)for(const l of n.labels||[])pts.push(...labelCorners(n,l));return pts}
function bounds(items,labels=false){const pts=items.flatMap(n=>points(n,labels));if(!pts.length)return{x:0,y:0,w:1,h:1};let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;for(const[x,y]of pts){if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y}return{x:x0,y:y0,w:Math.max(1,x1-x0),h:Math.max(1,y1-y0)}}
const box=n=>n.kind==='edge'?bounds([n]):{x:n.x,y:n.y,w:n.w,h:n.h};
const inside=(a,b,tol=0)=>a.x>=b.x-tol&&a.y>=b.y-tol&&a.x+a.w<=b.x+b.w+tol&&a.y+a.h<=b.y+b.h+tol;
const overlaps=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const center=n=>{const b=box(n);return[b.x+b.w/2,b.y+b.h/2]};

// ---------- transforms ----------
function move(n,dx,dy){if(n.kind==='edge')n.points=n.points.map(p=>[p[0]+dx,p[1]+dy]);else{n.x+=dx;n.y+=dy}(n.labels||[]).forEach(l=>{if(!l.anchor){l.x+=dx;l.y+=dy}})}
function scale(n,b,sx,sy,fonts=true,weights=false){const tr=p=>[b.x+(p[0]-b.x)*sx,b.y+(p[1]-b.y)*sy],k=Math.min(Math.abs(sx),Math.abs(sy));
  if(n.kind==='edge')n.points=n.points.map(tr);else{[n.x,n.y]=tr([n.x,n.y]);n.w*=sx;n.h*=sy}
  if(n.kind==='table'){n.cols=n.cols.map(c=>c*sx);n.rowH*=sy;if(fonts)n.size*=k}
  (n.labels||[]).forEach(l=>{if(!l.anchor)[l.x,l.y]=tr([l.x,l.y]);if(fonts)l.size=Math.max(4,l.size*k);if(l.wrapWidth)l.wrapWidth*=Math.abs(sx)});if(weights&&n.strokeWidth)n.strokeWidth*=k}
function rotateVec([x,y],deg){const a=deg*Math.PI/180;return[x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)]}
function portPoint(n,p){const[x,y]=rotateVec([(p.x-.5)*n.w*(n.flipX?-1:1),(p.y-.5)*n.h*(n.flipY?-1:1)],n.rotation||0);return[n.x+n.w/2+x,n.y+n.h/2+y]}
// Direction a connector leaves a port: outward normal of the nearest side, after flip/rotation.
function portDir(n,p){const d=[p.x,1-p.x,p.y,1-p.y],m=Math.min(...d);if(m>.35)return null;const i=d.indexOf(m);let v=[[-1,0],[1,0],[0,-1],[0,1]][i];v=[v[0]*(n.flipX?-1:1),v[1]*(n.flipY?-1:1)];v=rotateVec(v,n.rotation||0);return Math.abs(v[0])>=Math.abs(v[1])?(v[0]>0?'right':'left'):(v[1]>0?'down':'up')}
// Convert a page point to normalised local coordinates of a node (inverse of portPoint).
function localPoint(n,p){const[x,y]=rotateVec([p[0]-n.x-n.w/2,p[1]-n.y-n.h/2],-(n.rotation||0));return[.5+x/n.w*(n.flipX?-1:1),.5+y/n.h*(n.flipY?-1:1)]}

// ---------- factories ----------
function label(text,x,y,size=12){return{id:uid(),text,x,y,size,color:'#34465e',rotation:0,bold:false,background:false,align:'middle'}}
const defaultPorts=()=>[{id:uid(),x:.5,y:0,name:'Top'},{id:uid(),x:1,y:.5,name:'Right'},{id:uid(),x:.5,y:1,name:'Bottom'},{id:uid(),x:0,y:.5,name:'Left'}];
function node(type,x,y,name,w=64,h=64){return{id:uid(),kind:'node',type,x,y,w,h,rotation:0,stroke:'#2f5ea8',strokeWidth:2,fill:'#ffffff',display:'symbol',ports:defaultPorts(),labels:[label(name??type,x+w/2,y+h+16)],data:{}}}
function edge(points,from=null,to=null){return{id:uid(),kind:'edge',points,from,to,routing:'auto',stroke:'#4a6fa5',strokeWidth:2,dash:'',startMarker:'none',endMarker:'none',labels:[],data:{}}}
function zone(name,x,y,w,h,fill='#eef4fb',stroke='#9fb4ce'){const l=label(name,x+16,y+26,15);l.align='start';l.bold=true;return{id:uid(),kind:'zone',x,y,w,h,fill,stroke,strokeWidth:1.5,dash:'7 5',style:'plain',labels:[l],data:{}}}
function text(t,x,y,w=240,h=60,size=13){const l=label(t,x+10,y+size+8,size);l.align='start';return{id:uid(),kind:'text',x,y,w,h,labels:[l]}}
function page(name='Page 1'){return{id:uid(),name,paper:'A3',orientation:'landscape',margin:10,printSizing:'fit',customW:420,customH:297,bg:'#ffffff',background:null,isBackground:false,guideLines:[],items:[]}}
// Device fields. `scope` limits a field to stencil ids (empty = every device).
const SWITCHES=['switch','l3switch','industrialswitch','poe','rk-switch'],POE_LOADS=['camera','domecamera','ptzcamera','anpr','thermal','wap','ipphone','accesscontrol','intercom','sensor','iotgateway','display','thinclient'],CAMERAS=['camera','domecamera','ptzcamera','anpr','thermal'],RECORDERS=['nvr','storage','nas','rk-nvr','rk-storage'];
const FIELDS=[{key:'hostname',label:'Hostname'},{key:'ip',label:'IP address'},{key:'mgmtIp',label:'Management IP'},{key:'vlan',label:'VLAN'},{key:'model',label:'Model'},{key:'vendor',label:'Vendor'},{key:'serial',label:'Serial no.'},{key:'os',label:'OS / firmware'},{key:'location',label:'Location'},{key:'status',label:'Status',options:['Existing','New','Planned','To remove','Spare']},{key:'owner',label:'Owner'},{key:'power',label:'Power draw (W)',type:'number'},{key:'poeBudget',label:'PoE budget (W)',type:'number',scope:SWITCHES},{key:'poeDraw',label:'PoE draw (W)',type:'number',scope:POE_LOADS},{key:'bitrate',label:'Stream bitrate (Mbps)',type:'number',scope:CAMERAS},{key:'retention',label:'Retention (days)',type:'number',scope:RECORDERS},{key:'storageTB',label:'Usable storage (TB)',type:'number',scope:RECORDERS},{key:'unitPrice',label:'Unit price',type:'number'},{key:'notes',label:'Notes',multiline:true}];
const LINK_FIELDS=[{key:'speed',label:'Speed'},{key:'media',label:'Media'},{key:'vlans',label:'VLANs'},{key:'cableId',label:'Cable ID'},{key:'circuit',label:'Circuit ID'},{key:'provider',label:'Provider'},{key:'notes',label:'Notes',multiline:true}];
const ZONE_FIELDS=[{key:'subnet',label:'Subnet (CIDR)'},{key:'vlan',label:'VLAN ID'},{key:'gateway',label:'Gateway'},{key:'security',label:'Security level'},{key:'notes',label:'Notes',multiline:true}];
function newDoc(name='Untitled network'){const now=new Date().toISOString();return{version:3,name,meta:{author:'',company:'',revision:'1.0',description:'',created:now,modified:now},theme:'port',layers:[{id:uid(),name:'Main',visible:true,locked:false,print:true}],fields:copy(FIELDS),linkFields:copy(LINK_FIELDS),display:{fields:[],colorBy:'',showIfLabels:true},vlans:[],pages:[page('Page 1')]}}

// ---------- structure helpers ----------

<script>
// Shape catalogue: parametric basic shapes, rack elevations, link types, themes and colour palettes.
// Device artwork lives in stencils.js (Stencils.shapes); this module adds everything that is generated.
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs={},parent){const n=document.createElementNS(NS,tag);for(const k in attrs){const v=attrs[k];if(v!==undefined&&v!==null&&v!==false)n.setAttribute(k,v)}parent?.append(n);return n}

const Shapes=(()=>{
const C=Core,f=v=>+v.toFixed(2);
const ST=()=>(typeof Stencils!=='undefined'?Stencils:{categories:[],shapes:{}});

// ---------- basic shapes (paths are rebuilt from w/h so strokes never distort) ----------
const rr=(w,h,r)=>{r=Math.min(r,w/2,h/2);return`M${r} 0H${f(w-r)}A${r} ${r} 0 0 1 ${w} ${r}V${f(h-r)}A${r} ${r} 0 0 1 ${f(w-r)} ${h}H${r}A${r} ${r} 0 0 1 0 ${f(h-r)}V${r}A${r} ${r} 0 0 1 ${r} 0Z`};
const basic={
  rect:{name:'Rectangle',w:120,h:70,paths:(w,h)=>[{d:`M0 0H${w}V${h}H0Z`}]},
  roundrect:{name:'Rounded rectangle',w:120,h:70,paths:(w,h)=>[{d:rr(w,h,10)}]},
  pill:{name:'Pill / terminator',w:130,h:50,paths:(w,h)=>[{d:rr(w,h,h/2)}]},
  ellipse:{name:'Ellipse',w:110,h:70,paths:(w,h)=>[{d:`M0 ${h/2}A${w/2} ${h/2} 0 1 0 ${w} ${h/2}A${w/2} ${h/2} 0 1 0 0 ${h/2}Z`}]},
  diamond:{name:'Decision',w:110,h:80,paths:(w,h)=>[{d:`M${w/2} 0L${w} ${h/2}L${w/2} ${h}L0 ${h/2}Z`}]},
  triangle:{name:'Triangle',w:90,h:80,paths:(w,h)=>[{d:`M${w/2} 0L${w} ${h}H0Z`}]},
  hexagon:{name:'Hexagon',w:110,h:80,paths:(w,h)=>{const k=Math.min(w*.25,h*.5);return[{d:`M${f(k)} 0H${f(w-k)}L${w} ${h/2}L${f(w-k)} ${h}H${f(k)}L0 ${h/2}Z`}]}},
  parallelogram:{name:'Parallelogram',w:120,h:70,paths:(w,h)=>{const k=Math.min(w*.2,24);return[{d:`M${k} 0H${w}L${f(w-k)} ${h}H0Z`}]}},
  cylinder:{name:'Cylinder',w:90,h:100,paths:(w,h)=>{const e=Math.min(h*.14,w*.18);return[{d:`M0 ${e}A${w/2} ${e} 0 0 1 ${w} ${e}V${f(h-e)}A${w/2} ${e} 0 0 1 0 ${f(h-e)}Z`},{d:`M0 ${e}A${w/2} ${e} 0 0 0 ${w} ${e}`,open:true}]}},
  document:{name:'Document',w:110,h:80,paths:(w,h)=>{const k=h*.12;return[{d:`M0 0H${w}V${f(h-k)}C${f(w*.75)} ${f(h-3*k)} ${f(w*.25)} ${f(h+k)} 0 ${f(h-k)}Z`}]}},
  note:{name:'Sticky note',w:140,h:110,fill:'#fff7c2',stroke:'#c9a227',paths:(w,h)=>{const k=Math.min(18,w/4,h/4);return[{d:`M0 0H${w}V${f(h-k)}L${f(w-k)} ${h}H0Z`},{d:`M${f(w-k)} ${h}V${f(h-k)}H${w}`,open:true}]}},
  cloudshape:{name:'Cloud outline',w:150,h:90,paths:(w,h)=>{const X=v=>f(v*w),Y=v=>f(v*h);return[{d:`M${X(.24)} ${Y(.92)}C${X(.04)} ${Y(.92)} ${X(0)} ${Y(.6)} ${X(.17)} ${Y(.53)}C${X(.12)} ${Y(.24)} ${X(.42)} ${Y(.08)} ${X(.55)} ${Y(.28)}C${X(.66)} ${Y(.02)} ${X(.98)} ${Y(.14)} ${X(.9)} ${Y(.46)}C${X(1.02)} ${Y(.56)} ${X(.99)} ${Y(.92)} ${X(.78)} ${Y(.92)}Z`}]}},
  arrow:{name:'Block arrow',w:130,h:60,paths:(w,h)=>{const k=Math.min(w*.35,h*.9);return[{d:`M0 ${f(h*.28)}H${f(w-k)}V0L${w} ${h/2}L${f(w-k)} ${h}V${f(h*.72)}H0Z`}]}},
  chevron:{name:'Chevron / stage',w:130,h:60,paths:(w,h)=>{const k=Math.min(w*.25,h*.5);return[{d:`M0 0H${f(w-k)}L${w} ${h/2}L${f(w-k)} ${h}H0L${f(k)} ${h/2}Z`}]}},
  frame:{name:'Frame / boundary',w:220,h:150,fill:'none',dash:'6 4',paths:(w,h)=>[{d:`M0 0H${w}V${h}H0Z`}]},
};

// ---------- rack elevations ----------
const RU=18,RACK={rail:16,top:26,bottom:16,inner:190};
const rackItems={
  'rk-server':{name:'Server 1U',u:1,face:'server'},'rk-server2':{name:'Server 2U',u:2,face:'server'},'rk-blade':{name:'Blade chassis 6U',u:6,face:'blade'},
  'rk-storage':{name:'Storage array 2U',u:2,face:'storage'},'rk-nvr':{name:'NVR / recorder 2U',u:2,face:'storage'},
  'rk-switch':{name:'Switch 1U · 48p',u:1,face:'switch'},'rk-switch24':{name:'Switch 1U · 24p',u:1,face:'switch24'},'rk-router':{name:'Router 2U',u:2,face:'router'},'rk-firewall':{name:'Firewall 1U',u:1,face:'firewall'},
  'rk-patch':{name:'Patch panel 1U',u:1,face:'patch'},'rk-fiber':{name:'Fibre panel 1U',u:1,face:'fiber'},'rk-cable':{name:'Cable manager 1U',u:1,face:'cable'},
  'rk-ups':{name:'UPS 2U',u:2,face:'ups'},'rk-pdu':{name:'PDU 1U',u:1,face:'pdu'},'rk-kvm':{name:'KVM console 1U',u:1,face:'kvm'},'rk-shelf':{name:'Shelf 2U',u:2,face:'shelf'},'rk-blank':{name:'Blanking panel 1U',u:1,face:'blank'},
};
const rackSize=units=>({w:RACK.inner+2*RACK.rail,h:units*RU+RACK.top+RACK.bottom});
const rackInner=r=>({x:r.x+RACK.rail,y:r.y+RACK.top,w:RACK.inner,h:(r.units||42)*RU});
// U position (1 = bottom) of an equipment box inside a rack.
const rackU=(r,n)=>{const i=rackInner(r);return Math.round((i.y+i.h-(n.y+n.h))/RU)+1};
function drawRack(n,g){
  const units=n.units||42,s=n.stroke||'#475569',i={x:RACK.rail,y:RACK.top,w:RACK.inner,h:units*RU};
  el('rect',{x:0,y:0,width:n.w,height:n.h,rx:5,fill:n.fill||'#f1f5f9',stroke:s,'stroke-width':2},g);
  el('rect',{x:i.x,y:i.y,width:i.w,height:i.h,fill:'#ffffff',stroke:s,'stroke-width':.8,'stroke-opacity':.6},g);
  const lines=[];for(let u=1;u<units;u++)lines.push(`M${i.x} ${f(i.y+u*RU)}H${i.x+i.w}`);el('path',{d:lines.join(''),stroke:s,'stroke-opacity':.13,'stroke-width':.8},g);
  for(const x of[3,n.w-RACK.rail+3])el('rect',{x,y:i.y,width:RACK.rail-6,height:i.h,fill:s,'fill-opacity':.12},g);
  for(let u=1;u<=units;u++){const y=i.y+(units-u)*RU+RU/2+3,t=el('text',{x:RACK.rail/2,y,'text-anchor':'middle','font-size':7.5,fill:s,'font-family':C.FONT},g);t.textContent=u;const t2=el('text',{x:n.w-RACK.rail/2,y,'text-anchor':'middle','font-size':7.5,fill:s,'font-family':C.FONT},g);t2.textContent=u}
  el('rect',{x:8,y:6,width:n.w-16,height:RACK.top-12,rx:3,fill:s,'fill-opacity':.85},g);
  for(const x of[10,n.w-30])el('rect',{x,y:n.h-RACK.bottom+4,width:20,height:RACK.bottom-6,rx:2,fill:s,'fill-opacity':.6},g);
}
function drawFace(n,g){
  const w=n.w,h=n.h,face=rackItems[n.type]?.face||'blank',s=n.stroke||'#475569',body=n.fill||'#e2e8f0',dark='#334155',led='#22c55e';
  el('rect',{x:0,y:0,width:w,height:h,rx:1.5,fill:body,stroke:s,'stroke-width':1},g);

function applyTheme(doc,id){
  const t=themes[id];if(!t)return;doc.theme=id;
  for(const p of doc.pages){p.bg=t.page;let z=0;
    for(const n of p.items){

<script>
/* Port Network Studio v3 — orthogonal "dynamic connector" router (pure JS, no deps).
 *
 *   Router.route(a, b, obstacles, opts) -> [[x,y], ...]
 *
 * Method: a sparse orthogonal visibility grid (lines at every inflated obstacle edge,
 * the port stubs, the window edges and offsets of existing connector segments), then
 * A* over (grid node, heading) so every bend costs `bendPenalty`, with an admissible
 * "length + minimum bends" heuristic. The resulting path is simplified and "nudged":
 * free Z-jogs slide to the middle of their channel (the classic Visio look) without
 * touching obstacles or sitting on top of other connectors.
 * Coordinates: SVG style (x right, y down), px. Rects are {x,y,w,h} with x,y top-left.
 */

  'use strict';

    const lx = Math.min(x1, x2), hx = Math.max(x1, x2), ly = Math.min(y1, y2), hy = Math.max(y1, y2);

  // Layered graph of one component with dummy vertices on long edges.

  // (4) crossing minimisation: DFS initial order, alternating median/barycenter sweeps + adjacent

  // ======================= grid =======================
  function grid(nodes, opts) {

  // Circle order: BFS tree from the busiest node of each component (biggest component first),

    const seen = new Uint8Array(N.length), order = [];

  // ======================= circular =======================

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Port Network Studio</title>
<meta name="description" content="Browser-based, offline network diagram studio: Visio-style editing, network stencils, shape data, auto-routing, IP/VLAN planning, CCTV & PoE analysis, Visio and draw.io export.">
<meta name="theme-color" content="#376be5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23376be5'/%3E%3Cpath d='M9 10h6v5H9zM17 17h6v5h-6zM12 15v4.5h5' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css?v=9154743e">
<style id="printRules"></style>
</head>
<body>
<header class="top">
  <div class="brand" title="Port Network Studio">port<b>•</b><span>network studio</span></div>
  <div class="doc"><input id="docName" aria-label="Drawing name" spellcheck="false"><div class="sub" id="saveState">Ready</div></div>
  <div class="spacer"></div>
  <button class="searchBox" data-action="palette" title="Search every tool, setting, shape, device and page (Ctrl+K or /)"><span class="i" data-icon="search"></span><span class="sbText">Search tools, shapes, devices…</span><kbd class="sbKey">Ctrl K</kbd></button>
  <div class="spacer"></div>
  <button class="tbtn" data-action="new" title="New from template (Ctrl+N)"><span class="i" data-icon="template"></span><span>Templates</span></button>
  <button class="tbtn" data-action="open" title="Open (Ctrl+O)"><span class="i" data-icon="open"></span><span>Open</span></button>
  <button class="tbtn primary" data-action="save" title="Save (Ctrl+S)"><span class="i" data-icon="save"></span><span>Save</span></button>
  <button class="tbtn" data-action="exportVsdx" title="Export to Microsoft Visio (.vsdx)"><span class="i" data-icon="visio"></span><span>Visio</span></button>
  <button class="tbtn" data-action="share" title="Copy a share link (the drawing travels inside the link)"><span class="i" data-icon="share"></span><span>Share</span></button>
  <button class="tbtn" data-action="present" title="Present (full screen)"><span class="i" data-icon="present"></span></button>
  <button class="tbtn" data-action="help" title="Guide"><span class="i" data-icon="help"></span></button>
</header>
<nav class="ribbonTabs" id="ribbonTabs" aria-label="Ribbon"></nav>
<div class="ribbon" id="ribbon" role="toolbar"></div>
<div class="layout">
  <aside class="left" id="leftPanel">
    <div class="ltabs"><button data-ltab="shapes" class="active">Shapes</button><button data-ltab="icons" title="Search 200,000+ open-source icons online">Icons</button><button data-ltab="templates" title="Drag templates, saved drawings, pages or zone blocks into this drawing">Templates</button><button data-ltab="layers">Layers</button><button data-ltab="explorer">Explorer</button></div>
    <div id="shapesPane" class="pane">
      <div class="searchRow"><input id="search" placeholder="Search shapes — fw, nvr, ap…" aria-label="Search shapes" autocomplete="off"><select id="paletteDisplay" title="Palette preview style"><option value="symbol">Symbol</option><option value="tile">Tile</option><option value="circle">Circle</option></select></div>
      <div class="row packBar"><button data-action="importShapes" title="SVG files, a folder, a ZIP of icons (e.g. vendor packs), a draw.io library or images">＋ Import shapes</button><button data-action="managePacks" title="Rename, export or remove shape packs">Packs…</button></div>
      <div id="palette"></div>
    </div>
    <div id="iconsPane" class="pane" hidden>
      <div class="searchRow"><input id="iconSearch" placeholder="Search icons online — router, cctv, aws…" autocomplete="off"><select id="iconSet" title="Icon sets"><option value="network">IT &amp; general</option><option value="brands">Brands &amp; logos</option><option value="all">All sets</option></select></div>
      <div id="iconResults"></div>
    </div>
    <div id="templatesPane" class="pane" hidden></div>
    <div id="layersPane" class="pane" hidden></div>
    <div id="explorerPane" class="pane" hidden><input id="explorerSearch" placeholder="Filter by name, IP, model…" autocomplete="off"><div id="explorerList"></div></div>
  </aside>
  <main id="workarea" class="workarea">
    <canvas id="rulerX" class="ruler x"></canvas><canvas id="rulerY" class="ruler y"></canvas><div class="rulerCorner" data-action="toggle_rulers" title="Hide rulers"></div>
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg" aria-label="Drawing canvas"><g id="pageLayer"></g><g id="bgLayer"></g><g id="scene"></g><g id="overlay"></g></svg>
    <div id="hint"></div>
    <button class="focusExit" data-action="focusMode" title="Exit focus mode (Ctrl+.)">Exit focus ✕</button>
    <div id="toast" hidden role="status"></div>
    <textarea id="inlineText" hidden aria-label="Edit text"></textarea>
    <div id="minimap" title="Overview — click or drag to navigate"><button class="miniClose" data-action="toggle_minimap" title="Hide overview (View ▸ Overview)">×</button><svg id="miniSvg" preserveAspectRatio="xMidYMid meet"><g id="miniScene"></g><rect id="miniView" fill="#376be522" stroke="#376be5"></rect></svg></div>
    <div class="presentBar"><button onclick="presentStep(-1)">◀</button><span id="presentPage"></span><button onclick="presentStep(1)">▶</button><button data-action="present">Exit</button></div>
  </main>
  <aside class="right" id="rightPanel">
    <div class="inspHead"><h2 id="inspectorTitle">Page</h2><div id="inspectorTabs" class="itabs"></div></div>
    <div id="inspector"></div>
    <div id="sidePanel" hidden></div>
  </aside>
</div>
<footer class="status">
  <div id="pageTabs" class="pageTabs"></div>
  <div class="spacer"></div>
  <button id="issueCount" class="issueBtn" data-action="check" hidden></button>
  <button id="reviewBadge" class="reviewBadge" data-action="reviewMode" hidden></button>
  <button id="revInfo" class="revBtn" data-action="newRevision" title="Revisions">Rev</button>
  <span id="selectionCount">Ready</span>
  <span id="cursorPos" class="mono">0 , 0 mm</span>
  <label class="layerPick" title="Active layer for new shapes">Layer <select id="layerSel"></select></label>
  <span id="pageInfo"></span>
  <div class="zoom"><button data-action="zoomOut" title="Zoom out">−</button><input id="zoomRange" type="range" min="-330" max="300" value="0" aria-label="Zoom"><button data-action="zoomIn" title="Zoom in">＋</button><button id="zoomValue" data-action="zoom100" title="Actual size">100%</button><button data-action="fit" title="Fit the view to the page">Fit</button><button data-action="fitPageDialog" title="Fit the page (and its border) to the drawing…">Fit page</button></div>
</footer>

<div id="contextMenu" class="menu" hidden></div>
<div id="fileMenu" class="menu fileMenu" hidden></div>
<div id="ribbonPop" class="menu ribbonPop" hidden></div>
<input id="fileInput" type="file" accept=".json,.vsdx,.vsdm,.vstx,.vssx,.vssm,.vsd,.vss,.csv,.txt,image/*" hidden>
<input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml" hidden>
<input id="libraryInput" type="file" accept=".json" hidden>
<input id="shapeInput" type="file" accept=".vssx,.vssm,.svg,.zip,.xml,.drawio,.json,.png,.jpg,.jpeg,.gif,.webp" multiple hidden>
<input id="folderInput" type="file" webkitdirectory multiple hidden>
<div id="printPreview" hidden><div class="previewbar"><strong>Print preview</strong><span id="printWarning" class="muted"></span><div class="spacer"></div><button data-action="closePrint">Back to drawing</button><button data-action="printNow" class="primary">Print / Save as PDF</button></div><div id="printPages"></div></div>
<dialog id="dlg"></dialog>
<noscript>Port Network Studio needs JavaScript.</noscript>

<script src="js/core.js?v=3cca1d52"></script>
<script src="js/stencils.js?v=51c82413"></script>
<script src="js/packs/extended.js?v=05ccca0c"></script>
<script src="js/shapes.js?v=6099618b"></script>
<script src="js/icons.js?v=22dcf35a"></script>
<script src="js/router.js?v=0c90e0a3"></script>
<script src="js/layout.js?v=51056f31"></script>
<script src="js/connectors.js?v=69f2aecd"></script>
<script src="js/constraints.js?v=41a5ebd3"></script>
<script src="js/merge.js?v=5c93b5a8"></script>
<script src="js/scale.js?v=39784bcb"></script>
<script src="js/ports.js?v=80e5353e"></script>
<script src="js/racks.js?v=048b4a27"></script>
<script src="js/revisions.js?v=3ef91001"></script>
<script src="js/checks.js?v=3b96afd6"></script>
<script src="js/review.js?v=4c4feb50"></script>
<script src="js/vsdx.js?v=b99023c1"></script>
<script src="js/visio.js?v=5f2977a0"></script>
<script src="js/render.js?v=155f464b"></script>
<script src="js/analysis.js?v=eea4c9df"></script>
<script src="js/io.js?v=54cd4851"></script>
<script src="js/packs.js?v=e3c44150"></script>
<script src="js/builder.js?v=b9669f82"></script>
<script src="js/templates.js?v=6669f418"></script>
<script src="js/app.js?v=4a8dff3e"></script>
<script src="js/inspector.js?v=dd4d9060"></script>
<script src="js/actions.js?v=c769deeb"></script>
<script src="js/panels.js?v=aef888b9"></script>
<script src="js/workspace.js?v=c4909957"></script>
<script src="js/tplpanel.js?v=20a3c26f"></script>
<script src="js/quick.js?v=53f2cc39"></script>
<script src="js/rackui.js?v=eef0dd1c"></script>
<script src="js/inventory.js?v=7dcc7727"></script>
<script src="js/select.js?v=95d243ce"></script>
<script src="js/reviewui.js?v=a9512c0e"></script>
<script src="js/search.js?v=ffb2f1db"></script>
<script src="js/tour.js?v=b00c28ec"></script>
<script src="js/main.js?v=3dd07505"></script>
</body>
</html>
